        zh:
          name: 开发与验收中的安全性测试
          description: 这种控制确保在开发和验收阶段进行安全测试，以识别弱点。
        pl:
          name: Testowanie bezpieczeństwa w procesie wytwarzania i odbioru
          description: Zabezpieczenie zapewnia przeprowadzanie testów bezpieczeństwa na etapach wytwarzania i odbioru
            w celu wykrycia słabości.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.5

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.30
