        es:
          name: Pruebas de seguridad en desarrollo y aceptación
          description: Este control garantiza que las pruebas de seguridad se lleven a cabo durante las fases de
            desarrollo y aceptación para identificar los puntos débiles.
        de:
          name: Sicherheitsprüfung bei Entwicklung und Abnahme
          description: Diese Steuerungsmaßnahme stellt sicher, dass Anwendungen und Systeme während Entwicklung,
