      description: This control ensures security testing is conducted during development and acceptance phases to
        identify weaknesses.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.29
      translations:
        fr:
          name: Tests de sécurité dans le développement et l'acceptation
          description: Cette mesure de sécurité garantit que des tests de sécurité sont effectués pendant les phases
            de développement et d'acceptation pour identifier les faiblesses.
        cs:
