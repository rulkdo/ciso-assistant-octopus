      translations:
        fr:
          name: Revue de la direction
        cs:
          name: Přezkoumání vedením
        sv:
          name: Ledningens genomgång
        es:
          name: Revisión por la dirección
        de:
          name: Managementbewertung
        zh:
          name: 管理权审查
        pl:
          name: Przegląd zarządzania
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      ref_id: 9.3.1
      name: General
      description: Review the ISMS periodically to ensure its suitability, adequacy, and effectiveness in achieving
        organizational objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      translations:
        fr:
          name: Généralités
          description: Examiner le SMSI périodiquement pour s’assurer de son adéquation, de son efficacité et de
            sa capacité à atteindre les objectifs organisationnels.
        cs:
          name: Obecné
          description: Pravidelně kontrolujte systém ISMS, abyste zajistili jeho vhodnost, přiměřenost a účinnost
            při dosahování cílů organizace.
        sv:
          name: Allmänt
          description: Granska ISMS med jämna mellanrum för att säkerställa dess lämplighet, tillräcklighet och
            effektivitet när det gäller att uppnå organisatoriska mål.
        es:
          name: General
          description: Revisar periódicamente el SGSI para garantizar su idoneidad, adecuación y eficacia en el
            logro de los objetivos de la organización.
        de:
          name: Allgemeines
          description: Managementbewertungen werden durchgeführt, um die Eignung, Angemessenheit und Wirksamkeit
            des ISMS sowie dessen Beitrag zur Erreichung der organisationalen Ziele zu beurteilen.
        zh:
          name: 常规
          description: 定期审查ISMS以确保其在实现组织目标方面的适用性、充分性和有效性。
        pl:
          name: Postanowienia ogólne
          description: Okresowy przegląd SZBI przez najwyższe kierownictwo w celu potwierdzenia jego przydatności,
            adekwatności i skuteczności.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1, 7.1

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-25 (art.
            8d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      ref_id: 9.3.2
      name: Management review inputs
      description: Include inputs such as audit results, ISMS performance, risk status, improvement opportunities,
        and required changes in the management review.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        fr:
          name: Eléments d'entrée de la revue de direction
          description: Inclure des éléments tels que les résultats d’audits, la performance du SMSI, l’état des
            risques, les opportunités d’amélioration et les changements nécessaires dans la revue de direction.
        cs:
          name: Vstupy pro přezkoumání vedením
          description: Do přezkoumání managementem zahrňte vstupy, jako jsou výsledky auditu, výkonnost ISMS, stav
            rizik, možnosti zlepšení a požadované změny.
        sv:
          name: Indata från ledningens genomgångar
          description: Inkludera indata som revisionsresultat, ISMS-prestanda, riskstatus, förbättringsmöjligheter
            och nödvändiga ändringar i ledningens granskning.
        es:
          name: Insumos para el examen de la gestión
          description: Incluya insumos como los resultados de la auditoría, el rendimiento del SGSI, el estado del
            riesgo, las oportunidades de mejora y los cambios necesarios en la revisión por la dirección.
        de:
          name: Eingaben für die Managementbewertung
          description: Für die Managementbewertung werden Auditberichte, Leistungsindikatoren, Vorfälle, Rückmeldungen,
            externe Änderungen, Risiken und Chancen sowie identifizierte Verbesserungsmöglichkeiten berücksichtigt.
        zh:
          name: 管理审查输入
          description: 包括审计结果、ISMS 绩效、风险状态、改进机会以及管理审查中所需的变更等输入。
        pl:
          name: Dane wejściowe do przeglądu zarządzania
          description: Uwzględnienie w przeglądzie m.in. wyników audytów, efektów działania SZBI, stanu ryzyka,
            możliwości doskonalenia i potrzebnych zmian.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1, 7.1

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-25 (art.
            8d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3.3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
      ref_id: 9.3.3
      name: Management review results
      description: Document the results of the management reviews, including decisions on improvements, ISMS changes,
        and resource requirements.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        fr:
          name: Résultats des revues de direction
          description: Documenter les résultats des revues de direction, y compris les décisions sur les améliorations,
            les modifications du SMSI et les besoins en ressources.
        cs:
          name: Výsledky z přezkoumání vedením
          description: Zdokumentujte výsledky přezkoumání managementem, včetně rozhodnutí o vylepšeních, změnách
            ISMS a požadavcích na zdroje.
        sv:
          name: Resultat av ledningens genomgång
          description: Dokumentera resultaten av ledningens genomgångar, inklusive beslut om förbättringar, ISMS-förändringar
            och resurskrav.
        es:
          name: Resultados de la revisión por la dirección
          description: Documentar los resultados de las revisiones de gestión, incluidas las decisiones sobre mejoras,
            cambios en el SGSI y requisitos de recursos.
        de:
          name: Ergebnisse der Managementbewertung
          description: Die Ergebnisse der Managementbewertung umfassen Entscheidungen zu Verbesserungen, Ressourcenbedarf,
            notwendigen Anpassungen des ISMS sowie die Festlegung von Prioritäten
        zh:
          name: 管理审查结果
          description: 记录管理审查的结果，包括改进决策、ISMS变更和资源需求。
        pl:
          name: Wyniki przeglądu zarządzania
          description: Udokumentowanie wyników przeglądu, w tym decyzji dotyczących doskonalenia, zmian w SZBI i
            potrzebnych zasobów.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1, 7.1

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-25 (art.
            8d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '10'
      name: Improvement
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Amélioration
        cs:
          name: Zlepšování
        sv:
          name: Förbättring
        es:
          name: Mejora
        de:
          name: Verbesserung
        zh:
          name: 改进
        pl:
          name: Doskonalenie
    - urn: urn:intuitem:risk:req_node:iso27001-2022:10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:10
      ref_id: '10.1'
      name: Continual improvement
      description: Identify and act on opportunities for continual improvement to enhance the ISMS's effectiveness
        and alignment with organizational goals.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      translations:
        fr:
          name: Amélioration continue
          description: Identifier et agir sur les opportunités d’amélioration continue pour renforcer l’efficacité
            du SMSI et son alignement avec les objectifs organisationnels.
        cs:
          name: Neustálé zlepšování
          description: Identifikovat a jednat na základě příležitostí k neustálému zlepšování s cílem zvýšit efektivitu
            a soulad ISMS s cíli organizace.
        sv:
          name: Ständiga förbättringar
          description: Identifiera och agera på möjligheter till ständiga förbättringar för att förbättra ISMS:s
            effektivitet och anpassning till organisatoriska mål.
        es:
          name: Mejora continua
          description: Identificar y actuar sobre las oportunidades de mejora continua para mejorar la eficacia
            del SGSI y su alineación con los objetivos de la organización.
        de:
          name: Fortlaufende Verbesserung
          description: Verbesserungspotenziale werden identifiziert, bewertet und umgesetzt, um Wirksamkeit, Effizienz
            und Reife des ISMS zu erhöhen und eine bestmögliche Ausrichtung an den organisatorischen Zielen sicherzustellen.
        zh:
          name: 持续改进
          description: 识别并采取行动，以持续改进，以提升ISMS的效能和与组织目标的一致性。
        pl:
          name: Ciągłe doskonalenie
          description: Identyfikowanie i wykorzystywanie możliwości ciągłego doskonalenia skuteczności SZBI.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.3

            Ustawa o KSC: KSC-12 (art. 8 ust. 1 pkt 2 lit. h)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:10
      ref_id: '10.2'
      name: Nonconformity and corrective action
      description: Address nonconformities by taking corrective actions, identifying root causes, and implementing
        measures to prevent recurrence while documenting the process.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      - urn:intuitem:risk:function:doc-pol:pol.incident
      - urn:intuitem:risk:function:doc-pol:doc.nc_log
      - urn:intuitem:risk:function:doc-pol:doc.proc_register
      - urn:intuitem:risk:function:doc-pol:doc.raci
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        fr:
          name: Non-conformité et action corrective
          description: Traiter les non-conformités en prenant des actions correctives, en identifiant les causes
            profondes et en mettant en œuvre des mesures pour éviter leur récurrence, tout en documentant le processus.
        cs:
          name: Neshoda a nápravná opatření
          description: Řešte neshody přijetím nápravných opatření, identifikací hlavních příčin a implementací opatření
            k prevenci jejich opakování a zároveň dokumentujte proces.
        sv:
          name: Avvikelse och korrigerande åtgärder
          description: Ta itu med avvikelser genom att vidta korrigerande åtgärder, identifiera grundorsaker och
            implementera åtgärder för att förhindra upprepning samtidigt som du dokumenterar processen.
        es:
          name: No conformidad y acciones correctivas
          description: Aborde las no conformidades tomando medidas correctivas, identificando las causas raíz e
            implementando medidas para evitar que se repitan mientras documenta el proceso.
        de:
          name: Nichtkonformität und Korrekturmaßnahmen
          description: Nichtkonformitäten werden behandelt, indem Korrekturmaßnahmen ergriffen, die zugrunde liegenden
            Ursachen identifiziert und Maßnahmen umgesetzt werden, die ein erneutes Auftreten verhindern sollen
        zh:
          name: 不符合规范与纠正措施
          description: 通过采取纠正措施、识别根本原因并实施防止复发措施，同时记录流程，解决不合规问题。
        pl:
          name: Niezgodność i działania korygujące
          description: Reagowanie na niezgodności przez działania korygujące, ustalenie przyczyn źródłowych i działania
            zapobiegające powtórzeniu, z udokumentowaniem przebiegu.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      assessable: false
      depth: 1
      ref_id: annex-a
      name: Statement of Applicability
      implementation_groups:
      - SoA
      translations:
        fr:
          name: Déclaration d'applicabilité
        cs:
          name: Prohlášení o aplikovatelnosti
        sv:
          name: Uttalande om tillämplighet
        es:
          name: Declaración de aplicabilidad
        de:
          name: Erklärung zur Anwendbarkeit
        zh:
          name: 适用性说明
        pl:
          name: Deklaracja stosowania (zabezpieczenia z załącznika A)
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.5
      name: Organisational controls
      implementation_groups:
      - SoA
      translations:
        fr:
          name: Mesure de sécurité organisationnelles
        cs:
          name: Organizační kontroly
        sv:
          name: Organisatoriska kontroller
        es:
          name: Controles organizativos
        de:
          name: Organisatorische Maßnahmen
        zh:
          name: 组织控制
        pl:
          name: Zabezpieczenia organizacyjne
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.1
      name: Policies for information security
      description: This control establishes and maintains information security policies aligned with organizational
        objectives. Measures include defining scope, setting goals, and ensuring alignment with compliance requirements.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.1
      translations:
        fr:
          name: Politiques de sécurité de l'information
          description: Cette mesure de sécurité établit et maintient des politiques de sécurité de l'information
            alignées sur les objectifs organisationnels. Les mesures incluent la définition de la portée, la fixation
            des objectifs et l'alignement avec les exigences de conformité.
        cs:
          name: Politiky pro informační bezpečnost
          description: Tato kontrola zavádí a udržuje politiky informační bezpečnosti v souladu s cíli organizace.
            Mezi tato opatření patří definování rozsahu, stanovení cílů a zajištění souladu s požadavky na dodržování
            předpisů.
        sv:
          name: Policyer för informationssäkerhet
          description: Den här kontrollen upprättar och underhåller informationssäkerhetsprinciper som är anpassade
            till organisationens mål. Åtgärderna omfattar att definiera omfattning, sätta upp mål och säkerställa
            anpassning till efterlevnadskraven.
        es:
          name: Políticas de seguridad de la información
          description: Este control establece y mantiene políticas de seguridad de la información alineadas con
            los objetivos de la organización. Las medidas incluyen la definición del alcance, el establecimiento
            de objetivos y la garantía de la alineación con los requisitos de cumplimiento.
        de:
          name: Informationssicherheitspolitik und -richtlinien
          description: Diese Steuerungsmaßnahme stellt sicher, dass Richtlinien für die Informationssicherheit erstellt,
            genehmigt und organisatorisch verankert werden. Die Richtlinien müssen mit den strategischen Zielen
            übereinstimmen, Verantwortlichkeiten festlegen und die Einhaltung gesetzlicher, regulatorischer und
            vertraglicher Anforderungen unterstützen.
        zh:
          name: 信息安全政策
          description: 这种控制建立并维护与组织目标一致的信息安全政策。措施包括界定范围、设定目标，并确保符合合规要求。
        pl:
          name: Polityki bezpieczeństwa informacji
          description: Zabezpieczenie polega na ustanowieniu i utrzymywaniu polityk bezpieczeństwa informacji spójnych
            z celami organizacji. Obejmuje m.in. określenie zakresu, wyznaczenie celów oraz zapewnienie zgodności
            z obowiązującymi wymaganiami.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.2
      name: Information security roles and responsibilities
      description: This control defines and assigns roles and responsibilities for information security to ensure
        accountability. Measures include clear documentation of responsibilities, periodic reviews, and enforcement
        mechanisms.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.2
      translations:
        fr:
          name: Fonctions et responsabilités liées à la sécurité de l'information
          description: Cette mesure de sécurité définit et attribue des rôles et responsabilités en matière de sécurité
            de l'information pour garantir la responsabilité. Les mesures incluent une documentation claire des
            responsabilités, des revues périodiques et des mécanismes d'application.
        cs:
          name: Role a odpovědnosti v oblasti informační bezpečnosti
          description: Tato kontrola definuje a přiřazuje role a odpovědnosti za informační bezpečnost, aby byla
            zajištěna odpovědnost. Mezi opatření patří jasná dokumentace odpovědností, pravidelné kontroly a mechanismy
            vymáhání.
        sv:
          name: Roller och ansvar för informationssäkerhet
          description: Den här kontrollen definierar och tilldelar roller och ansvar för informationssäkerhet för
            att säkerställa ansvarsskyldighet. Åtgärderna omfattar tydlig dokumentation av ansvarsområden, periodiska
            granskningar och verkställighetsmekanismer.
        es:
          name: Funciones y responsabilidades de la seguridad de la información
          description: Este control define y asigna roles y responsabilidades para la seguridad de la información
            para garantizar la responsabilidad. Las medidas incluyen documentación clara de las responsabilidades,
            revisiones periódicas y mecanismos de cumplimiento.
        de:
          name: Informationssicherheitsrollen und -verantwortlichkeiten
          description: Diese Steuerungsmaßnahme legt klare Rollen, Verantwortlichkeiten und Befugnisse im Bereich
            der Informationssicherheit fest. Sie stellt sicher, dass Zuständigkeiten dokumentiert, kommuniziert
            und regelmäßig überprüft werden, um eine wirksame Umsetzung der Sicherheitsmaßnahmen zu gewährleisten.
        zh:
          name: 信息安全角色与职责
          description: 这种控制定义并分配信息安全的角色和责任，以确保问责制。措施包括明确责任记录、定期审查和执法机制。
        pl:
          name: Role i odpowiedzialności w zakresie bezpieczeństwa informacji
          description: Zabezpieczenie określa i przypisuje role oraz odpowiedzialności w zakresie bezpieczeństwa
            informacji, zapewniając rozliczalność. Obejmuje m.in. jasne udokumentowanie zakresów odpowiedzialności,
            okresowe przeglądy oraz mechanizmy egzekwowania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.2

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.3
      name: Segregation of duties
      description: This control ensures segregation of duties to reduce the risk of errors, fraud, and unauthorized
        access. Measures include role separation, access restrictions, and regular audits.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.3
      translations:
        fr:
          name: Séparation des tâches
          description: Cette mesure de sécurité garantit la séparation des tâches pour réduire le risque d'erreurs,
            de fraude et d'accès non autorisé. Les mesures incluent la séparation des rôles, des restrictions d'accès
            et des audits réguliers.
        cs:
          name: Oddělení povinností
          description: Tato kontrola zajišťuje oddělení povinností, aby se snížilo riziko chyb, podvodů a neoprávněného
            přístupu. Mezi opatření patří oddělení rolí, omezení přístupu a pravidelné audity.
        sv:
          name: Åtskillnad av arbetsuppgifter
          description: Den här kontrollen säkerställer uppdelning av uppgifter för att minska risken för fel, bedrägerier
            och obehörig åtkomst. Åtgärderna omfattar rollseparation, åtkomstbegränsningar och regelbundna granskningar.
        es:
          name: Segregación de funciones
          description: Este control garantiza la segregación de funciones para reducir el riesgo de errores, fraudes
            y accesos no autorizados. Las medidas incluyen la separación de roles, restricciones de acceso y auditorías
            periódicas.
        de:
          name: Aufgabentrennung
          description: Diese Steuerungsmaßnahme stellt sicher, dass kritische oder miteinander kollidierende Aufgaben
            voneinander getrennt werden, um Risiken wie Fehler, Betrug oder unbefugte Aktivitäten zu reduzieren.
            Dies wird durch rollenspezifische Zugriffsbeschränkungen, klare Verantwortlichkeiten und geeignete Kontrollen
            erreicht.
        zh:
          name: 职责分离
          description: 这种控制确保职责分离，以降低错误、欺诈和未经授权访问的风险。措施包括角色分离、访问限制和定期审计。
        pl:
          name: Rozdzielenie obowiązków
          description: Zabezpieczenie zapewnia rozdzielenie obowiązków w celu ograniczenia ryzyka błędów, nadużyć
            i nieuprawnionego dostępu. Obejmuje m.in. rozdzielenie ról, ograniczenia dostępu oraz regularne audyty.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.2, 11.2

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.4
      name: Management responsibilities
      description: This control ensures management responsibilities for information security are clearly defined
        and implemented. Measures include setting objectives, allocating resources, and overseeing compliance.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.4
      translations:
        fr:
          name: Responsabilités de la direction
          description: Cette mesure de sécurité garantit que les responsabilités de gestion en matière de sécurité
            de l'information sont clairement définies et mises en œuvre. Les mesures incluent la fixation d'objectifs,
            l'allocation de ressources et la supervision de la conformité.
        cs:
          name: Odpovědnosti vedení
          description: Tato kontrola zajišťuje, že odpovědnosti managementu za informační bezpečnost jsou jasně
            definovány a implementovány. Mezi opatření patří stanovení cílů, alokace zdrojů a dohled nad dodržováním
            předpisů.
        sv:
          name: Ledningens ansvar
          description: Denna kontroll säkerställer att ledningens ansvar för informationssäkerhet är tydligt definierat
            och implementerat. Åtgärderna inkluderar att sätta upp mål, fördela resurser och övervaka efterlevnaden.
        es:
          name: Responsabilidades de gestión
          description: Este control garantiza que las responsabilidades de gestión para la seguridad de la información
            estén claramente definidas e implementadas. Las medidas incluyen el establecimiento de objetivos, la
            asignación de recursos y la supervisión del cumplimiento.
        de:
          name: Verantwortlichkeiten der Leitung
          description: Diese Steuerungsmaßnahme stellt sicher, dass die Leitung Verantwortung für die Informationssicherheit
            übernimmt. Dazu gehören die Unterstützung der Sicherheitsziele, die Bereitstellung notwendiger Ressourcen,
            das Fördern einer Sicherheitskultur sowie die Überwachung von Umsetzung und Wirksamkeit.
        zh:
          name: 管理职责
          description: 这种控制确保信息安全的管理职责被明确定义并得以实施。措施包括设定目标、分配资源和监督合规。
        pl:
          name: Odpowiedzialność kierownictwa
          description: Zabezpieczenie zapewnia, że obowiązki kierownictwa w zakresie bezpieczeństwa informacji są
            jasno określone i realizowane. Obejmuje m.in. wyznaczanie celów, przydzielanie zasobów oraz nadzór nad
            zgodnością.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1, 1.2

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-24 (art. 8c); KSC-25 (art. 8d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.5
      name: Contact with authorities
      description: This control ensures timely communication with relevant authorities during information security
        incidents. Measures include establishing contact protocols, maintaining updated contact lists, and assigning
        responsibilities.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.5
      translations:
        fr:
          name: Contact avec les autorités
          description: Cette mesure de sécurité garantit une communication rapide avec les autorités compétentes
            en cas d'incidents de sécurité de l'information. Les mesures incluent des protocoles de contact, des
            listes de contacts à jour et l'attribution de responsabilités.
        cs:
          name: Kontakt s autoritami
          description: Tato kontrola zajišťuje včasnou komunikaci s příslušnými orgány během incidentů v oblasti
            informační bezpečnosti. Mezi opatření patří zavedení kontaktních protokolů, udržování aktualizovaných
            seznamů kontaktů a přidělování odpovědností.
        sv:
          name: Kontakt med myndigheter
          description: Denna kontroll säkerställer snabb kommunikation med relevanta myndigheter under informationssäkerhetsincidenter.
            Åtgärderna inkluderar att upprätta kontaktprotokoll, upprätthålla uppdaterade kontaktlistor och tilldela
            ansvar.
        es:
          name: Contacto con las autoridades
          description: Este control garantiza la comunicación oportuna con las autoridades pertinentes durante los
            incidentes de seguridad de la información. Las medidas incluyen el establecimiento de protocolos de
            contacto, el mantenimiento de listas de contactos actualizadas y la asignación de responsabilidades.
        de:
          name: Kontakt mit Behörden
          description: Diese Steuerungsmaßnahme stellt sicher, dass die Organisation angemessene Kommunikationswege
            mit relevanten Behörden besitzt. Dies umfasst klare Zuständigkeiten, gepflegte Kontaktlisten und definierte
            Abläufe, insbesondere für meldepflichtige Sicherheitsvorfälle.
        zh:
          name: 与当局的联系
          description: 这种控制确保在信息安全事件期间及时与相关部门沟通。措施包括建立联系协议、维护联系人名单更新以及分配职责。
        pl:
          name: Kontakt z organami władzy
          description: Zabezpieczenie zapewnia terminową komunikację z właściwymi organami w przypadku incydentów
            bezpieczeństwa informacji. Obejmuje m.in. ustalenie zasad kontaktu, utrzymywanie aktualnych list kontaktowych
            oraz przypisanie odpowiedzialności.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.3, 3.5 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-20 (art. 8 ust. 1 pkt 4); KSC-28 (art. 9 ust. 1 pkt 1, ust. 2); KSC-31 (art. 9 ust.
            1 pkt 4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.6
      name: Contact with special interest groups
      description: This control facilitates contact with special interest groups to stay informed about security
        trends and practices. Measures include participation in forums, memberships, and collaborative initiatives.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.6
      translations:
        fr:
          name: Contact avec des groupes d'intérêt spécifiques
          description: Cette mesure de sécurité facilite le contact avec des groupes d'intérêt pour rester informé
            des tendances et pratiques en matière de sécurité. Les mesures incluent la participation à des forums,
            des adhésions et des initiatives collaboratives.
        cs:
          name: Kontakt se zvláštními zájmovými skupinami
          description: Tato kontrola usnadňuje kontakt se zájmovými skupinami, aby byli informováni o bezpečnostních
            trendech a postupech. Mezi tato opatření patří účast na fórech, členství a společné iniciativy.
        sv:
          name: Kontakt med särskilda intresseorganisationer för intresseorganisationer
          description: Denna kontroll underlättar kontakt med särskilda intressegrupper för att hålla sig informerade
            om säkerhetstrender och praxis. Åtgärderna inkluderar deltagande i forum, medlemskap och samarbetsinitiativ.
        es:
          name: Contacto con grupos de interés especial
          description: Este control facilita el contacto con grupos de interés especial para mantenerse informado
            sobre las tendencias y prácticas de seguridad. Las medidas incluyen la participación en foros, membresías
            e iniciativas de colaboración.
        de:
          name: Kontakt mit speziellen Interessensgruppen
          description: Diese Steuerungsmaßnahme fördert den Austausch mit relevanten Sicherheits- und Branchenforen,
            um aktuelle Trends, Bedrohungen und bewährte Verfahren frühzeitig zu erkennen und im Informationssicherheitsmanagement
            zu berücksichtigen.
        zh:
          name: 与特殊利益团体的联系
          description: 这种控制有助于与特殊利益团体保持对安全趋势和实践的了解。措施包括参与论坛、会员资格和协作项目。
        pl:
          name: Kontakt z grupami szczególnych interesów
          description: Zabezpieczenie ułatwia kontakt z grupami szczególnych interesów, aby organizacja była na
            bieżąco z trendami i praktykami w obszarze bezpieczeństwa. Obejmuje m.in. udział w forach, członkostwo
            w stowarzyszeniach oraz wspólne inicjatywy.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.10 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b); KSC-19 (art. 8 ust. 1 pkt 3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.7
      name: Threat intelligence
      description: This control ensures threat intelligence is developed and maintained to identify and mitigate
        security risks. Measures include monitoring threat feeds, analyzing trends, and sharing actionable insights.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.7
      translations:
        fr:
          name: Renseignements sur les menaces
          description: Cette mesure de sécurité garantit que des renseignements sur les menaces sont développés
            et maintenus pour identifier et atténuer les risques de sécurité. Les mesures incluent le suivi des
            flux de menaces, l'analyse des tendances et le partage d'informations exploitables.
        cs:
          name: Zpravodajství o hrozbách
          description: Tato kontrola zajišťuje, že informace o hrozbách jsou vyvíjeny a udržovány s cílem identifikovat
            a zmírnit bezpečnostní rizika. Mezi tato opatření patří monitorování informací o hrozbách, analýza trendů
            a sdílení užitečných poznatků.
        sv:
          name: Information om hot
          description: Den här kontrollen säkerställer att hotinformation utvecklas och underhålls för att identifiera
            och minimera säkerhetsrisker. Åtgärderna omfattar övervakning av hotflöden, analys av trender och delning
            av användbara insikter.
        es:
          name: Inteligencia de amenazas
          description: Este control garantiza que la inteligencia de amenazas se desarrolle y mantenga para identificar
            y mitigar los riesgos de seguridad. Las medidas incluyen la supervisión de fuentes de amenazas, el análisis
            de tendencias y el intercambio de información procesable.
        de:
          name: Informationen über die Bedrohungslage
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationen über aktuelle und potenzielle
            Bedrohungen systematisch gesammelt, analysiert und bewertet werden. Die gewonnenen Erkenntnisse sollen
            helfen, Risiken besser zu verstehen und wirksame Schutzmaßnahmen abzuleiten.
        zh:
          name: 威胁情报
          description: 这种控制确保威胁情报的开发和维护，以识别和缓解安全风险。措施包括监控威胁信息流、分析趋势以及分享可作的见解。
        pl:
          name: Analiza zagrożeń (threat intelligence)
          description: Zabezpieczenie zapewnia gromadzenie i utrzymywanie wiedzy o zagrożeniach (threat intelligence)
            w celu identyfikowania i ograniczania ryzyk bezpieczeństwa. Obejmuje m.in. monitorowanie źródeł informacji
            o zagrożeniach, analizę trendów oraz przekazywanie praktycznych wniosków.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.8
      name: Information security in project management
      description: This control incorporates information security into project management practices. Measures include
        risk assessments, compliance reviews, and security checkpoints during project lifecycles.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.8
      translations:
        fr:
          name: Sécurité de l'information dans la gestion de projet
          description: Cette mesure de sécurité intègre la sécurité de l'information dans les pratiques de gestion
            de projet. Les mesures incluent les évaluations des risques, les revues de conformité et les points
            de contrôle de sécurité tout au long du cycle de vie du projet.
        cs:
          name: Informační bezpečnost v projektovém řízení
          description: Tato kontrola zahrnuje informační bezpečnost do postupů řízení projektů. Mezi tato opatření
            patří posouzení rizik, kontroly souladu s předpisy a bezpečnostní kontrolní body během životního cyklu
            projektu.
        sv:
          name: Informationssäkerhet inom projektledning
          description: Den här kontrollen införlivar informationssäkerhet i projektledningsmetoderna. Åtgärderna
            omfattar riskbedömningar, efterlevnadsgranskningar och säkerhetskontroller under projektets livscykel.
        es:
          name: Seguridad de la información en la gestión de proyectos
          description: Este control incorpora la seguridad de la información en las prácticas de gestión de proyectos.
            Las medidas incluyen evaluaciones de riesgos, revisiones de cumplimiento y puntos de control de seguridad
            durante los ciclos de vida del proyecto.
        de:
          name: Informationssicherheit im Projektmanagement
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationssicherheit systematisch in alle
            Phasen des Projektmanagements integriert wird. Dazu gehören Risikoanalysen, Sicherheitsanforderungen,
            Compliance-Prüfungen und Sicherheitsfreigaben im Rahmen des Projektlebenszyklus.
        zh:
          name: 项目管理中的信息安全
          description: 这种控制将信息安全纳入项目管理实践中。措施包括风险评估、合规审查以及项目生命周期内的安全检查点。
        pl:
          name: Bezpieczeństwo informacji w zarządzaniu projektami
          description: Zabezpieczenie włącza bezpieczeństwo informacji do praktyk zarządzania projektami. Obejmuje
            m.in. oceny ryzyka, przeglądy zgodności oraz punkty kontrolne bezpieczeństwa na kolejnych etapach cyklu
            życia projektu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.1 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.9
      name: Inventory of information and other associated assets
      description: This control ensures an accurate inventory of information and associated assets is maintained.
        Measures include asset tracking, periodic audits, and classification by sensitivity.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.9
      translations:
        fr:
          name: Inventaire des informations et autres actifs associés
          description: Cette mesure de sécurité garantit qu’un inventaire précis des informations et des actifs
            associés est maintenu. Les mesures incluent le suivi des actifs, des audits périodiques et une classification
            par sensibilité.
        cs:
          name: Evidence informací a dalších souvisejících aktiv
          description: Tato kontrola zajišťuje přesnou inventuru informací a souvisejících aktiv. Mezi opatření
            patří sledování aktiv, pravidelné audity a klasifikace podle citlivosti.
        sv:
          name: Inventering av information och andra tillhörande tillgångar
          description: Denna kontroll säkerställer att en korrekt inventering av information och tillhörande tillgångar
            upprätthålls. Åtgärderna inkluderar tillgångsspårning, periodiska revisioner och klassificering efter
            känslighet.
        es:
          name: Inventario de información y otros activos asociados
          description: Este control garantiza que se mantenga un inventario preciso de la información y los activos
            asociados. Las medidas incluyen el seguimiento de activos, auditorías periódicas y clasificación por
            sensibilidad.
        de:
          name: Inventar der Informationen und anderen damit verbundenen Werte
          description: Diese Steuerungsmaßnahme stellt sicher, dass die Organisation ein aktuelles, vollständiges
            und gepflegtes Inventar von Informationen und zugehörigen Werten führt. Es dient der Verantwortlichkeitszuordnung
            und unterstützt risikobasierte Schutzmaßnahmen.
        zh:
          name: 信息及相关资产清单
          description: 这种控制确保了信息及相关资产的准确盘点。措施包括资产跟踪、定期审计以及按敏感度分类。
        pl:
          name: Inwentaryzacja informacji i innych związanych z nimi aktywów
          description: Zabezpieczenie zapewnia utrzymywanie dokładnej inwentaryzacji informacji i związanych z nimi
            aktywów. Obejmuje m.in. ewidencjonowanie aktywów, okresowe audyty oraz klasyfikację według wrażliwości.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.1, 12.2, 12.4

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.10
      name: Acceptable use of information and other associated assets
      description: This control defines acceptable use of information and associated assets to ensure proper handling.
        Measures include documented policies, user training, and enforcement mechanisms.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.10
      translations:
        fr:
          name: Utilisation correcte des informations et autres actifs associés
          description: Cette mesure de sécurité définit les règles d'utilisation acceptable des informations et
            des actifs associés pour assurer une manipulation appropriée. Les mesures incluent des politiques documentées,
            la formation des utilisateurs et des mécanismes d'application.
        cs:
          name: Přípustné použití informací a dalších souvisejících aktiv
          description: Tato kontrola definuje přijatelné použití informací a souvisejících aktiv, aby bylo zajištěno
            správné nakládání s nimi. Mezi tato opatření patří zdokumentované zásady, školení uživatelů a mechanismy
            vymáhání.
        sv:
          name: Acceptabel användning av information och andra tillhörande tillgångar
          description: Den här kontrollen definierar acceptabel användning av information och associerade tillgångar
            för att säkerställa korrekt hantering. Åtgärderna omfattar dokumenterade policyer, användarutbildning
            och tvingande mekanismer.
        es:
          name: Uso aceptable de la información y otros activos asociados
          description: Este control define el uso aceptable de la información y los activos asociados para garantizar
            un manejo adecuado. Las medidas incluyen políticas documentadas, capacitación de usuarios y mecanismos
            de cumplimiento.
        de:
          name: Zulässiger Gebrauch von Informationen und anderen damit verbundenen Werten
          description: Diese Steuerungsmaßnahme definiert klare Regeln für die zulässige Nutzung von Informationen,
            Datenträgern, Geräten und anderen Werten. Sie stellt sicher, dass Benutzer die Anforderungen kennen
            und einhalten, einschließlich Schulungen und Richtlinien.
        zh:
          name: 信息及其他相关资产的合理使用
          description: 这种控制定义了信息及相关资产的可接受使用，以确保正确处理。措施包括有文档化的政策、用户培训和执行机制。
        pl:
          name: Akceptowalne użytkowanie informacji i innych związanych z nimi aktywów
          description: Zabezpieczenie określa zasady akceptowalnego użytkowania informacji i związanych z nimi aktywów,
            aby zapewnić właściwe postępowanie z nimi. Obejmuje m.in. udokumentowane polityki, szkolenia użytkowników
            oraz mechanizmy egzekwowania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.2

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.11
      name: Return of assets
      description: This control ensures the secure return of assets when employees or contractors leave or change
        roles. Measures include checklists, asset tracking, and decommissioning protocols.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.11
      translations:
        fr:
          name: Restitution des actifs
          description: Cette mesure de sécurité garantit le retour sécurisé des actifs lorsque des employés ou des
            sous-traitants quittent ou changent de rôle. Les mesures incluent des listes de contrôle, le suivi des
            actifs et des protocoles de désactivation.
        cs:
          name: Vrácení aktiv
          description: Tato kontrola zajišťuje bezpečné vrácení majetku, když zaměstnanci nebo dodavatelé odejdou
            nebo změní svou roli. Mezi tato opatření patří kontrolní seznamy, sledování majetku a protokoly o vyřazování
            z provozu.
        sv:
          name: Återföring av tillgångar
          description: Denna kontroll säkerställer en säker återlämning av tillgångar när anställda eller entreprenörer
            lämnar eller byter roll. Åtgärderna omfattar checklistor, tillgångsspårning och inaktiveringsprotokoll.
        es:
          name: Devolución de activos
          description: Este control garantiza la devolución segura de los activos cuando los empleados o contratistas
            se van o cambian de función. Las medidas incluyen listas de comprobación, seguimiento de activos y protocolos
            de desmantelamiento.
        de:
          name: Rückgabe von Werten
          description: Diese Steuerungsmaßnahme stellt sicher, dass sämtliche organisatorischen Werte – einschließlich
            Geräten, Datenträgern, Zugangsberechtigungen oder Dokumenten – bei Austritt oder Rollenwechsel vollständig
            und sicher zurückgegeben werden.
        zh:
          name: 资产返还
          description: 这种控制确保了当员工或承包商离职或更换岗位时，资产能够安全回收。措施包括清单、资产跟踪和退役协议。
        pl:
          name: Zwrot aktywów
          description: Zabezpieczenie zapewnia bezpieczny zwrot aktywów, gdy pracownicy lub wykonawcy odchodzą z
            organizacji albo zmieniają rolę. Obejmuje m.in. listy kontrolne, ewidencjonowanie aktywów oraz procedury
            wycofywania z użytku.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.12
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.12
      name: Classification of information
      description: This control ensures information is classified based on its sensitivity and value to ensure appropriate
        protection. Measures include classification schemes, access restrictions, and labeling guidelines.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.12
      translations:
        fr:
          name: Classification des informations
          description: Cette mesure de sécurité garantit que les informations sont classées en fonction de leur
            sensibilité et de leur valeur pour assurer une protection adéquate. Les mesures incluent des schémas
            de classification, des restrictions d'accès et des directives d'étiquetage.
        cs:
          name: Klasifikace informací
          description: Tato kontrola zajišťuje, že informace jsou klasifikovány na základě jejich citlivosti a hodnoty,
            aby byla zajištěna odpovídající ochrana. Mezi opatření patří klasifikační schémata, omezení přístupu
            a pokyny pro označování.
        sv:
          name: Klassificering av information
          description: Den här kontrollen säkerställer att information klassificeras baserat på dess känslighet
            och värde för att säkerställa lämpligt skydd. Måtten omfattar klassificeringsscheman, åtkomstbegränsningar
            och riktlinjer för etikettering.
        es:
          name: Clasificación de la información
          description: Este control garantiza que la información se clasifique en función de su sensibilidad y valor
            para garantizar una protección adecuada. Las medidas incluyen esquemas de clasificación, restricciones
            de acceso y pautas de etiquetado.
        de:
          name: Klassifizierung von Informationen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationen gemäß ihrem Schutzbedarf klassifiziert
            werden. Die Klassifizierung berücksichtigt Vertraulichkeit, Integrität, Verfügbarkeit sowie gesetzliche
            und vertragliche Anforderungen.
        zh:
          name: 信息分类
          description: 这种控制确保信息根据其敏感性和价值进行机密，以确保适当的保护。措施包括分类方案、访问限制和标签指南。
        pl:
          name: Klasyfikacja informacji
          description: Zabezpieczenie zapewnia klasyfikację informacji według ich wrażliwości i wartości, tak aby
            zapewnić im odpowiedni poziom ochrony. Obejmuje m.in. schematy klasyfikacji, ograniczenia dostępu oraz
            wytyczne dotyczące oznaczania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.1

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.13
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.13
      name: Labelling of information
      description: This control ensures consistent labeling of information to reflect its classification and handling
        requirements. Measures include standardized templates, training, and audits.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.13
      translations:
        fr:
          name: Marquage des informations
          description: Cette mesure de sécurité garantit un étiquetage cohérent des informations pour refléter leur
            classification et leurs exigences de traitement. Les mesures incluent des modèles standardisés, des
            formations et des audits.
        cs:
          name: Označování informací
          description: Tato kontrola zajišťuje konzistentní označování informací tak, aby odráželo požadavky na
            jejich klasifikaci a zpracování. Mezi opatření patří standardizované šablony, školení a audity.
        sv:
          name: Märkning av information
          description: Den här kontrollen säkerställer konsekvent märkning av information för att återspegla dess
            klassificerings- och hanteringskrav. Åtgärderna inkluderar standardiserade mallar, utbildning och revisioner.
        es:
          name: Etiquetado de la información
          description: Este control garantiza un etiquetado coherente de la información para reflejar sus requisitos
            de clasificación y manejo. Las medidas incluyen plantillas estandarizadas, capacitación y auditorías.
        de:
          name: Kennzeichnung von Informationen
          description: Diese Steuerungsmaßnahme stellt sicher, dass klassifizierte Informationen eindeutig und korrekt
            gekennzeichnet werden, sodass notwendige Schutzmaßnahmen zuverlässig angewendet werden können.
        zh:
          name: 信息标签
          description: 这种控制确保信息的标签一致，反映其分类和处理要求。衡量标准包括标准化模板、培训和审计。
        pl:
          name: Oznaczanie informacji
          description: Zabezpieczenie zapewnia spójne oznaczanie informacji, odzwierciedlające ich klasyfikację
            i wymagania dotyczące postępowania z nimi. Obejmuje m.in. ustandaryzowane szablony, szkolenia oraz audyty.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.1

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.14
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.14
      name: Information transfer
      description: This control establishes secure processes for transferring information between systems or organizations.
        Measures include encryption, access controls, and secure transfer protocols.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.14
      translations:
        fr:
          name: Transfert des informations
          description: Cette mesure de sécurité établit des processus sécurisés pour le transfert d'informations
            entre systèmes ou organisations. Les mesures incluent le chiffrement, les contrôles d'accès et les protocoles
            de transfert sécurisés.
        cs:
          name: Předávání informací
          description: Tato kontrola zavádí bezpečné procesy pro přenos informací mezi systémy nebo organizacemi.
            Mezi opatření patří šifrování, řízení přístupu a protokoly zabezpečeného přenosu.
        sv:
          name: Överföring av uppgifter
          description: Denna kontroll upprättar säkra processer för överföring av information mellan system eller
            organisationer. Åtgärderna inkluderar kryptering, åtkomstkontroller och säkra överföringsprotokoll.
        es:
          name: Transferencia de información
          description: Este control establece procesos seguros para la transferencia de información entre sistemas
            u organizaciones. Las medidas incluyen cifrado, controles de acceso y protocolos de transferencia segura.
        de:
          name: Informationsübermittlung
          description: Diese Steuerungsmaßnahme definiert Verfahren und Anforderungen für die sichere Übertragung
            von Informationen zwischen Systemen, Personen und Organisationen. Dazu gehören Verschlüsselung, Zugriffsbeschränkungen
            und dokumentierte Kommunikationswege.
        zh:
          name: 信息传输
          description: 这种控制建立了系统或组织之间信息传输的安全流程。措施包括加密、访问控制和安全传输协议。
        pl:
          name: Przekazywanie informacji
          description: Zabezpieczenie ustanawia bezpieczne procesy przekazywania informacji między systemami lub
            organizacjami. Obejmuje m.in. szyfrowanie, kontrolę dostępu oraz bezpieczne protokoły przesyłania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.2

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.15
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.15
      name: Access control
      description: This control implements and maintains access control mechanisms to restrict access to authorized
        individuals. Measures include role-based access, multi-factor authentication, and periodic reviews.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.15
      translations:
        fr:
          name: Contrôle d'accès
          description: Cette mesure de sécurité met en œuvre et maintient des mécanismes de contrôle d'accès pour
            limiter l'accès aux individus autorisés. Les mesures incluent des contrôles basés sur les rôles, l'authentification
            multifacteur et des revues périodiques.
        cs:
          name: Řízení přístupu
          description: Tato kontrola implementuje a udržuje mechanismy řízení přístupu, které omezují přístup na
            oprávněné osoby. Mezi opatření patří přístup založený na rolích, vícefaktorové ověřování a pravidelné
            kontroly.
        sv:
          name: Åtkomstkontroll
          description: Den här kontrollen implementerar och underhåller mekanismer för åtkomstkontroll för att begränsa
            åtkomsten till behöriga personer. Åtgärderna omfattar rollbaserad åtkomst, multifaktorautentisering
            och periodiska granskningar.
        es:
          name: Control de acceso
          description: Este control implementa y mantiene mecanismos de control de acceso para restringir el acceso
            a las personas autorizadas. Las medidas incluyen el acceso basado en roles, la autenticación multifactor
            y las revisiones periódicas.
        de:
          name: Zugangssteuerung
          description: Diese Steuerungsmaßnahme stellt sicher, dass der Zugang zu Informationen und Werten ausschließlich
            autorisierten Personen ermöglicht wird. Dies umfasst rollenbasierte Zugriffskonzepte, starke Authentisierungsmechanismen
            und regelmäßige Überprüfungen.
        zh:
          name: 访问控制
          description: 该控制实施并维护访问控制机制，限制授权人员的访问。措施包括基于角色的访问、多因素认证和定期审查。
        pl:
          name: Kontrola dostępu
          description: Zabezpieczenie wdraża i utrzymuje mechanizmy kontroli dostępu, ograniczające dostęp wyłącznie
            do osób uprawnionych. Obejmuje m.in. dostęp oparty na rolach, uwierzytelnianie wieloskładnikowe (MFA)
            oraz okresowe przeglądy.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.1

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.16
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.16
      name: Identity management
      description: This control ensures identities are managed securely to guarantee accurate and reliable access
        to systems. Measures include identity verification, lifecycle management, and access provisioning.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.16
      translations:
        fr:
          name: Gestion des identités
          description: Cette mesure de sécurité garantit que les identités sont gérées de manière sécurisée pour
            garantir un accès précis et fiable aux systèmes. Les mesures incluent la vérification d'identité, la
            gestion du cycle de vie et l'approvisionnement des accès.
        cs:
          name: Řízení identit
          description: Tato kontrola zajišťuje bezpečnou správu identit, aby byl zaručen přesný a spolehlivý přístup
            k systémům. Mezi opatření patří ověřování identity, správa životního cyklu a zřizování přístupu.
        sv:
          name: Identitetshantering
          description: Den här kontrollen säkerställer att identiteter hanteras på ett säkert sätt för att garantera
            korrekt och tillförlitlig åtkomst till system. Åtgärderna omfattar identitetsverifiering, livscykelhantering
            och åtkomstetablering.
        es:
          name: Gestión de identidades
          description: Este control garantiza que las identidades se gestionen de forma segura para garantizar un
            acceso preciso y fiable a los sistemas. Las medidas incluyen la verificación de identidad, la gestión
            del ciclo de vida y el aprovisionamiento de acceso.
        de:
          name: Identitätsmanagement
          description: Diese Steuerungsmaßnahme stellt sicher, dass digitale und physische Identitäten über ihren
            gesamten Lebenszyklus hinweg sicher verwaltet werden – einschließlich Identitätsprüfung, Bereitstellung,
            Änderung und Entzug von Zugriffsrechten.
        zh:
          name: 身份管理
          description: 这种控制确保身份安全管理，确保对系统的准确可靠访问。措施包括身份验证、生命周期管理和访问配置。
        pl:
          name: Zarządzanie tożsamością
          description: Zabezpieczenie zapewnia bezpieczne zarządzanie tożsamościami, gwarantując prawidłowy i niezawodny
            dostęp do systemów. Obejmuje m.in. weryfikację tożsamości, zarządzanie cyklem życia tożsamości oraz
            nadawanie dostępu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.5

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.17
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.17
      name: Authentication information
      description: This control protects authentication information, such as passwords, to prevent unauthorized
        access. Measures include encryption, secure storage, and periodic password updates.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.17
      translations:
        fr:
          name: Informations d'authentification
          description: Cette mesure de sécurité protège les informations d'authentification, telles que les mots
            de passe, pour empêcher tout accès non autorisé. Les mesures incluent le chiffrement, le stockage sécurisé
            et les mises à jour périodiques des mots de passe.
        cs:
          name: Autentizační informace
          description: Tato kontrola chrání ověřovací informace, jako jsou hesla, aby se zabránilo neoprávněnému
            přístupu. Mezi opatření patří šifrování, bezpečné úložiště a pravidelné aktualizace hesel.
        sv:
          name: Information om autentisering
          description: Den här kontrollen skyddar autentiseringsinformation, till exempel lösenord, för att förhindra
            obehörig åtkomst. Åtgärderna omfattar kryptering, säker lagring och periodiska lösenordsuppdateringar.
        es:
          name: Información de autenticación
          description: Este control protege la información de autenticación, como las contraseñas, para evitar el
            acceso no autorizado. Las medidas incluyen cifrado, almacenamiento seguro y actualizaciones periódicas
            de contraseñas.
        de:
          name: Authentisierungsinformationen
          description: Diese Steuerungsmaßnahme schützt Authentisierungsinformationen wie Passwörter, Tokens oder
            Schlüssel vor Missbrauch, einschließlich sicherer Speicherung, Verschlüsselung und Nutzungsvorgaben.
        zh:
          name: 认证信息
          description: 这种控制保护了认证信息，如密码，以防止未经授权的访问。措施包括加密、安全存储和定期更新密码。
        pl:
          name: Informacje uwierzytelniające
          description: Zabezpieczenie chroni informacje uwierzytelniające, takie jak hasła, aby zapobiec nieuprawnionemu
            dostępowi. Obejmuje m.in. szyfrowanie, bezpieczne przechowywanie oraz okresową zmianę haseł.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.6

            Ustawa o KSC: KSC-16 (art. 8 ust. 1 pkt 2 lit. l)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.18
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.18
      name: Access rights
      description: This control ensures access rights are regularly reviewed and managed to align with roles and
        responsibilities. Measures include periodic audits, access revocation, and automated access management.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.18
      translations:
        fr:
          name: Droits d'accès
          description: Cette mesure de sécurité garantit que les droits d'accès sont régulièrement revus et gérés
            pour s'aligner sur les rôles et responsabilités. Les mesures incluent des audits périodiques, la révocation
            des accès et la gestion automatisée des accès.
        cs:
          name: Přístupová práva
          description: Tato kontrola zajišťuje, že přístupová práva jsou pravidelně kontrolována a spravována v
            souladu s rolemi a odpovědnostmi. Mezi opatření patří pravidelné audity, odebrání přístupu a automatizovaná
            správa přístupu.
        sv:
          name: Rättigheter
          description: Den här kontrollen säkerställer att åtkomsträttigheter regelbundet granskas och hanteras
            så att de överensstämmer med roller och ansvarsområden. Åtgärderna omfattar periodiska granskningar,
            återkallande av åtkomst och automatiserad åtkomsthantering.
        es:
          name: Derechos de acceso
          description: Este control garantiza que los derechos de acceso se revisen y administren periódicamente
            para alinearlos con las funciones y responsabilidades. Las medidas incluyen auditorías periódicas, revocación
            de acceso y gestión automatizada del acceso.
        de:
          name: Zugangsrechte
          description: Diese Steuerungsmaßnahme stellt sicher, dass Zugriffsrechte angemessen vergeben, regelmäßig
            überprüft, angepasst und widerrufen werden, wenn sie nicht mehr erforderlich sind.
        zh:
          name: 访问权
          description: 这种控制确保访问权定期审查和管理，以符合不同角色和职责。措施包括定期审计、访问撤销和自动化访问管理。
        pl:
          name: Prawa dostępu
          description: Zabezpieczenie zapewnia regularny przegląd praw dostępu i zarządzanie nimi zgodnie z rolami
            i zakresami odpowiedzialności. Obejmuje m.in. okresowe audyty, odbieranie dostępu oraz zautomatyzowane
            zarządzanie dostępem.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.2

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.19
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.19
      name: Information security in supplier relationships
      description: This control ensures information security is embedded in supplier relationships and processes.
        Measures include due diligence, security reviews, and ongoing monitoring.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.19
      translations:
        fr:
          name: Sécurité de l'information dans les relations avec les fournisseurs
          description: Cette mesure de sécurité garantit que la sécurité de l'information est intégrée dans les
            relations et processus avec les fournisseurs. Les mesures incluent la diligence raisonnable, les revues
            de sécurité et la surveillance continue.
        cs:
          name: Informační bezpečnost ve vztazích s dodavateli
          description: Tato kontrola zajišťuje, že bezpečnost informací je začleněna do vztahů a procesů s dodavateli.
            Mezi opatření patří due diligence, bezpečnostní kontroly a průběžné monitorování.
        sv:
          name: Informationssäkerhet i leverantörsrelationer
          description: Denna kontroll säkerställer att informationssäkerheten är inbäddad i leverantörsrelationer
            och processer. Åtgärderna omfattar due diligence, säkerhetsgranskningar och löpande övervakning.
        es:
          name: Seguridad de la información en las relaciones con los proveedores
          description: Este control garantiza que la seguridad de la información esté integrada en las relaciones
            y los procesos con los proveedores. Las medidas incluyen la diligencia debida, las revisiones de seguridad
            y el monitoreo continuo.
        de:
          name: Informationssicherheit in Lieferantenbeziehungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationssicherheit in Auswahl, Bewertung,
            Überwachung und Steuerung von Lieferantenbeziehungen verankert ist.
        zh:
          name: 供应商关系中的信息安全
          description: 这种控制确保信息安全嵌入供应商关系和流程中。措施包括尽职调查、安全审查和持续监控。
        pl:
          name: Bezpieczeństwo informacji w relacjach z dostawcami
          description: Zabezpieczenie zapewnia uwzględnienie bezpieczeństwa informacji w relacjach z dostawcami
            i w związanych z nimi procesach. Obejmuje m.in. weryfikację dostawców przed nawiązaniem współpracy (due
            diligence), przeglądy bezpieczeństwa oraz bieżące monitorowanie.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1, 5.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-09 (art. 8 ust.
            1 pkt 2 lit. e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.20
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.20
      name: Addressing information security within supplier agreements
      description: This control addresses information security requirements within supplier agreements. Measures
        include explicit contract clauses, compliance audits, and defined penalties for violations.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.20
      translations:
        fr:
          name: La sécurité de l'information dans les accords conclus avec les fournisseurs
          description: Cette mesure de sécurité aborde les exigences de sécurité de l'information dans les accords
            avec les fournisseurs. Les mesures incluent des clauses contractuelles explicites, des audits de conformité
            et des pénalités définies pour les violations.
        cs:
          name: Řešení informační bezpečnosti v rámci dodavatelských smluv
          description: Tato kontrola se zabývá požadavky na informační bezpečnost v rámci dodavatelských smluv.
            Mezi tato opatření patří explicitní smluvní doložky, audity shody s předpisy a definované sankce za
            porušení.
        sv:
          name: Hantering av informationssäkerhet inom leverantörsavtal
          description: Denna kontroll adresserar informationssäkerhetskrav inom leverantörsavtal. Åtgärderna omfattar
            uttryckliga kontraktsklausuler, efterlevnadsrevisioner och definierade påföljder för överträdelser.
        es:
          name: Abordar la seguridad de la información en los acuerdos con los proveedores
          description: Este control aborda los requisitos de seguridad de la información dentro de los acuerdos
            con los proveedores. Las medidas incluyen cláusulas contractuales explícitas, auditorías de cumplimiento
            y sanciones definidas por infracciones.
        de:
          name: Behandlung von Informationssicherheit in Lieferantenvereinbarungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationssicherheitsanforderungen ausdrücklich
            in Verträgen geregelt werden, einschließlich Datenschutz, Zugriffskontrolle, Compliance-Vorgaben und
            Durchsetzungsmechanismen.
        zh:
          name: 解决供应商协议中的信息安全问题
          description: 该控制针对供应商协议中的信息安全要求。措施包括明确的合同条款、合规审计以及对违规的明确处罚。
        pl:
          name: Uwzględnianie bezpieczeństwa informacji w umowach z dostawcami
          description: Zabezpieczenie uwzględnia wymagania bezpieczeństwa informacji w umowach z dostawcami. Obejmuje
            m.in. wyraźne klauzule umowne, audyty zgodności oraz określone kary za naruszenia.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1, 5.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-09 (art. 8 ust.
            1 pkt 2 lit. e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.21
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.21
      name: Managing information security in the ICT supply chain
      description: This control manages information security risks in the ICT supply chain to ensure security of
        services and components. Measures include risk assessments, supplier evaluations, and incident response
        protocols.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.21
      translations:
        fr:
          name: Gestion de la sécurité de l'information dans la chaîne d'approvisionnement des technologies de l'information
            et de la communication (TIC)
          description: Cette mesure de sécurité gère les risques de sécurité de l'information dans la chaîne d'approvisionnement
            TIC pour garantir la sécurité des services et des composants. Les mesures incluent des évaluations des
            risques, des évaluations des fournisseurs et des protocoles de réponse aux incidents.
        cs:
          name: Řízení informační bezpečnosti v dodavatelském řetězci ICT
          description: Tato kontrola řídí rizika informační bezpečnosti v dodavatelském řetězci IKT s cílem zajistit
            bezpečnost služeb a komponent. Mezi opatření patří posouzení rizik, hodnocení dodavatelů a protokoly
            pro reakci na incidenty.
        sv:
          name: Hantering av informationssäkerhet i ICT-leveranskedjan
          description: Denna kontroll hanterar informationssäkerhetsrisker i ICT-försörjningskedjan för att säkerställa
            säkerheten för tjänster och komponenter. Åtgärderna inkluderar riskbedömningar, leverantörsutvärderingar
            och protokoll för incidenthantering.
        es:
          name: Gestión de la seguridad de la información en la cadena de suministro de las TIC
          description: Este control gestiona los riesgos de seguridad de la información en la cadena de suministro
            de TIC para garantizar la seguridad de los servicios y componentes. Las medidas incluyen evaluaciones
            de riesgos, evaluaciones de proveedores y protocolos de respuesta a incidentes.
        de:
          name: Umgang mit der Informationssicherheit in der Lieferkette der IKT
          description: Diese Steuerungsmaßnahme stellt sicher, dass Risiken in der IKT-Lieferkette bewertet und
            angemessen gesteuert werden, um die Sicherheit, Integrität und Verfügbarkeit von Systemen, Komponenten
            und Dienstleistungen zu gewährleisten. Dazu gehören Risikobewertungen, Sicherheitsüberprüfungen, Anforderungen
            an Zulieferer und Notfallmaßnahmen entlang der Lieferkette.
        zh:
          name: 管理ICT供应链中的信息安全
          description: 该控制管理ICT供应链中的信息安全风险，确保服务和组件的安全。措施包括风险评估、供应商评估和事故响应协议。
        pl:
          name: Zarządzanie bezpieczeństwem informacji w łańcuchu dostaw ICT
          description: Zabezpieczenie służy zarządzaniu ryzykami bezpieczeństwa informacji w łańcuchu dostaw ICT,
            aby zapewnić bezpieczeństwo usług i komponentów. Obejmuje m.in. oceny ryzyka, ocenę dostawców oraz procedury
            reagowania na incydenty.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1, 5.1, 6.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-06 (art. 8 ust.
            1 pkt 2 lit. b); KSC-09 (art. 8 ust. 1 pkt 2 lit. e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.22
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.22
      name: Monitoring, review and change management of supplier services
      description: This control ensures supplier services are monitored, reviewed, and adjusted to maintain information
        security. Measures include service level agreements, periodic reviews, and contract updates.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.22
      translations:
        fr:
          name: Surveillance, révision et gestion des changements des services fournisseurs
          description: Cette mesure de sécurité garantit que les services des fournisseurs sont surveillés, revus
            et ajustés pour maintenir la sécurité de l'information. Les mesures incluent des accords de niveau de
            service, des revues périodiques et des mises à jour contractuelles.
        cs:
          name: Monitorování, kontrola a řízení změn v dodavatelských službách
          description: Tato kontrola zajišťuje, že služby dodavatelů jsou monitorovány, kontrolovány a upravovány
            tak, aby byla zachována bezpečnost informací. Mezi opatření patří dohody o úrovni služeb, pravidelné
            kontroly a aktualizace smluv.
        sv:
          name: Uppföljning, granskning och förändringsledning av leverantörstjänster
          description: Denna kontroll säkerställer att leverantörstjänster övervakas, granskas och justeras för
            att upprätthålla informationssäkerheten. Åtgärderna omfattar serviceavtal, periodiska granskningar och
            kontraktsuppdateringar.
        es:
          name: Supervisar, revisar y gestionar el cambio de los servicios de los proveedores
          description: Este control garantiza que los servicios de los proveedores se supervisen, revisen y ajusten
            para mantener la seguridad de la información. Las medidas incluyen acuerdos de nivel de servicio, revisiones
            periódicas y actualizaciones de contratos.
        de:
          name: Überwachung, Überprüfung und Änderungsmanagement von Lieferantendienstleistungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Lieferantendienstleistungen kontinuierlich überwacht,
            bewertet und bei Bedarf angepasst werden, um Informationssicherheit, Servicequalität und Compliance
            dauerhaft sicherzustellen. Dazu gehören Leistungsüberprüfungen, Vertragsaktualisierungen und Risikobewertungen.
        zh:
          name: 监控、审查和变更供应商服务
          description: 这种控制确保供应商服务得到监控、审查和调整，以维护信息安全。措施包括服务水平协议、定期审查和合同更新。
        pl:
          name: Monitorowanie, przegląd i zarządzanie zmianami usług dostawców
          description: Zabezpieczenie zapewnia monitorowanie, przegląd i dostosowywanie usług dostawców w celu utrzymania
            bezpieczeństwa informacji. Obejmuje m.in. umowy o poziomie usług (SLA), okresowe przeglądy oraz aktualizacje
            umów.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 5.2

            Ustawa o KSC: KSC-09 (art. 8 ust. 1 pkt 2 lit. e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.23
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.23
      name: Information security for use of cloud services
      description: This control ensures the secure use of cloud services by addressing associated risks. Measures
        include data encryption, access controls, and provider compliance reviews.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.23
      translations:
        fr:
          name: Sécurité de l'information dans l'utilisation de services en nuage
          description: Cette mesure de sécurité garantit l'utilisation sécurisée des services cloud en abordant
            les risques associés. Les mesures incluent le chiffrement des données, les contrôles d'accès et les
            revues de conformité des fournisseurs.
        cs:
          name: Informační bezpečnost pro používání cloudových služeb
          description: Tato kontrola zajišťuje bezpečné používání cloudových služeb tím, že řeší související rizika.
            Mezi opatření patří šifrování dat, řízení přístupu a kontroly dodržování předpisů poskytovateli.
        sv:
          name: Informationssäkerhet för användning av molntjänster
          description: Den här kontrollen säkerställer säker användning av molntjänster genom att hantera associerade
            risker. Åtgärderna omfattar datakryptering, åtkomstkontroller och granskningar av providerefterlevnad.
        es:
          name: Seguridad de la información para el uso de servicios en la nube
          description: Este control garantiza el uso seguro de los servicios en la nube al abordar los riesgos asociados.
            Las medidas incluyen cifrado de datos, controles de acceso y revisiones de cumplimiento de proveedores.
        de:
          name: Informationssicherheit für die Nutzung von Cloud-Diensten
          description: Diese Steuerungsmaßnahme stellt sicher, dass Risiken im Zusammenhang mit der Nutzung von
            Cloud-Diensten identifiziert, bewertet und angemessen kontrolliert werden. Dazu gehören Verschlüsselung,
            Zugriffskontrollen, Compliance-Prüfungen, Überwachung des Cloud-Anbieters sowie Anforderungen an Datenstandorte
            und Incident-Response.
        zh:
          name: 云服务使用的信息安全
          description: 这种控制通过解决相关风险，确保云服务的安全使用。措施包括数据加密、访问控制和提供者合规审查。
        pl:
          name: Bezpieczeństwo informacji przy korzystaniu z usług chmurowych
          description: Zabezpieczenie zapewnia bezpieczne korzystanie z usług chmurowych poprzez uwzględnienie związanych
            z nimi ryzyk. Obejmuje m.in. szyfrowanie danych, kontrolę dostępu oraz przeglądy zgodności dostawców
            usług.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.1

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.24
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.24
      name: Information security incident management planning and preparation
      description: This control ensures proper planning and preparation for managing information security incidents.
        Measures include incident response plans, training exercises, and communication protocols.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.24
      translations:
        fr:
          name: Planification et préparation de la gestion des incidents de sécurité de l'information
          description: Cette mesure de sécurité garantit une planification et une préparation adéquates pour la
            gestion des incidents de sécurité de l'information. Les mesures incluent des plans de réponse aux incidents,
            des exercices de formation et des protocoles de communication.
        cs:
          name: Plánování a příprava řízení incidentů informační bezpečnosti
          description: Tato kontrola zajišťuje řádné plánování a přípravu na zvládání incidentů informační bezpečnosti.
            Mezi opatření patří plány reakce na incidenty, školení a komunikační protokoly.
        sv:
          name: Planering och förberedelse av hantering av informationssäkerhetsincidenter
          description: Denna kontroll säkerställer korrekt planering och förberedelse för hantering av informationssäkerhetsincidenter.
            Åtgärderna omfattar incidenthanteringsplaner, träningsövningar och kommunikationsprotokoll.
        es:
          name: Planificación y preparación de la gestión de incidentes de seguridad de la información
          description: Este control garantiza una planificación y preparación adecuadas para la gestión de incidentes
            de seguridad de la información. Las medidas incluyen planes de respuesta a incidentes, ejercicios de
            capacitación y protocolos de comunicación.
        de:
          name: Planung und Vorbereitung der Handhabung von Informationssicherheitsvorfällen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Strukturen, Rollen, Prozesse und Kommunikationswege
            für den Umgang mit Informationssicherheitsvorfällen vorbereitet, dokumentiert und regelmäßig getestet
            werden. Dazu gehören Incident-Response-Pläne, Schulungen, Übungen und Eskalationsmechanismen.
        zh:
          name: 信息安全事件管理规划与准备
          description: 这种控制确保了信息安全事件的合理规划和准备。措施包括事件响应计划、培训演习和通信协议。
        pl:
          name: Planowanie i przygotowanie zarządzania incydentami bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia właściwe zaplanowanie i przygotowanie zarządzania incydentami bezpieczeństwa
            informacji. Obejmuje m.in. plany reagowania na incydenty, ćwiczenia szkoleniowe oraz zasady komunikacji.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.1

            Ustawa o KSC: KSC-20 (art. 8 ust. 1 pkt 4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.25
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.25
      name: Assessment and decision on information security events
      description: This control establishes processes for assessing and deciding on actions related to information
        security events. Measures include root cause analysis, risk evaluation, and mitigation plans.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.25
      translations:
        fr:
          name: Évaluation des événements de sécurité de l'information et prise de décision
          description: Cette mesure de sécurité établit des processus pour évaluer et décider des actions liées
            aux événements de sécurité de l'information. Les mesures incluent l'analyse des causes profondes, l'évaluation
            des risques et des plans d'atténuation.
        cs:
          name: Posouzení a rozhodování o událostech informační bezpečnosti
          description: Tato kontrola zavádí procesy pro posuzování a rozhodování o akcích souvisejících s událostmi
            v oblasti informační bezpečnosti. Mezi tato opatření patří analýza hlavních příčin, hodnocení rizik
            a plány na zmírnění jejich dopadů.
        sv:
          name: Bedömning och beslut om informationssäkerhetshändelser
          description: Denna kontroll upprättar processer för att bedöma och besluta om åtgärder relaterade till
            informationssäkerhetshändelser. Åtgärderna omfattar grundorsaksanalys, riskbedömning och åtgärdsplaner.
        es:
          name: Evaluación y decisión sobre eventos de seguridad de la información
          description: Este control establece procesos para evaluar y decidir sobre acciones relacionadas con eventos
            de seguridad de la información. Las medidas incluyen análisis de causa raíz, evaluación de riesgos y
            planes de mitigación.
        de:
          name: Beurteilung und Entscheidung über Informationssicherheitsereignisse
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationssicherheitsereignisse systematisch
            erfasst, analysiert und bewertet werden. Dazu gehört die Entscheidung, ob ein Ereignis einen Sicherheitsvorfall
            darstellt, sowie die Durchführung von Ursachenanalysen, Risikobewertungen und Ableitung angemessener
            Maßnahmen.
        zh:
          name: 信息安全事件的评估与决策
          description: 这种控制建立了评估和决定与信息安全事件相关行动的流程。措施包括根本原因分析、风险评估和缓解计划。
        pl:
          name: Ocena i podejmowanie decyzji w sprawie zdarzeń bezpieczeństwa informacji
          description: Zabezpieczenie ustanawia procesy oceny zdarzeń bezpieczeństwa informacji i podejmowania decyzji
            o dalszych działaniach. Obejmuje m.in. analizę przyczyn źródłowych, ocenę ryzyka oraz plany ograniczania
            skutków.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.4

            Ustawa o KSC: KSC-20 (art. 8 ust. 1 pkt 4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.26
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.26
      name: Response to information security incidents
      description: This control ensures effective response to information security incidents to minimize impact
        and recover quickly. Measures include incident reporting, escalation protocols, and containment strategies.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.26
      translations:
        fr:
          name: Réponse aux incidents de sécurité de l'information
          description: Cette mesure de sécurité garantit une réponse efficace aux incidents de sécurité de l'information
            pour minimiser l'impact et récupérer rapidement. Les mesures incluent le signalement des incidents,
            des protocoles d'escalade et des stratégies de confinement.
        cs:
          name: Reakce na incidenty v oblasti informační bezpečnosti
          description: Tato kontrola zajišťuje efektivní reakci na incidenty informační bezpečnosti, minimalizuje
            dopad a umožňuje rychlou obnovu. Mezi tato opatření patří hlášení incidentů, eskalační protokoly a strategie
            omezení.
        sv:
          name: Åtgärder vid informationssäkerhetsincidenter
          description: Den här kontrollen säkerställer ett effektivt svar på informationssäkerhetsincidenter för
            att minimera påverkan och återhämta sig snabbt. Åtgärderna omfattar incidentrapportering, eskaleringsprotokoll
            och strategier för att begränsa spridningen.
        es:
          name: Respuesta a incidentes de seguridad de la información
          description: Este control garantiza una respuesta eficaz a los incidentes de seguridad de la información
            para minimizar el impacto y recuperarse rápidamente. Las medidas incluyen informes de incidentes, protocolos
            de escalada y estrategias de contención.
        de:
          name: Reaktion auf Informationssicherheitsvorfälle
          description: Diese Steuerungsmaßnahme stellt sicher, dass auf Informationssicherheitsvorfälle strukturiert,
            zeitnah und wirksam reagiert wird, um Auswirkungen zu minimieren und den Normalbetrieb schnellstmöglich
            wiederherzustellen. Dazu gehören Meldemechanismen, Eskalationswege, Eindämmungsmaßnahmen und Wiederherstellungsprozesse.
        zh:
          name: 信息安全事件的应对
          description: 这种控制确保了对信息安全事件的有效响应，最大限度地减少影响并迅速恢复。措施包括事件报告、升级协议和遏制策略。
        pl:
          name: Reagowanie na incydenty bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia skuteczne reagowanie na incydenty bezpieczeństwa informacji w celu
            ograniczenia ich skutków i szybkiego przywrócenia normalnego działania. Obejmuje m.in. zgłaszanie incydentów,
            procedury eskalacji oraz strategie powstrzymywania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.5, 4.3

            Ustawa o KSC: KSC-10 (art. 8 ust. 1 pkt 2 lit. f); KSC-20 (art. 8 ust. 1 pkt 4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.27
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.27
      name: Learning from information security incidents
      description: This control ensures lessons learned from information security incidents are documented and implemented
        to improve processes. Measures include post-incident reviews, action plans, and policy updates.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.27
      translations:
        fr:
          name: Tirer des enseignements des incidents de sécurité de l'information
          description: Cette mesure de sécurité garantit que les leçons tirées des incidents de sécurité de l'information
            sont documentées et mises en œuvre pour améliorer les processus. Les mesures incluent des revues post-incidents,
            des plans d'action et des mises à jour des politiques.
        cs:
          name: Poučení z incidentů v oblasti informační bezpečnosti
          description: Tato kontrola zajišťuje, že poznatky získané z incidentů v oblasti informační bezpečnosti
            jsou dokumentovány a implementovány za účelem zlepšení procesů. Mezi opatření patří kontroly po incidentu,
            akční plány a aktualizace zásad.
        sv:
          name: Att lära sig av informationssäkerhetsincidenter
          description: Denna kontroll säkerställer att lärdomar från informationssäkerhetsincidenter dokumenteras
            och implementeras för att förbättra processerna. Åtgärderna omfattar granskningar efter incidenter,
            handlingsplaner och policyuppdateringar.
        es:
          name: Aprender de los incidentes de seguridad de la información
          description: Este control garantiza que las lecciones aprendidas de los incidentes de seguridad de la
            información se documenten e implementen para mejorar los procesos. Las medidas incluyen revisiones posteriores
            al incidente, planes de acción y actualizaciones de políticas.
        de:
          name: Erkenntnisse aus Informationssicherheitsvorfällen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Erkenntnisse aus Sicherheitsvorfällen gesammelt,
            ausgewertet, dokumentiert und in Verbesserungsmaßnahmen umgesetzt werden. Dazu gehören Lessons-Learned-Sitzungen,
            Aktualisierung von Richtlinien und Anpassung von technischen und organisatorischen Maßnahmen.
        zh:
          name: 从信息安全事件中学习
          description: 这种控制确保信息安全事件中吸取的经验教训被记录并加以实施，以改进流程。措施包括事件后审查、行动计划和政策更新。
        pl:
          name: Wyciąganie wniosków z incydentów bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia dokumentowanie i wdrażanie wniosków z incydentów bezpieczeństwa informacji
            w celu doskonalenia procesów. Obejmuje m.in. przeglądy poincydentalne, plany działań oraz aktualizację
            polityk.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.6

            Ustawa o KSC: KSC-20 (art. 8 ust. 1 pkt 4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.28
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.28
      name: Collection of evidence
      description: This control ensures evidence is collected and preserved during security incidents to support
        investigations. Measures include chain-of-custody procedures, secure storage, and access controls.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.28
      translations:
        fr:
          name: Collecte de preuves
          description: Cette mesure de sécurité garantit que les preuves sont collectées et conservées lors des
            incidents de sécurité pour soutenir les enquêtes. Les mesures incluent des procédures de chaîne de conservation,
            le stockage sécurisé et les contrôles d'accès.
        cs:
          name: Shromažďování důkazů
          description: Tato kontrola zajišťuje shromažďování a uchovávání důkazů během bezpečnostních incidentů
            na podporu vyšetřování. Mezi opatření patří postupy řetězce úschovy, bezpečné úložiště a kontroly přístupu.
        sv:
          name: Insamling av bevisning
          description: Den här kontrollen säkerställer att bevis samlas in och bevaras under säkerhetsincidenter
            för att stödja undersökningar. Åtgärderna omfattar spårbarhetsprocedurer, säker lagring och åtkomstkontroller.
        es:
          name: Recopilación de pruebas
          description: Este control garantiza que las pruebas se recopilen y conserven durante los incidentes de
            seguridad para respaldar las investigaciones. Las medidas incluyen procedimientos de cadena de custodia,
            almacenamiento seguro y controles de acceso.
        de:
          name: Sammeln von Beweismaterial
          description: Diese Steuerungsmaßnahme stellt sicher, dass Beweismaterial bei Sicherheitsvorfällen ordnungsgemäß
            gesammelt, dokumentiert, gesichert und geschützt wird, um die Integrität, Nachvollziehbarkeit und gerichtliche
            Verwertbarkeit sicherzustellen. Dazu gehören Chain-of-Custody-Prozesse, sichere Lagerung und Zugriffskontrollen.
        zh:
          name: 证据收集
          description: 这种控制确保证据在安全事件期间被收集和保存，以支持调查。措施包括保管链程序、安全存储和门禁控制。
        pl:
          name: Gromadzenie dowodów
          description: Zabezpieczenie zapewnia gromadzenie i zabezpieczanie dowodów podczas incydentów bezpieczeństwa
            na potrzeby postępowań wyjaśniających. Obejmuje m.in. procedury zachowania łańcucha dowodowego, bezpieczne
            przechowywanie oraz kontrolę dostępu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.2, 10.4

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d); KSC-11 (art. 8 ust. 1 pkt 2 lit. g)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.29
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.29
      name: Information security during disruption
      description: This control ensures information security is maintained during disruptions to guarantee continuity
        of operations. Measures include contingency plans, backup systems, and failover mechanisms.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.29
      translations:
        fr:
          name: Sécurité de l'information pendant une perturbation
          description: Cette mesure de sécurité garantit que la sécurité de l'information est maintenue pendant
            les perturbations pour assurer la continuité des opérations. Les mesures incluent des plans de contingence,
            des systèmes de sauvegarde et des mécanismes de basculement.
        cs:
          name: Informační bezpečnost během narušení
          description: Tato kontrola zajišťuje zachování informační bezpečnosti během výpadků, aby byla zaručena
            kontinuita provozu. Mezi opatření patří pohotovostní plány, záložní systémy a mechanismy pro případ
            selhání.
        sv:
          name: Informationssäkerhet vid störningar
          description: Denna kontroll säkerställer att informationssäkerheten upprätthålls under störningar för
            att garantera kontinuiteten i verksamheten. Åtgärderna omfattar beredskapsplaner, säkerhetskopieringssystem
            och mekanismer för redundans.
        es:
          name: Seguridad de la información durante la interrupción
          description: Este control asegura que la seguridad de la información se mantenga durante las interrupciones
            para garantizar la continuidad de las operaciones. Las medidas incluyen planes de contingencia, sistemas
            de respaldo y mecanismos de conmutación por error.
        de:
          name: Informationssicherheit bei Störungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass die Informationssicherheit auch während betrieblicher
            Störungen, Notfälle oder Krisen aufrechterhalten wird. Dazu gehören Notfallmaßnahmen, alternative Betriebsverfahren,
            redundante Systeme und Priorisierung kritischer Prozesse.
        zh:
          name: 中断期间的信息安全
          description: 这种控制确保信息安全在中断期间得到维护，确保运营的连续性。措施包括应急预案、备份系统和故障切换机制。
        pl:
          name: Bezpieczeństwo informacji podczas zakłóceń
          description: Zabezpieczenie zapewnia utrzymanie bezpieczeństwa informacji w czasie zakłóceń, aby zagwarantować
            ciągłość działania. Obejmuje m.in. plany awaryjne, systemy zapasowe oraz mechanizmy przełączania awaryjnego
            (failover).
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 4.1, 4.3

            Ustawa o KSC: KSC-10 (art. 8 ust. 1 pkt 2 lit. f)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.30
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.30
      name: ICT readiness for business continuity
      description: This control ensures ICT readiness for business continuity to minimize downtime during disruptions.
        Measures include testing recovery plans, redundant systems, and disaster recovery sites.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.30
      translations:
        fr:
          name: Préparation des TIC la continuité d'activité
          description: Cette mesure de sécurité garantit la préparation TIC pour la continuité des activités afin
            de minimiser les temps d'arrêt pendant les perturbations. Les mesures incluent des tests de plans de
            reprise, des systèmes redondants et des sites de reprise après sinistre.
        cs:
          name: Připravenost ICT pro zajištění kontinuity podnikání
          description: Tato kontrola zajišťuje připravenost IKT pro zajištění kontinuity provozu, aby se minimalizovaly
            prostoje během narušení provozu. Mezi tato opatření patří testování plánů obnovy, redundantních systémů
            a lokalit pro obnovu po havárii.
        sv:
          name: IKT-beredskap för kontinuitet i verksamheten
          description: Den här kontrollen säkerställer IKT-beredskap för affärskontinuitet för att minimera driftstopp
            under störningar. Åtgärderna omfattar testning av återställningsplaner, redundanta system och haveriberedskapsplatser.
        es:
          name: Preparación de las TIC para la continuidad de las actividades
          description: Este control garantiza la preparación de las TIC para la continuidad del negocio a fin de
            minimizar el tiempo de inactividad durante las interrupciones. Las medidas incluyen probar planes de
            recuperación, sistemas redundantes y sitios de recuperación ante desastres.
        de:
          name: IKT-Bereitschaft für Business Continuity
          description: Diese Steuerungsmaßnahme stellt sicher, dass IKT-Systeme und -Dienste so vorbereitet sind,
            dass sie Ziele der Geschäftskontinuität unterstützen. Dazu gehören Redundanzen, Wiederanlaufverfahren,
            regelmäßige Tests von Wiederherstellungsplänen und Ausweichstandorte.
        zh:
          name: ICT业务连续性准备
          description: 这种控制确保ICT对业务连续性做好准备，最大限度地减少中断期间的停机时间。措施包括测试恢复计划、冗余系统和灾难恢复站点。
        pl:
          name: Gotowość ICT do zapewnienia ciągłości działania
          description: Zabezpieczenie zapewnia gotowość ICT na potrzeby ciągłości działania, aby ograniczyć przestoje
            w czasie zakłóceń. Obejmuje m.in. testowanie planów odtwarzania, systemy redundantne oraz zapasowe ośrodki
            przetwarzania (DR).
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 4.1, 4.3

            Ustawa o KSC: KSC-10 (art. 8 ust. 1 pkt 2 lit. f)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.31
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.31
      name: Legal, statutory, regulatory and contractual requirements
      description: This control ensures compliance with legal, statutory, regulatory, and contractual information
        security requirements. Measures include policy reviews, audits, and evidence documentation.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.31
      translations:
        fr:
          name: Exigences légales, statutaires, réglementaires et contractuelles
          description: Cette mesure de sécurité garantit la conformité aux exigences légales, réglementaires et
            contractuelles en matière de sécurité de l'information. Les mesures incluent des revues de politiques,
            des audits et la documentation des preuves.
        cs:
          name: Zákonné, statutární, regulatorní a smluvní požadavky
          description: Tato kontrola zajišťuje soulad s právními, zákonnými, regulačními a smluvními požadavky na
            informační bezpečnost. Mezi opatření patří přezkumy politik, audity a dokumentace důkazů.
        sv:
          name: Juridiska, lagstadgade, regulatoriska och avtalsmässiga krav
          description: Denna kontroll säkerställer efterlevnad av juridiska, lagstadgade, regulatoriska och avtalsenliga
            informationssäkerhetskrav. Åtgärderna omfattar policygranskningar, revisioner och bevisdokumentation.
        es:
          name: Requisitos legales, estatutarios, reglamentarios y contractuales
          description: Este control garantiza el cumplimiento de los requisitos legales, estatutarios, reglamentarios
            y contractuales de seguridad de la información. Las medidas incluyen revisiones de políticas, auditorías
            y documentación de evidencias.
        de:
          name: Juristische, gesetzliche, regulatorische und vertragliche Anforderungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass alle relevanten gesetzlichen, regulatorischen
            und vertraglichen Anforderungen identifiziert, dokumentiert, regelmäßig überprüft und eingehalten werden.
            Dazu gehören Datenschutzvorgaben, Normen, branchenspezifische Anforderungen und vertragliche Verpflichtungen.
        zh:
          name: 法律、法定、监管和合同要求
          description: 这种控制确保符合法律、法定、监管和合同信息安全要求。措施包括政策审查、审计和证据记录。
        pl:
          name: Wymagania prawne, ustawowe, regulacyjne i umowne
          description: Zabezpieczenie zapewnia zgodność z prawnymi, ustawowymi, regulacyjnymi i umownymi wymaganiami
            dotyczącymi bezpieczeństwa informacji. Obejmuje m.in. przeglądy polityk, audyty oraz dokumentowanie
            dowodów zgodności.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.2, 9.1

            Ustawa o KSC: KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-15 (art. 8 ust. 1 pkt 2 lit. k)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.32
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.32
      name: Intellectual property rights
      description: This control ensures intellectual property rights are protected through appropriate information
        security measures. Measures include access restrictions, encryption, and legal agreements.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.32
      translations:
        fr:
          name: Droits de propriété intellectuelle
          description: Cette mesure de sécurité garantit la protection des droits de propriété intellectuelle par
            des mesures de sécurité de l'information appropriées. Les mesures incluent des restrictions d'accès,
            le chiffrement et des accords légaux.
        cs:
          name: Práva duševního vlastnictví
          description: Tato kontrola zajišťuje ochranu práv duševního vlastnictví prostřednictvím vhodných opatření
            v oblasti zabezpečení informací. Mezi tato opatření patří omezení přístupu, šifrování a právní dohody.
        sv:
          name: Immateriella rättigheter
          description: Denna kontroll säkerställer att immateriella rättigheter skyddas genom lämpliga informationssäkerhetsåtgärder.
            Åtgärderna omfattar åtkomstbegränsningar, kryptering och juridiska avtal.
        es:
          name: Derechos de propiedad intelectual
          description: Este control garantiza que los derechos de propiedad intelectual estén protegidos a través
            de medidas de seguridad de la información adecuadas. Las medidas incluyen restricciones de acceso, cifrado
            y acuerdos legales.
        de:
          name: Geistige Eigentumsrechte
          description: Diese Steuerungsmaßnahme schützt geistiges Eigentum durch geeignete technische und organisatorische
            Maßnahmen. Dazu gehören Zugriffsbeschränkungen, Verschlüsselung, vertragliche Vereinbarungen und Schutz
            vor unbefugter Nutzung oder Verbreitung.
        zh:
          name: 知识产权
          description: 这种控制确保知识产权通过适当的信息安全措施得到保护。措施包括访问限制、加密和法律协议。
        pl:
          name: Prawa własności intelektualnej
          description: Zabezpieczenie zapewnia ochronę praw własności intelektualnej za pomocą odpowiednich środków
            bezpieczeństwa informacji. Obejmuje m.in. ograniczenia dostępu, szyfrowanie oraz umowy prawne.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.9

            Ustawa o KSC: KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.33
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.33
      name: Protection of records
      description: This control ensures records are securely stored and protected to prevent loss or unauthorized
        access. Measures include retention policies, secure storage, and access controls.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.33
      translations:
        fr:
          name: Protection des enregistrements
          description: Cette mesure de sécurité garantit que les enregistrements sont stockés et protégés de manière
            sécurisée pour prévenir toute perte ou accès non autorisé. Les mesures incluent des politiques de rétention,
            un stockage sécurisé et des contrôles d'accès.
        cs:
          name: Ochrana záznamů
          description: Tato kontrola zajišťuje, že záznamy jsou bezpečně uloženy a chráněny, aby se zabránilo ztrátě
            nebo neoprávněnému přístupu. Mezi opatření patří zásady uchovávání, bezpečné úložiště a kontroly přístupu.
        sv:
          name: Skydd av register
          description: Den här kontrollen säkerställer att arkivhandlingar lagras och skyddas på ett säkert sätt
            för att förhindra förlust eller obehörig åtkomst. Åtgärderna omfattar kvarhållningsprinciper, säker
            lagring och åtkomstkontroller.
        es:
          name: Protección de registros
          description: Este control garantiza que los registros se almacenen y protejan de forma segura para evitar
            pérdidas o accesos no autorizados. Las medidas incluyen políticas de retención, almacenamiento seguro
            y controles de acceso.
        de:
          name: Schutz von Aufzeichnungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Aufzeichnungen während ihrer gesamten Aufbewahrungsdauer
            geschützt werden – vor Verlust, Veränderung, unbefugtem Zugriff oder Zerstörung. Dazu gehören Aufbewahrungsrichtlinien,
            sichere Lagerung und kontrollierter Zugriff.
        zh:
          name: 档案保护
          description: 这种控制确保记录安全存储和保护，防止丢失或未经授权访问。措施包括保留政策、安全存储和访问控制。
        pl:
          name: Ochrona zapisów
          description: Zabezpieczenie zapewnia bezpieczne przechowywanie i ochronę zapisów przed utratą lub nieuprawnionym
            dostępem. Obejmuje m.in. zasady retencji, bezpieczne przechowywanie oraz kontrolę dostępu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-32 (art. 10 ust. 1-3); KSC-34 (art. 10 ust. 2,
            4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.34
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.34
      name: Privacy and protection of PII
      description: This control protects privacy and ensures the secure handling of personally identifiable information
        (PII). Measures include anonymization, encryption, and compliance with privacy laws.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.34
      translations:
        fr:
          name: Protection de la vie privée et des données à caractère personnel (DCP)
          description: Cette mesure de sécurité protège la confidentialité et garantit le traitement sécurisé des
            informations personnellement identifiables (PII). Les mesures incluent l'anonymisation, le chiffrement
            et la conformité aux lois sur la confidentialité.
        cs:
          name: Ochrana soukromí a osobních údajů PII
          description: Tato kontrola chrání soukromí a zajišťuje bezpečné nakládání s osobně identifikovatelnými
            údaji (PII). Mezi opatření patří anonymizace, šifrování a dodržování zákonů na ochranu osobních údajů.
        sv:
          name: Sekretess och skydd av personuppgifter
          description: Den här kontrollen skyddar sekretessen och säkerställer säker hantering av personligt identifierbar
            information (PII). Åtgärderna omfattar anonymisering, kryptering och efterlevnad av integritetslagar.
        es:
          name: Privacidad y protección de la información personal
          description: Este control protege la privacidad y garantiza el manejo seguro de la información de identificación
            personal (PII). Las medidas incluyen la anonimización, el cifrado y el cumplimiento de las leyes de
            privacidad.
        de:
          name: Datenschutz und Schutz von personenbezogenen Daten
          description: Diese Steuerungsmaßnahme stellt sicher, dass personenbezogene Daten gemäß gesetzlichen und
            vertraglichen Datenschutzanforderungen verarbeitet und geschützt werden. Dazu gehören Verschlüsselung,
            Zugriffskontrolle, Minimierung und Dokumentation der Datenverarbeitung.
        zh:
          name: 个人隐私保护与保护
          description: 这种控制保护隐私，确保个人身份信息（PII）的安全处理。措施包括匿名化、加密以及遵守隐私法律。
        pl:
          name: Prywatność i ochrona danych osobowych
          description: Zabezpieczenie chroni prywatność i zapewnia bezpieczne przetwarzanie danych osobowych. Obejmuje
            m.in. anonimizację, szyfrowanie oraz zgodność z przepisami o ochronie prywatności i danych osobowych.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.35
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.35
      name: Independent review of information security
      description: This control ensures independent reviews of information security to evaluate effectiveness and
        compliance. Measures include external audits, risk assessments, and follow-up actions.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.35
      translations:
        fr:
          name: Révision indépendante de la sécurité de l'information
          description: Cette mesure de sécurité garantit des revues indépendantes de la sécurité de l'information
            pour évaluer l'efficacité et la conformité. Les mesures incluent des audits externes, des évaluations
            des risques et des actions de suivi.
        cs:
          name: Nezávislý přezkum informační bezpečnosti
          description: Tato kontrola zajišťuje nezávislé kontroly informační bezpečnosti za účelem vyhodnocení efektivity
            a souladu s předpisy. Mezi opatření patří externí audity, posouzení rizik a následná opatření.
        sv:
          name: Oberoende granskning av informationssäkerhet
          description: Denna kontroll säkerställer oberoende granskningar av informationssäkerhet för att utvärdera
            effektivitet och efterlevnad. Åtgärderna omfattar bland annat externa revisioner, riskbedömningar och
            uppföljningsåtgärder.
        es:
          name: Revisión independiente de la seguridad de la información
          description: Este control garantiza revisiones independientes de la seguridad de la información para evaluar
            la eficacia y el cumplimiento. Las medidas incluyen auditorías externas, evaluaciones de riesgos y acciones
            de seguimiento.
        de:
          name: Unabhängige Überprüfung der Informationssicherheit
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationssicherheit regelmäßig unabhängig
            bewertet wird, um Wirksamkeit, Angemessenheit und Konformität des ISMS zu überprüfen. Dazu gehören interne
            oder externe Audits, Sicherheitsbewertungen und Nachverfolgung von Maßnahmen.
        zh:
          name: 信息安全独立审查
          description: 这种控制确保了对信息安全的独立审查，以评估其有效性和合规性。措施包括外部审计、风险评估和后续行动。
        pl:
          name: Niezależny przegląd bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia niezależne przeglądy bezpieczeństwa informacji w celu oceny jego
            skuteczności i zgodności. Obejmuje m.in. audyty zewnętrzne, oceny ryzyka oraz działania następcze.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.2, 2.3

            Ustawa o KSC: KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-48 (art. 15)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.36
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.36
      name: Compliance with policies, rules and standards for information security
      description: This control ensures compliance with all policies, rules, and standards for information security.
        Measures include regular training, policy reviews, and enforcement mechanisms.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.36
      translations:
        fr:
          name: Conformité aux politiques, règles et normes de sécurité de l'information
          description: Cette mesure de sécurité garantit la conformité à toutes les politiques, règles et normes
            en matière de sécurité de l'information. Les mesures incluent des formations régulières, des revues
            de politiques et des mécanismes d'application.
        cs:
          name: Dodržování zásad, pravidel a standardů pro informační bezpečnost
          description: Tato kontrola zajišťuje dodržování všech zásad, pravidel a standardů pro informační bezpečnost.
            Mezi opatření patří pravidelná školení, revize zásad a mechanismy vymáhání.
        sv:
          name: Efterlevnad av policys, regler och standarder för informationssäkerhet
          description: Den här kontrollen säkerställer efterlevnad av alla policyer, regler och standarder för informationssäkerhet.
            Åtgärderna omfattar regelbunden utbildning, policygranskningar och verkställighetsmekanismer.
        es:
          name: Cumplimiento de políticas, reglas y estándares de seguridad de la información
          description: Este control garantiza el cumplimiento de todas las políticas, reglas y estándares de seguridad
            de la información. Las medidas incluyen capacitación periódica, revisiones de políticas y mecanismos
            de aplicación.
        de:
          name: Einhaltung von Richtlinien, Vorschriften und Normen
          description: Diese Steuerungsmaßnahme stellt sicher, dass alle Vorgaben, Richtlinien, Regeln und Standards
            zur Informationssicherheit eingehalten werden. Dazu gehören Schulungen, Überwachungsprozesse, Kontrollen
            und Eskalationsmechanismen.
        zh:
          name: 遵守信息安全的政策、规则和标准
          description: 这种控制确保遵守所有信息安全的政策、规则和标准。措施包括定期培训、政策审查和执法机制。
        pl:
          name: Zgodność z politykami, zasadami i normami bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia zgodność ze wszystkimi politykami, zasadami i normami bezpieczeństwa
            informacji. Obejmuje m.in. regularne szkolenia, przeglądy polityk oraz mechanizmy egzekwowania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1, 2.2

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-12 (art. 8 ust. 1 pkt 2 lit. h)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.5.37
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.5
      ref_id: A.5.37
      name: Documented operating procedures
      description: This control develops and maintains documented operating procedures to ensure consistency in
        security practices. Measures include process documentation, version control, and accessibility.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.5.37
      translations:
        fr:
          name: Procédures d'exploitation documentées
          description: Cette mesure de sécurité développe et maintient des procédures opérationnelles documentées
            pour garantir la cohérence des pratiques de sécurité. Les mesures incluent la documentation des processus,
            le contrôle des versions et l'accessibilité.
        cs:
          name: Dokumentované provozní postupy
          description: Tato kontrola vyvíjí a udržuje zdokumentované provozní postupy, aby byla zajištěna konzistence
            bezpečnostních postupů. Mezi opatření patří dokumentace procesů, správa verzí a přístupnost.
        sv:
          name: Dokumenterade driftsprocedurer
          description: Den här kontrollen utvecklar och underhåller dokumenterade driftsprocedurer för att säkerställa
            konsekvens i säkerhetsrutinerna. Åtgärderna omfattar bland annat processdokumentation, versionskontroll
            och tillgänglighet.
        es:
          name: Procedimientos operativos documentados
          description: Este control desarrolla y mantiene procedimientos operativos documentados para garantizar
            la coherencia en las prácticas de seguridad. Las medidas incluyen la documentación del proceso, el control
            de versiones y la accesibilidad.
        de:
          name: Dokumentierte Betriebsabläufe
          description: Diese Steuerungsmaßnahme stellt sicher, dass Betriebsprozesse dokumentiert, gepflegt, versioniert
            und für berechtigte Personen verfügbar sind, um konsistente, sichere und nachvollziehbare Abläufe sicherzustellen.
        zh:
          name: 文档作程序
          description: 该控制制定并维护有文档的作程序，以确保安全实践的一致性。措施包括流程文档、版本控制和无障碍。
        pl:
          name: Udokumentowane procedury eksploatacyjne
          description: Zabezpieczenie polega na opracowaniu i utrzymywaniu udokumentowanych procedur eksploatacyjnych,
            zapewniających spójność praktyk bezpieczeństwa. Obejmuje m.in. dokumentowanie procesów, kontrolę wersji
            oraz dostępność dokumentacji.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-32 (art. 10 ust. 1-3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.6
      name: People controls
      implementation_groups:
      - SoA
      translations:
        fr:
          name: Mesures de sécurité applicables aux personnes
        cs:
          name: Kontroly v oblasti lidských zdrojů
        sv:
          name: Kontroller för personer
        es:
          name: Controles de personas
        de:
          name: Personenbezogene Maßnahmen
        zh:
          name: 人员控制
        pl:
          name: Zabezpieczenia osobowe
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.1
      name: Screening
      description: This control ensures the implementation of screening processes to verify the suitability of candidates
        before employment. Measures include background checks, identity verification, and assessment of qualifications
        to reduce security risks.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.1
      translations:
        fr:
          name: Sélection des candidats
          description: Cette mesure de sécurité garantit la mise en œuvre de processus de vérification pour évaluer
            l'adéquation des candidats avant leur embauche. Les mesures incluent des vérifications des antécédents,
            la vérification d'identité et l'évaluation des qualifications pour réduire les risques de sécurité.
        cs:
          name: Prověřování
          description: Tato kontrola zajišťuje implementaci screeningových procesů k ověření vhodnosti kandidátů
            před jejich zaměstnáním. Mezi opatření patří prověrky, ověřování totožnosti a posouzení kvalifikací
            za účelem snížení bezpečnostních rizik.
        sv:
          name: Sållning
          description: Denna kontroll säkerställer genomförandet av screeningprocesser för att verifiera kandidaternas
            lämplighet före anställning. Åtgärderna inkluderar bakgrundskontroller, identitetsverifiering och bedömning
            av kvalifikationer för att minska säkerhetsriskerna.
        es:
          name: Chequeo
          description: Este control asegura la implementación de procesos de selección para verificar la idoneidad
            de los candidatos antes de su contratación. Las medidas incluyen verificaciones de antecedentes, verificación
            de identidad y evaluación de calificaciones para reducir los riesgos de seguridad.
        de:
          name: Sicherheitsüberprüfung
          description: Diese Steuerungsmaßnahme stellt sicher, dass geeignete Hintergrundprüfungen durchgeführt
            werden, um die Vertrauenswürdigkeit und Eignung von Bewerbern zu bestätigen. Dazu gehören Identitätsprüfung,
            Qualifikationsnachweise und weitere gesetzlich zulässige Überprüfungen.
        zh:
          name: 放映
          description: 这种控制确保在聘用前实施筛选流程，以验证候选人的适任性。措施包括背景调查、身份验证和资格评估，以降低安全风险。
        pl:
          name: Postępowanie sprawdzające
          description: Zabezpieczenie zapewnia wdrożenie procesu weryfikacji kandydatów przed zatrudnieniem w celu
            potwierdzenia ich przydatności. Obejmuje m.in. sprawdzenie przeszłości kandydata, weryfikację tożsamości
            oraz ocenę kwalifikacji, co ogranicza ryzyka bezpieczeństwa.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.2

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d); KSC-27 (art. 8f)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.2
      name: Terms and conditions of employment
      description: This control ensures that terms and conditions of employment include information security responsibilities.
        Measures include explicit clauses about confidentiality, compliance with policies, and consequences for
        breaches.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.2
      translations:
        fr:
          name: Termes et conditions du contrat de travail
          description: Cette mesure de sécurité garantit que les termes et conditions d'emploi incluent des responsabilités
            en matière de sécurité de l'information. Les mesures incluent des clauses explicites sur la confidentialité,
            le respect des politiques et les conséquences des violations.
        cs:
          name: Podmínky pracovního poměru
          description: Tato kontrola zajišťuje, aby pracovní podmínky zahrnovaly odpovědnosti za informační bezpečnost.
            Opatření zahrnují explicitní ustanovení o důvěrnosti, dodržování zásad a důsledcích porušení.
        sv:
          name: Anställningsvillkor
          description: Denna kontroll säkerställer att det i anställningsvillkoren ingår ett ansvar för informationssäkerhet.
            Åtgärderna omfattar uttryckliga klausuler om konfidentialitet, efterlevnad av policyer och konsekvenser
            vid överträdelser.
        es:
          name: Términos y condiciones de empleo
          description: Este control garantiza que los términos y condiciones de empleo incluyan responsabilidades
            en materia de seguridad de la información. Las medidas incluyen cláusulas explícitas sobre confidencialidad,
            cumplimiento de políticas y consecuencias por infracciones.
        de:
          name: Beschäftigungs- und Vertragsbedingungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass arbeitsvertragliche Vereinbarungen klare Anforderungen
            an Informationssicherheit, Vertraulichkeit und Compliance enthalten. Mitarbeitende müssen ihre sicherheitsrelevanten
            Verantwortlichkeiten verstehen und anerkennen.
        zh:
          name: 雇佣条款与条件
          description: 这种控制确保雇佣条款和条件包含信息安全责任。措施包括明确规定保密、遵守政策以及违规后果等条款。
        pl:
          name: Warunki zatrudnienia
          description: Zabezpieczenie zapewnia, że warunki zatrudnienia obejmują obowiązki w zakresie bezpieczeństwa
            informacji. Obejmuje m.in. wyraźne zapisy dotyczące poufności, przestrzegania polityk oraz konsekwencji
            naruszeń.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.1

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.3
      name: Information security awareness, education and training
      description: This control ensures that employees receive regular information security awareness, education,
        and training. Measures include scheduled training sessions, e-learning programs, and simulated phishing
        exercises.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.3
      translations:
        fr:
          name: Sensibilisation, enseignement et formation en sécurité de l'information
          description: Cette mesure de sécurité garantit que les employés reçoivent une sensibilisation, une éducation
            et une formation régulières en matière de sécurité de l'information. Les mesures incluent des sessions
            de formation planifiées, des programmes d'apprentissage en ligne et des exercices de phishing simulés.
        cs:
          name: Povědomí o informační bezpečnosti, vzdělávání a školení
          description: Tato kontrola zajišťuje, že zaměstnanci pravidelně dostávají povědomí o informační bezpečnosti,
            vzdělávání a školení. Mezi opatření patří plánovaná školení, e-learningové programy a simulovaná cvičení
            proti phishingu.
        sv:
          name: Medvetenhet, utbildning och fortbildning om informationssäkerhet
          description: Denna kontroll säkerställer att anställda får regelbunden medvetenhet, utbildning och träning
            om informationssäkerhet. Åtgärderna inkluderar schemalagda utbildningssessioner, e-learningprogram och
            simulerade phishing-övningar.
        es:
          name: Concienciación, educación y formación en materia de seguridad de la información
          description: Este control garantiza que los empleados reciban concienciación, educación y formación periódicas
            sobre la seguridad de la información. Las medidas incluyen sesiones de capacitación programadas, programas
            de aprendizaje electrónico y ejercicios simulados de phishing.
        de:
          name: Informationssicherheitsbewusstsein, Ausbildung und Schulung
          description: Diese Steuerungsmaßnahme stellt sicher, dass alle relevanten Personen regelmäßig Schulungen,
            Awareness-Maßnahmen und Unterweisungen zur Informationssicherheit erhalten, um Risiken zu verstehen
            und sichere Verhaltensweisen anzuwenden.
        zh:
          name: 信息安全意识、教育与培训
          description: 这种控制确保员工定期获得信息安全意识、教育和培训。措施包括定期培训、电子学习项目和模拟钓鱼演习。
        pl:
          name: Uświadamianie, kształcenie i szkolenia w zakresie bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia pracownikom regularne działania uświadamiające, kształcenie i szkolenia
            w zakresie bezpieczeństwa informacji. Obejmuje m.in. cykliczne szkolenia, programy e-learningowe oraz
            symulowane kampanie phishingowe.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 8.1, 8.2, 10.1

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d); KSC-13 (art. 8 ust. 1 pkt 2 lit. i); KSC-14 (art.
            8 ust. 1 pkt 2 lit. j); KSC-26 (art. 8e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.4
      name: Disciplinary process
      description: This control establishes a disciplinary process to address breaches of information security policies.
        Measures include clear guidelines, escalation procedures, and consistent enforcement to maintain accountability.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.4
      translations:
        fr:
          name: Procédure disciplinaire
          description: Cette mesure de sécurité établit un processus disciplinaire pour traiter les violations des
            politiques de sécurité de l'information. Les mesures incluent des lignes directrices claires, des procédures
            d'escalade et une application cohérente pour maintenir la responsabilité.
        cs:
          name: Disciplinární řízení
          description: Tato kontrola zavádí disciplinární proces pro řešení porušení zásad informační bezpečnosti.
            Mezi opatření patří jasné pokyny, eskalační postupy a důsledné vymáhání práva k zachování odpovědnosti.
        sv:
          name: Disciplinär process
          description: Denna kontroll upprättar en disciplinär process för att hantera brott mot informationssäkerhetspolicyer.
            Åtgärderna omfattar tydliga riktlinjer, eskaleringsförfaranden och konsekvent tillämpning för att upprätthålla
            ansvarsskyldigheten.
        es:
          name: Proceso disciplinario
          description: Este control establece un proceso disciplinario para abordar las violaciones de las políticas
            de seguridad de la información. Las medidas incluyen directrices claras, procedimientos de escalamiento
            y una aplicación coherente para mantener la rendición de cuentas.
        de:
          name: Maßregelungsprozess
          description: Diese Steuerungsmaßnahme stellt sicher, dass Verstöße gegen Sicherheitsrichtlinien formal,
            fair und nachvollziehbar behandelt werden. Der Prozess legt Maßnahmen, Eskalationswege und Konsequenzen
            fest.
        zh:
          name: 纪律处分程序
          description: 该控制建立了纪律程序，以处理信息安全政策的违规行为。措施包括明确的指导方针、升级程序和持续的执法，以保持问责制。
        pl:
          name: Postępowanie dyscyplinarne
          description: Zabezpieczenie ustanawia postępowanie dyscyplinarne w przypadku naruszeń polityk bezpieczeństwa
            informacji. Obejmuje m.in. jasne wytyczne, procedury eskalacji oraz konsekwentne egzekwowanie zasad
            w celu utrzymania rozliczalności.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.4

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.5
      name: Responsibilities after termination or change of employment
      description: This control ensures that responsibilities related to information security are defined and enforced
        after termination or role changes. Measures include revoking access rights, collecting organizational assets,
        and conducting exit interviews.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.5
      translations:
        fr:
          name: Responsabilités après la fin ou le changement d'emploi
          description: Cette mesure de sécurité garantit que les responsabilités liées à la sécurité de l'information
            sont définies et appliquées après la fin d’un contrat ou un changement de rôle. Les mesures incluent
            la révocation des droits d'accès, la récupération des actifs de l'organisation et la réalisation d'entretiens
            de sortie.
        cs:
          name: odpovědnosti po ukončení nebo změně pracovního poměru
          description: Tato kontrola zajišťuje, že odpovědnosti související s informační bezpečností jsou definovány
            a vymáhány po ukončení pracovního poměru nebo změně role. Mezi opatření patří odebrání přístupových
            práv, shromažďování organizačních aktiv a provádění výstupních pohovorů.
        sv:
          name: Ansvar efter uppsägning eller byte av anställning
          description: Den här kontrollen säkerställer att ansvarsområden som rör informationssäkerhet definieras
            och verkställs efter uppsägning eller rolländringar. Åtgärderna omfattar återkallande av åtkomsträttigheter,
            insamling av organisationstillgångar och genomförande av avslutningsintervjuer.
        es:
          name: Responsabilidades después de la terminación o cambio de empleo
          description: Este control garantiza que las responsabilidades relacionadas con la seguridad de la información
            se definan y apliquen después de la terminación o los cambios de rol. Las medidas incluyen la revocación
            de los derechos de acceso, la recopilación de activos de la organización y la realización de entrevistas
            de salida.
        de:
          name: Verantwortlichkeiten bei Beendigung oder Änderung der Beschäftigung
          description: Diese Steuerungsmaßnahme stellt sicher, dass bei Beendigung des Arbeitsverhältnisses oder
            Rollenwechsels alle sicherheitsrelevanten Verantwortlichkeiten berücksichtigt werden – einschließlich
            Entzug von Zugriffsrechten, Rückgabe von Werten und fortbestehender Vertraulichkeitspflichten.
        zh:
          name: 离职或更换工作后的职责
          description: 这种控制确保信息安全相关的职责在离职或职位变更后得到定义和执行。措施包括撤销访问权、收缴组织资产以及进行离职面谈。
        pl:
          name: Obowiązki po zakończeniu lub zmianie zatrudnienia
          description: Zabezpieczenie zapewnia określenie i egzekwowanie obowiązków w zakresie bezpieczeństwa informacji
            po zakończeniu zatrudnienia lub zmianie roli. Obejmuje m.in. odebranie praw dostępu, odebranie aktywów
            organizacji oraz przeprowadzanie rozmów końcowych.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.3

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.6
      name: Confidentiality or non-disclosure agreements
      description: This control implements confidentiality or non-disclosure agreements to protect sensitive information.
        Measures include signed agreements at the start of employment, periodic reminders, and enforcement of legal
        actions in case of violations.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.6
      translations:
        fr:
          name: Accords de confidentialité ou de non-divulgation
          description: Cette mesure de sécurité met en œuvre des accords de confidentialité ou de non-divulgation
            pour protéger les informations sensibles. Les mesures incluent des accords signés au début de l'emploi,
            des rappels périodiques et l'application d'actions légales en cas de violations.
        cs:
          name: Dohody o důvěrnosti nebo mlčenlivosti
          description: Tato kontrola zavádí dohody o mlčenlivosti nebo mlčenlivosti na ochranu citlivých informací.
            Mezi opatření patří podepsané dohody na začátku pracovního poměru, pravidelné upomínky a vymáhání právních
            kroků v případě porušení.
        sv:
          name: Avtal om konfidentialitet eller tystnadsplikt
          description: Den här kontrollen implementerar sekretess- eller sekretessavtal för att skydda känslig information.
            Åtgärderna inkluderar undertecknade avtal vid anställningens början, periodiska påminnelser och verkställighet
            av rättsliga åtgärder vid överträdelser.
        es:
          name: Acuerdos de confidencialidad o no divulgación
          description: Este control implementa acuerdos de confidencialidad o no divulgación para proteger la información
            confidencial. Las medidas incluyen acuerdos firmados al comienzo del empleo, recordatorios periódicos
            y la aplicación de acciones legales en caso de violaciones.
        de:
          name: Vertraulichkeits- oder Geheimhaltungsvereinbarungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Mitarbeitende und externe Parteien entsprechende
            Vertraulichkeitsvereinbarungen unterzeichnen, die definieren, wie sensible Informationen zu schützen
            sind – auch nach Ende der Zusammenarbeit.
        zh:
          name: 保密协议或保密协议
          description: 该控制实施保密协议或保密协议以保护敏感信息。措施包括入职时签署协议、定期提醒以及在违规时执行法律行动。
        pl:
          name: Umowy o zachowaniu poufności lub o nieujawnianiu informacji
          description: Zabezpieczenie wprowadza umowy o zachowaniu poufności lub o nieujawnianiu informacji (NDA)
            w celu ochrony informacji wrażliwych. Obejmuje m.in. podpisywanie umów na początku zatrudnienia, okresowe
            przypomnienia oraz dochodzenie roszczeń na drodze prawnej w razie naruszeń.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.1 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.7
      name: Remote working
      description: This control ensures the secure management of information security risks during remote working.
        Measures include secure access to corporate systems, mandatory use of VPNs, and policies for handling sensitive
        data remotely.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.7
      translations:
        fr:
          name: Travail à distance
          description: Cette mesure de sécurité garantit la gestion sécurisée des risques liés à la sécurité de
            l'information pendant le télétravail. Les mesures incluent un accès sécurisé aux systèmes de l'entreprise,
            l'utilisation obligatoire de VPN et des politiques pour la gestion des données sensibles à distance.
        cs:
          name: Práce na dálku
          description: Tato kontrola zajišťuje bezpečné řízení rizik informační bezpečnosti během práce na dálku.
            Mezi opatření patří zabezpečený přístup k podnikovým systémům, povinné používání VPN a zásady pro vzdálenou
            manipulaci s citlivými daty.
        sv:
          name: Arbete på distans
          description: Denna kontroll säkerställer en säker hantering av informationssäkerhetsrisker under distansarbete.
            Åtgärderna omfattar säker åtkomst till företagssystem, obligatorisk användning av VPN:er och policyer
            för hantering av känsliga data på distans.
        es:
          name: Trabajo a distancia
          description: Este control garantiza la gestión segura de los riesgos de seguridad de la información durante
            el trabajo a distancia. Las medidas incluyen acceso seguro a los sistemas corporativos, uso obligatorio
            de VPN y políticas para el manejo de datos confidenciales de forma remota.
        de:
          name: Remote-Arbeit
          description: Diese Steuerungsmaßnahme stellt sicher, dass Risiken der Remote-Arbeit angemessen adressiert
            werden, einschließlich sicherer Zugriffe, Geräteschutz, Vorgaben zum Umgang mit Informationen und geeigneten
            technischen Schutzmaßnahmen.
        zh:
          name: 远程办公
          description: 这种控制确保了远程办公期间信息安全风险的安全管理。措施包括对企业系统的安全访问、强制使用VPN，以及制定远程处理敏感数据的政策。
        pl:
          name: Praca zdalna
          description: Zabezpieczenie zapewnia bezpieczne zarządzanie ryzykami bezpieczeństwa informacji związanymi
            z pracą zdalną. Obejmuje m.in. bezpieczny dostęp do systemów organizacji, obowiązkowe korzystanie z
            VPN oraz zasady postępowania z danymi wrażliwymi poza siedzibą.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.6.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.6
      ref_id: A.6.8
      name: Information security event reporting
      description: This control ensures employees can promptly report information security events. Measures include
        incident reporting channels, awareness campaigns, and follow-up procedures to investigate and address reported
        events.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.6.8
      translations:
        fr:
          name: Déclaration des événements de sécurité de l'information
          description: Cette mesure de sécurité garantit que les employés peuvent signaler rapidement les événements
            de sécurité de l'information. Les mesures incluent des canaux de signalement d'incidents, des campagnes
            de sensibilisation et des procédures de suivi pour enquêter et traiter les événements signalés.
        cs:
          name: Hlášení událostí informační bezpečnosti
          description: Tato kontrola zajišťuje, že zaměstnanci mohou neprodleně hlásit události v oblasti informační
            bezpečnosti. Mezi tato opatření patří kanály pro hlášení incidentů, osvětové kampaně a následné postupy
            pro vyšetřování a řešení nahlášených událostí.
        sv:
          name: Rapportering av händelser om informationssäkerhet
          description: Denna kontroll säkerställer att anställda snabbt kan rapportera informationssäkerhetshändelser.
            Åtgärderna omfattar kanaler för incidentrapportering, kampanjer för att öka medvetenheten och uppföljningsförfaranden
            för att undersöka och hantera rapporterade händelser.
        es:
          name: Informes de eventos de seguridad de la información
          description: Este control garantiza que los empleados puedan informar rápidamente sobre los eventos de
            seguridad de la información. Las medidas incluyen canales de notificación de incidentes, campañas de
            concienciación y procedimientos de seguimiento para investigar y abordar los eventos denunciados.
        de:
          name: Meldung von Informationssicherheitsereignissen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Mitarbeitende Informationssicherheitsereignisse
            unverzüglich melden können. Dazu gehören klare Meldewege, Sensibilisierung und definierte Prozesse zur
            Erfassung, Bewertung und Weiterleitung von Ereignissen.
        zh:
          name: 信息安全事件报告
          description: 这种控制确保员工能够及时报告信息安全事件。措施包括事件报告渠道、宣传活动以及调查和处理报告事件的后续程序。
        pl:
          name: Zgłaszanie zdarzeń bezpieczeństwa informacji
          description: Zabezpieczenie zapewnia pracownikom możliwość niezwłocznego zgłaszania zdarzeń bezpieczeństwa
            informacji. Obejmuje m.in. kanały zgłaszania incydentów, kampanie uświadamiające oraz procedury wyjaśniania
            i obsługi zgłoszonych zdarzeń.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.3

            Ustawa o KSC: KSC-20 (art. 8 ust. 1 pkt 4); KSC-30 (art. 9 ust. 1 pkt 3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.7
      name: Physical controls
      implementation_groups:
      - SoA
      translations:
        fr:
          name: Mesures de sécurité physique
        cs:
          name: Kontroly v oblasti fyzické bezpečnosti
        sv:
          name: Fysiska kontroller
        es:
          name: Controles físicos
        de:
          name: Physische Maßnahmen
        zh:
          name: 物理控制
        pl:
          name: Zabezpieczenia fizyczne
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.1
      name: Physical security perimeters
      description: This control establishes physical security perimeters to protect critical areas from unauthorized
        access. Measures include barriers, access controls, and monitoring systems to ensure only authorized individuals
        can enter.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.1
      translations:
        fr:
          name: Périmètres de sécurité physique
          description: Cette mesure de sécurité établit des périmètres de sécurité physique pour protéger les zones
            critiques contre les accès non autorisés. Les mesures incluent des barrières, des contrôles d'accès
            et des systèmes de surveillance pour garantir que seules les personnes autorisées peuvent entrer.
        cs:
          name: Fyzické bezpečnostní perimetry
          description: Tato kontrola zavádí fyzické bezpečnostní perimetry, které chrání kritické oblasti před neoprávněným
            přístupem. Mezi opatření patří bariéry, kontroly přístupu a monitorovací systémy, které zajišťují, že
            vstup mohou provádět pouze oprávněné osoby.
        sv:
          name: Fysiska säkerhetsperimetrar
          description: Den här kontrollen upprättar fysiska säkerhetsperimeter för att skydda kritiska områden från
            obehörig åtkomst. Åtgärderna inkluderar barriärer, åtkomstkontroller och övervakningssystem för att
            säkerställa att endast behöriga personer kan komma in.
        es:
          name: Perímetros de seguridad física
          description: Este control establece perímetros de seguridad física para proteger las áreas críticas del
            acceso no autorizado. Las medidas incluyen barreras, controles de acceso y sistemas de monitoreo para
            garantizar que solo las personas autorizadas puedan ingresar.
        de:
          name: Physische Sicherheitsperimeter
          description: Diese Steuerungsmaßnahme stellt sicher, dass physische Sicherheitszonen eingerichtet werden,
            um kritische Bereiche vor unbefugtem Zutritt zu schützen. Dazu gehören bauliche Schutzmaßnahmen, Zutrittskontrollen,
            Überwachungssysteme und organisatorische Vorgaben.
        zh:
          name: 物理安全边界
          description: 这种控制建立了物理安全边界，保护关键区域免受未经授权的访问。措施包括设置障碍物、门禁控制和监控系统，确保只有授权人员才能进入。
        pl:
          name: Fizyczne granice obszaru bezpieczeństwa
          description: Zabezpieczenie ustanawia fizyczne granice obszarów bezpieczeństwa, chroniące krytyczne strefy
            przed nieuprawnionym dostępem. Obejmuje m.in. bariery fizyczne, kontrolę dostępu oraz systemy monitorowania,
            dzięki którym wejść mogą wyłącznie osoby uprawnione.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.3

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.2
      name: Physical entry
      description: This control ensures physical entry points are controlled and monitored to prevent unauthorized
        access. Measures include badge systems, security personnel, and visitor logs.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.2
      translations:
        fr:
          name: Les entrées physiques
          description: Cette mesure de sécurité garantit que les points d'entrée physiques sont contrôlés et surveillés
            pour empêcher les accès non autorisés. Les mesures incluent des systèmes de badges, du personnel de
            sécurité et des registres des visiteurs.
        cs:
          name: Fyzický vstup
          description: Tato kontrola zajišťuje, že fyzické vstupní body jsou kontrolovány a monitorovány, aby se
            zabránilo neoprávněnému přístupu. Mezi tato opatření patří systémy odznaků, bezpečnostní personál a
            záznamy o návštěvnících.
        sv:
          name: Fysisk ingång
          description: Den här kontrollen säkerställer att fysiska startpunkter kontrolleras och övervakas för att
            förhindra obehörig åtkomst. Åtgärderna inkluderar passerkortssystem, säkerhetspersonal och besöksloggar.
        es:
          name: Entrada física
          description: Este control garantiza que los puntos de entrada físicos estén controlados y supervisados
            para evitar el acceso no autorizado. Las medidas incluyen sistemas de credenciales, personal de seguridad
            y registros de visitantes.
        de:
          name: Physischer Zutritt
          description: Diese Steuerungsmaßnahme stellt sicher, dass der Zutritt zu sicherheitsrelevanten Bereichen
            kontrolliert, gesteuert und überwacht wird. Dazu gehören Zugangsausweise, Besuchermanagement, Protokollierung
            und Überwachung des Zutritts.
        zh:
          name: 实体进入
          description: 这种控制确保物理入口点得到控制和监控，防止未经授权的访问。措施包括徽章系统、安保人员和访客记录。
        pl:
          name: Kontrola wejścia fizycznego
          description: Zabezpieczenie zapewnia kontrolę i monitorowanie fizycznych punktów wejścia w celu zapobiegania
            nieuprawnionemu dostępowi. Obejmuje m.in. systemy kart dostępu, personel ochrony oraz rejestry odwiedzających.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.1, 13.3

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c); KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.3
      name: Securing offices, rooms and facilities
      description: This control ensures that offices, rooms, and facilities are secured to protect information and
        resources. Measures include locked doors, restricted areas, and surveillance systems.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.3
      translations:
        fr:
          name: Sécurisation des bureaux, des salles et des installations
          description: Cette mesure de sécurité garantit que les bureaux, les pièces et les installations sont sécurisés
            pour protéger les informations et les ressources. Les mesures incluent des portes verrouillées, des
            zones restreintes et des systèmes de surveillance.
        cs:
          name: Zabezpečení kanceláří, místností a zařízení
          description: Tato kontrola zajišťuje zabezpečení kanceláří, místností a zařízení z důvodu ochrany informací
            a zdrojů. Mezi opatření patří zamykané dveře, omezené prostory a systémy dohledu.
        sv:
          name: Säkra kontor, rum och anläggningar
          description: Den här kontrollen säkerställer att kontor, rum och anläggningar är skyddade för att skydda
            information och resurser. Åtgärderna inkluderar låsta dörrar, begränsade områden och övervakningssystem.
        es:
          name: Asegurar oficinas, salas e instalaciones
          description: Este control garantiza que las oficinas, las salas y las instalaciones estén protegidas para
            proteger la información y los recursos. Las medidas incluyen puertas cerradas, áreas restringidas y
            sistemas de vigilancia.
        de:
          name: Sichern von Büros, Räumen und Einrichtungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Büros, Räume und Einrichtungen vor unbefugtem
            Zugang, Manipulation oder Diebstahl geschützt werden. Dazu gehören Schließsysteme, Zugangsbeschränkungen,
            sichere Aufbewahrung und physische Kontrollen.
        zh:
          name: 确保办公室、房间和设施
          description: 这种控制确保办公室、房间和设施的安全，以保护信息和资源。措施包括上锁门、限制区域和监控系统。
        pl:
          name: Zabezpieczanie biur, pomieszczeń i obiektów
          description: Zabezpieczenie zapewnia fizyczną ochronę biur, pomieszczeń i obiektów, a tym samym znajdujących
            się w nich informacji i zasobów. Obejmuje m.in. zamykane drzwi, strefy o ograniczonym dostępie oraz
            systemy nadzoru wizyjnego.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.2

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.4
      name: Physical security monitoring
      description: This control implements physical security monitoring to detect and respond promptly to threats.
        Measures include CCTV systems, motion detectors, and real-time alerts.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.4
      translations:
        fr:
          name: Surveillance de la sécurité physique
          description: Cette mesure de sécurité met en œuvre une surveillance de la sécurité physique pour détecter
            et répondre rapidement aux menaces. Les mesures incluent des systèmes de vidéosurveillance, des détecteurs
            de mouvement et des alertes en temps réel.
        cs:
          name: Monitorování fyzické bezpečnosti
          description: Tato kontrola implementuje monitorování fyzické bezpečnosti pro detekci a rychlou reakci
            na hrozby. Mezi opatření patří systémy CCTV, detektory pohybu a upozornění v reálném čase.
        sv:
          name: Övervakning av fysisk säkerhet
          description: Den här kontrollen implementerar fysisk säkerhetsövervakning för att identifiera och reagera
            snabbt på hot. Åtgärderna inkluderar CCTV-system, rörelsedetektorer och varningar i realtid.
        es:
          name: Supervisión de la seguridad física
          description: Este control implementa la supervisión de la seguridad física para detectar y responder rápidamente
            a las amenazas. Las medidas incluyen sistemas de CCTV, detectores de movimiento y alertas en tiempo
            real.
        de:
          name: Physische Sicherheitsüberwachung
          description: Diese Steuerungsmaßnahme stellt sicher, dass sicherheitsrelevante Bereiche durch geeignete
            Überwachungseinrichtungen wie Videoüberwachung, Sensorik, Alarmsysteme und Benachrichtigungen überwacht
            werden, um unbefugte Aktivitäten frühzeitig zu erkennen.
        zh:
          name: 物理安全监控
          description: 该控制实施了物理安全监控，以检测并迅速响应威胁。措施包括闭路电视系统、运动探测器和实时警报。
        pl:
          name: Monitorowanie bezpieczeństwa fizycznego
          description: Zabezpieczenie wprowadza monitorowanie bezpieczeństwa fizycznego w celu wykrywania zagrożeń
            i szybkiego reagowania na nie. Obejmuje m.in. systemy CCTV, czujniki ruchu oraz alarmy w czasie rzeczywistym.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.3

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.5
      name: Protecting against physical and environmental threats
      description: This control protects systems and resources from physical and environmental threats. Measures
        include fire suppression systems, temperature controls, and flood prevention barriers.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.5
      translations:
        fr:
          name: Protection contre les menaces physiques et environnementales
          description: Cette mesure de sécurité protège les systèmes et les ressources contre les menaces physiques
            et environnementales. Les mesures incluent des systèmes de suppression d'incendie, des contrôles de
            température et des barrières anti-inondation.
        cs:
          name: Ochrana před fyzickými a environmentálními hrozbami
          description: Tato kontrola chrání systémy a zdroje před fyzickými a environmentálními hrozbami. Mezi opatření
            patří protipožární systémy, regulace teploty a protipovodňové bariéry.
        sv:
          name: Skydd mot fysiska hot och miljöhot
          description: Denna kontroll skyddar system och resurser från fysiska och miljömässiga hot. Åtgärderna
            omfattar brandsläckningssystem, temperaturkontroller och barriärer för att förhindra översvämningar.
        es:
          name: Protección contra amenazas físicas y ambientales
          description: Este control protege los sistemas y recursos de las amenazas físicas y ambientales. Las medidas
            incluyen sistemas de extinción de incendios, controles de temperatura y barreras de prevención de inundaciones.
        de:
          name: Schutz vor physischen und umweltbedingten Bedrohungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Systeme und Einrichtungen gegen physische und
            umweltbedingte Risiken wie Feuer, Wasser, Hitze, Kälte, Vibrationen oder Naturereignisse geschützt werden.
            Dazu gehören Brandschutz, Klimakontrolle, Überspannungsschutz und bauliche Maßnahmen.
        zh:
          name: 防护物理和环境威胁
          description: 这种控制保护系统和资源免受物理和环境威胁。措施包括灭火系统、温度控制和防洪屏障。
        pl:
          name: Ochrona przed zagrożeniami fizycznymi i środowiskowymi
          description: Zabezpieczenie chroni systemy i zasoby przed zagrożeniami fizycznymi i środowiskowymi. Obejmuje
            m.in. systemy gaszenia pożaru, kontrolę temperatury oraz zabezpieczenia przeciwpowodziowe.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.2

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.6
      name: Working In secure areas
      description: This control ensures that secure areas are managed to allow authorized access only. Measures
        include access control systems, visitor escorts, and activity monitoring.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.6
      translations:
        fr:
          name: Travail dans les zones sécurisées
          description: Cette mesure de sécurité garantit que les zones sécurisées sont gérées pour permettre l'accès
            uniquement aux personnes autorisées. Les mesures incluent des systèmes de contrôle d'accès, des escortes
            pour visiteurs et la surveillance des activités.
        cs:
          name: Práce v zabezpečených prostorách
          description: Tato kontrola zajišťuje, že zabezpečené oblasti jsou spravovány tak, aby umožňovaly přístup
            pouze oprávněným osobám. Mezi opatření patří systémy kontroly přístupu, doprovod návštěvníků a monitorování
            aktivit.
        sv:
          name: Arbeta i säkra områden
          description: Den här kontrollen säkerställer att säkra områden hanteras för att endast tillåta auktoriserad
            åtkomst. Åtgärderna omfattar bland annat system för åtkomstkontroll, eskorter av besökare och aktivitetsövervakning.
        es:
          name: Trabajar en áreas seguras
          description: Este control garantiza que las áreas seguras se administren para permitir solo el acceso
            autorizado. Las medidas incluyen sistemas de control de acceso, escolta de visitantes y monitoreo de
            actividad.
        de:
          name: Arbeiten in Sicherheitsbereichen
          description: Diese Steuerungsmaßnahme legt Anforderungen und Verhaltensregeln für Tätigkeiten in Sicherheitsbereichen
            fest. Dazu gehören kontrollierte Zugänge, Überwachung, Begleitung von Besuchern und organisatorische
            Vorgaben für Abläufe und Verhalten.
        zh:
          name: 在安全区域工作
          description: 这种控制确保安全区域只允许授权访问。措施包括门禁系统、访客护送和活动监测。
        pl:
          name: Praca w obszarach bezpiecznych
          description: Zabezpieczenie zapewnia takie zarządzanie obszarami bezpiecznymi, aby dostęp do nich miały
            wyłącznie osoby uprawnione. Obejmuje m.in. systemy kontroli dostępu, eskortowanie odwiedzających oraz
            monitorowanie aktywności.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.3 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.7
      name: Clear desk and clear screen
      description: This control ensures sensitive information is not left exposed by adopting clear desk and clear
        screen policies. Measures include locking sensitive documents away and auto-locking screens when not in
        use.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.7
      translations:
        fr:
          name: Bureau propre et écran vide
          description: Cette mesure de sécurité garantit que les informations sensibles ne sont pas laissées exposées
            en adoptant des politiques de bureau propre et d'écran clair. Les mesures incluent le verrouillage des
            documents sensibles et le verrouillage automatique des écrans en cas d'inutilisation.
        cs:
          name: Prázdnýý stůl a čistá obrazovka
          description: Tato kontrola zajišťuje, že citlivé informace nebudou ponechány napospas veřejnosti, a to
            přijetím zásad pro volný stůl a volnou obrazovku. Mezi opatření patří uzamčení citlivých dokumentů a
            automatické zamykání obrazovek, když se nepoužívají.
        sv:
          name: Tydligt skrivbord och tydlig skärm
          description: Den här kontrollen säkerställer att känslig information inte lämnas exponerad genom att anta
            principer för tydligt skrivbord och genomskinlig skärm. Åtgärderna inkluderar att låsa känsliga dokument
            och automatiskt låsa skärmar när de inte används.
        es:
          name: Escritorio claro y pantalla clara
          description: Este control garantiza que la información confidencial no quede expuesta mediante la adopción
            de políticas de escritorio y pantalla claras. Las medidas incluyen el bloqueo de documentos confidenciales
            y el bloqueo automático de pantallas cuando no están en uso.
        de:
          name: Aufgeräumte Arbeitsumgebung und Bildschirmsperren
          description: Diese Steuerungsmaßnahme stellt sicher, dass sensible Informationen nicht offen einsehbar
            sind. Dazu gehören Clean-Desk-Regeln, sichere Aufbewahrung von Dokumenten, Abschließen von Arbeitsplätzen
            und automatische Bildschirmsperren.
        zh:
          name: 桌面和屏幕都清晰
          description: 通过采用清晰桌面和清晰屏幕政策，这种控制确保敏感信息不会被遗漏。措施包括将敏感文件锁好，并在未使用时自动锁定屏幕。
        pl:
          name: Czyste biurko i czysty ekran
          description: Zabezpieczenie zapobiega pozostawianiu informacji wrażliwych bez ochrony dzięki stosowaniu
            zasad czystego biurka i czystego ekranu. Obejmuje m.in. zamykanie dokumentów wrażliwych w zabezpieczonych
            miejscach oraz automatyczne blokowanie nieużywanych ekranów.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.3

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.8
      name: Equipment siting and protection
      description: This control ensures that equipment is positioned and protected to prevent unauthorized access
        or damage. Measures include secure mounting, locked cabinets, and restricted access areas.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.8
      translations:
        fr:
          name: Emplacement et protection du matériel
          description: Cette mesure de sécurité garantit que les équipements sont positionnés et protégés pour prévenir
            les accès non autorisés ou les dommages. Les mesures incluent des montages sécurisés, des armoires verrouillées
            et des zones d'accès restreintes.
        cs:
          name: Umístění a ochrana zařízení
          description: Tato kontrola zajišťuje, že zařízení je umístěno a chráněno tak, aby se zabránilo neoprávněnému
            přístupu nebo poškození. Mezi opatření patří bezpečná montáž, uzamčené skříně a oblasti s omezeným přístupem.
        sv:
          name: Placering och skydd av utrustning
          description: Denna kontroll säkerställer att utrustningen är placerad och skyddad för att förhindra obehörig
            åtkomst eller skada. Åtgärderna inkluderar säker montering, låsta skåp och områden med begränsad åtkomst.
        es:
          name: Ubicación y protección de equipos
          description: Este control garantiza que el equipo esté posicionado y protegido para evitar el acceso no
            autorizado o el daño. Las medidas incluyen montaje seguro, gabinetes cerrados con llave y áreas de acceso
            restringido.
        de:
          name: Platzierung und Schutz von Geräten und Betriebsmitteln
          description: Diese Steuerungsmaßnahme stellt sicher, dass Geräte so positioniert, installiert und geschützt
            werden, dass Risiken wie unbefugter Zugriff, Manipulation oder Beschädigung minimiert werden. Dazu gehören
            sichere Standorte, Schränke, Gehäuse und Zutrittskontrollen.
        zh:
          name: 设备选址与防护
          description: 这种控制确保设备被安置和保护，以防止未经授权的访问或损坏。措施包括安全安装、上锁柜子和限制进入区域。
        pl:
          name: Rozmieszczenie i ochrona sprzętu
          description: Zabezpieczenie zapewnia takie rozmieszczenie i ochronę sprzętu, aby zapobiec nieuprawnionemu
            dostępowi lub uszkodzeniom. Obejmuje m.in. bezpieczny montaż, zamykane szafy oraz strefy o ograniczonym
            dostępie.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.2 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.9
      name: Security of assets off-premises
      description: This control ensures assets used or stored off-premises are secured to maintain confidentiality
        and integrity. Measures include encryption, secure transport, and access tracking.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.9
      translations:
        fr:
          name: Sécurité des actifs hors des locaux
          description: Cette mesure de sécurité garantit que les actifs utilisés ou stockés hors des locaux sont
            sécurisés pour maintenir leur confidentialité et leur intégrité. Les mesures incluent le chiffrement,
            le transport sécurisé et le suivi des accès.
        cs:
          name: Bezpečnost aktiv mimo prostory organizace
          description: Tato kontrola zajišťuje zabezpečení aktiv používaných nebo uložených mimo prostory, aby byla
            zachována důvěrnost a integrita. Mezi opatření patří šifrování, bezpečný přenos a sledování přístupu.
        sv:
          name: Säkerhet för tillgångar utanför de lokala byggnaderna
          description: Den här kontrollen säkerställer att tillgångar som används eller lagras utanför lokalerna
            skyddas för att upprätthålla konfidentialitet och integritet. Åtgärderna omfattar kryptering, säker
            transport och åtkomstspårning.
        es:
          name: Seguridad de los activos fuera de las instalaciones
          description: Este control garantiza que los activos utilizados o almacenados fuera de las instalaciones
            estén protegidos para mantener la confidencialidad y la integridad. Las medidas incluyen cifrado, transporte
            seguro y seguimiento de acceso.
        de:
          name: Sicherheit von Werten außerhalb der Räumlichkeiten
          description: Diese Steuerungsmaßnahme stellt sicher, dass Geräte, Datenträger und andere Werte auch außerhalb
            organisatorischer Standorte wirksam geschützt werden. Dazu gehören Verschlüsselung, sichere Transportwege,
            physischer Schutz und Kontrolle über die Nutzung.
        zh:
          name: 资产在场外的安全
          description: 这种控制确保使用或存放在场外的资产得到保护，以维护机密性和完整性。措施包括加密、安全传输和访问追踪。
        pl:
          name: Bezpieczeństwo aktywów poza siedzibą
          description: Zabezpieczenie zapewnia ochronę aktywów używanych lub przechowywanych poza siedzibą organizacji
            w celu zachowania ich poufności i integralności. Obejmuje m.in. szyfrowanie, bezpieczny transport oraz
            ewidencjonowanie dostępu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.2 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.10
      name: Storage media
      description: This control safeguards storage media to prevent unauthorized access or tampering. Measures include
        secure storage, encryption, and access restrictions.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.10
      translations:
        fr:
          name: Supports de stockage
          description: Cette mesure de sécurité protège les supports de stockage pour empêcher tout accès ou altération
            non autorisé. Les mesures incluent le stockage sécurisé, le chiffrement et les restrictions d'accès.
        cs:
          name: Paměťová média
          description: Tato kontrola chrání úložná média, aby se zabránilo neoprávněnému přístupu nebo manipulaci.
            Mezi opatření patří bezpečné úložiště, šifrování a omezení přístupu.
        sv:
          name: Lagringsmedier
          description: Den här kontrollen skyddar lagringsmedia för att förhindra obehörig åtkomst eller manipulering.
            Åtgärderna omfattar säker lagring, kryptering och åtkomstbegränsningar.
        es:
          name: Medios de almacenamiento
          description: Este control protege los medios de almacenamiento para evitar el acceso no autorizado o la
            manipulación. Las medidas incluyen almacenamiento seguro, cifrado y restricciones de acceso.
        de:
          name: Speichermedien
          description: Diese Steuerungsmaßnahme stellt sicher, dass Speichermedien während ihres gesamten Lebenszyklus
            geschützt sind – bei Speicherung, Transport, Nutzung und Entsorgung. Dazu gehören sichere Lagerung,
            Verschlüsselung, Zugriffskontrollen und dokumentierte Löschverfahren.
        zh:
          name: 存储介质
          description: 这种控制保护存储介质，防止未经授权的访问或篡改。措施包括安全存储、加密和访问限制。
        pl:
          name: Nośniki danych
          description: Zabezpieczenie chroni nośniki danych przed nieuprawnionym dostępem lub ingerencją. Obejmuje
            m.in. bezpieczne przechowywanie, szyfrowanie oraz ograniczenia dostępu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.2, 12.3

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.11
      name: Supporting utilities
      description: This control ensures that supporting utilities, such as power and cooling systems, are reliable
        and protected from disruptions. Measures include redundant systems and physical security.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.11
      translations:
        fr:
          name: Services supports
          description: Cette mesure de sécurité garantit que les utilitaires de soutien, tels que les systèmes d'alimentation
            et de refroidissement, sont fiables et protégés contre les perturbations. Les mesures incluent des systèmes
            redondants et une sécurité physique.
        cs:
          name: Podpůrné služby
          description: Tato kontrola zajišťuje, že podpůrné systémy, jako jsou napájecí a chladicí systémy, jsou
            spolehlivé a chráněné před přerušením. Mezi opatření patří redundantní systémy a fyzické zabezpečení.
        sv:
          name: Stöd för allmännyttiga företag
          description: Den här kontrollen säkerställer att stödverktyg, till exempel kraft- och kylsystem, är tillförlitliga
            och skyddade mot avbrott. Åtgärderna omfattar bland annat redundanta system och fysisk säkerhet.
        es:
          name: Apoyo a los servicios públicos
          description: Este control garantiza que los servicios públicos de apoyo, como los sistemas de energía
            y refrigeración, sean fiables y estén protegidos contra interrupciones. Las medidas incluyen sistemas
            redundantes y seguridad física.
        de:
          name: Versorgungseinrichtungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass essenzielle Versorgungseinrichtungen wie Strom,
            Klima, Wasser, Netzwerk oder Druckluft zuverlässig betrieben und vor Ausfällen geschützt werden. Redundanzen
            und Überwachungssysteme unterstützen die Betriebssicherheit.
        zh:
          name: 支持公用事业
          description: 这种控制确保了支持的公用事业，如电力和冷却系统，可靠且不受干扰。措施包括冗余系统和物理安全。
        pl:
          name: Systemy wspomagające
          description: Zabezpieczenie zapewnia niezawodność systemów wspomagających, takich jak zasilanie i chłodzenie,
            oraz ich ochronę przed zakłóceniami. Obejmuje m.in. systemy redundantne oraz zabezpieczenia fizyczne.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.1

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.12
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.12
      name: Cabling security
      description: This control ensures that cables are secured to prevent unauthorized interception or damage.
        Measures include protective conduits, proper labeling, and secure routing.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.12
      translations:
        fr:
          name: Sécurité du câblage
          description: Cette mesure de sécurité garantit que les câbles sont sécurisés pour prévenir toute interception
            ou tout dommage non autorisé. Les mesures incluent des conduits de protection, un étiquetage approprié
            et un routage sécurisé.
        cs:
          name: Bezpečnost kabelových rozvodů
          description: Tato kontrola zajišťuje, že kabely jsou zabezpečeny, aby se zabránilo neoprávněnému zachycení
            nebo poškození. Mezi opatření patří ochranné trubky, správné označení a bezpečné vedení.
        sv:
          name: Säkerhet för kabeldragning
          description: Denna kontroll säkerställer att kablarna är säkrade för att förhindra obehörig avlyssning
            eller skada. Åtgärderna inkluderar skyddsledningar, korrekt märkning och säker dragning.
        es:
          name: Seguridad del cableado
          description: Este control garantiza que los cables estén asegurados para evitar intercepciones o daños
            no autorizados. Las medidas incluyen conductos de protección, etiquetado adecuado y enrutamiento seguro.
        de:
          name: Sicherheit der Verkabelung
          description: Diese Steuerungsmaßnahme stellt sicher, dass Kommunikations- und Stromkabel gegen Abhören,
            Manipulation, Beschädigung und Störungen geschützt werden. Dazu gehören Kabelschutzrohre, sichere Verlegung,
            Kennzeichnung und Zugangskontrollen.
        zh:
          name: 布线安全
          description: 这种控制确保电缆得到安全保护，防止未经授权的拦截或损坏。措施包括保护管道、正确标识和安全布线。
        pl:
          name: Bezpieczeństwo okablowania
          description: Zabezpieczenie zapewnia ochronę okablowania przed nieuprawnionym przechwyceniem transmisji
            lub uszkodzeniem. Obejmuje m.in. kanały ochronne, właściwe oznakowanie oraz bezpieczne prowadzenie tras
            kablowych.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 13.1 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-07 (art. 8 ust. 1 pkt 2 lit. c)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.13
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.13
      name: Equipment maintenance
      description: This control ensures that equipment is maintained to guarantee proper functioning and prevent
        failures. Measures include regular servicing, secure maintenance practices, and authorized personnel access.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.13
      translations:
        fr:
          name: Maintenance du matériel
          description: Cette mesure de sécurité garantit que les équipements sont maintenus pour assurer leur bon
            fonctionnement et prévenir les pannes. Les mesures incluent un entretien régulier, des pratiques de
            maintenance sécurisées et un accès réservé au personnel autorisé.
        cs:
          name: Údržba zařízení
          description: Tato kontrola zajišťuje, že zařízení je udržováno tak, aby byla zaručena jeho správná funkce
            a předcházeny poruchám. Mezi tato opatření patří pravidelný servis, bezpečné postupy údržby a přístup
            oprávněného personálu.
        sv:
          name: Underhåll av utrustning
          description: Denna kontroll säkerställer att utrustningen underhålls för att garantera korrekt funktion
            och förhindra fel. Åtgärderna inkluderar regelbunden service, säkra underhållsrutiner och behörig personalåtkomst.
        es:
          name: Mantenimiento de equipos
          description: Este control asegura el mantenimiento de los equipos para garantizar su correcto funcionamiento
            y evitar fallos. Las medidas incluyen servicio regular, prácticas de mantenimiento seguras y acceso
            de personal autorizado.
        de:
          name: Instandhaltung von Geräten und Betriebsmitteln
          description: Diese Steuerungsmaßnahme stellt sicher, dass Geräte regelmäßig, fachgerecht und sicher gewartet
            werden, um Ausfälle und Sicherheitsrisiken zu vermeiden. Wartungsarbeiten dürfen nur von autorisiertem
            und qualifiziertem Personal durchgeführt werden.
        zh:
          name: 设备维护
          description: 这种控制确保设备得到维护，确保正常运行并防止故障发生。措施包括定期保养、安全维护实践以及授权人员通行。
        pl:
          name: Konserwacja sprzętu
          description: Zabezpieczenie zapewnia konserwację sprzętu, gwarantującą jego prawidłowe działanie i zapobiegającą
            awariom. Obejmuje m.in. regularny serwis, bezpieczne praktyki konserwacyjne oraz dopuszczanie do sprzętu
            wyłącznie upoważnionego personelu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.4

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.7.14
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.7
      ref_id: A.7.14
      name: Secure disposal or re-use of equipment
      description: This control ensures the secure disposal or reuse of equipment to protect sensitive information.
        Measures include data sanitization, physical destruction, and certified disposal processes.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.7.14
      translations:
        fr:
          name: Élimination ou recyclage sécurisé(e) du matériel
          description: Cette mesure de sécurité garantit l'élimination ou la réutilisation sécurisée des équipements
            pour protéger les informations sensibles. Les mesures incluent la désinfection des données, la destruction
            physique et les processus de mise au rebut certifiés.
        cs:
          name: Bezpečná likvidace nebo opětovné použití zařízení
          description: Tato kontrola zajišťuje bezpečnou likvidaci nebo opětovné použití zařízení k ochraně citlivých
            informací. Mezi opatření patří sanitace dat, fyzické zničení a certifikované procesy likvidace.
        sv:
          name: Säker kassering eller återanvändning av utrustning
          description: Denna kontroll säkerställer säker kassering eller återanvändning av utrustning för att skydda
            känslig information. Åtgärderna inkluderar datasanering, fysisk förstörelse och certifierade bortskaffningsprocesser.
        es:
          name: Eliminación o reutilización segura de equipos
          description: Este control garantiza la eliminación segura o la reutilización de equipos para proteger
            la información confidencial. Las medidas incluyen la desinfección de datos, la destrucción física y
            los procesos de eliminación certificados.
        de:
          name: Sichere Entsorgung oder Wiederverwendung von Geräten
          description: Diese Steuerungsmaßnahme stellt sicher, dass Geräte vor Entsorgung oder Weiterverwendung
            so bereinigt werden, dass keine sensiblen Informationen wiederhergestellt werden können. Dazu gehören
            zertifizierte Löschverfahren, physische Vernichtung und dokumentierte Prozesse.
        zh:
          name: 安全处置或再利用设备
          description: 这种控制确保设备安全处置或再利用，以保护敏感信息。措施包括数据净化、物理销毁和认证处理流程。
        pl:
          name: Bezpieczne zbywanie lub ponowne użycie sprzętu
          description: Zabezpieczenie zapewnia bezpieczne zbywanie lub ponowne użycie sprzętu w celu ochrony informacji
            wrażliwych. Obejmuje m.in. trwałe usuwanie danych, fizyczne niszczenie nośników oraz certyfikowane procesy
            utylizacji.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.2 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:annex-a
      ref_id: A.8
      name: Technological controls
      implementation_groups:
      - SoA
      translations:
        fr:
          name: Mesures de sécurité technologiques
        cs:
          name: Technologické kontroly
        sv:
          name: Tekniska kontroller
        es:
          name: Controles tecnológicos
        de:
          name: Technologische Maßnahmen
        zh:
          name: 技术控制
        pl:
          name: Zabezpieczenia technologiczne
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.1
      name: User end point devices
      description: This control ensures the protection of endpoint devices such as laptops, desktops, and mobile
        devices by implementing security measures like endpoint detection, encryption, and secure configurations
        to minimize risks.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.1
      translations:
        fr:
          name: Terminaux finaux des utilisateurs
          description: Cette mesure de sécurité garantit la protection des dispositifs de point de terminaison tels
            que les ordinateurs portables, de bureau et les appareils mobiles en mettant en œuvre des mesures comme
            la détection des terminaux, le chiffrement et des configurations sécurisées pour minimiser les risques.
        cs:
          name: Koncová zařízení uživatele
          description: Tato kontrola zajišťuje ochranu koncových zařízení, jako jsou notebooky, stolní počítače
            a mobilní zařízení, implementací bezpečnostních opatření, jako je detekce koncových bodů, šifrování
            a zabezpečené konfigurace, aby se minimalizovala rizika.
        sv:
          name: Användarens slutpunktsenheter
          description: Den här kontrollen säkerställer skydd av slutpunktsenheter som bärbara datorer, stationära
            datorer och mobila enheter genom att implementera säkerhetsåtgärder som slutpunktsidentifiering, kryptering
            och säkra konfigurationer för att minimera risker.
        es:
          name: Dispositivos de punto final de usuario
          description: Este control garantiza la protección de los dispositivos de punto final, como equipos portátiles,
            equipos de escritorio y dispositivos móviles, mediante la implementación de medidas de seguridad como
            la detección de puntos de conexión, el cifrado y las configuraciones seguras para minimizar los riesgos.
        de:
          name: Endpunktgeräte des Benutzers
          description: Diese Steuerungsmaßnahme stellt sicher, dass Endgeräte wie Laptops, Desktops oder Mobilgeräte
            durch technische und organisatorische Maßnahmen geschützt werden. Dazu gehören sichere Konfigurationen,
            Verschlüsselung, Malware-Schutz, Patch-Management und Zugriffskontrollen.
        zh:
          name: 用户终端设备
          description: 这种控制通过实施终端检测、加密和安全配置等安全措施，确保对笔记本电脑、台式机和移动设备等终端设备的保护，以最大限度地降低风险。
        pl:
          name: Urządzenia końcowe użytkowników
          description: Zabezpieczenie zapewnia ochronę urządzeń końcowych, takich jak laptopy, komputery stacjonarne
            i urządzenia mobilne, poprzez wdrożenie środków bezpieczeństwa, m.in. wykrywania zagrożeń na urządzeniach
            końcowych (EDR), szyfrowania i bezpiecznej konfiguracji, w celu ograniczenia ryzyk.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 8.1 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-14 (art. 8 ust. 1 pkt 2 lit. j)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.2
      name: Privileged access rights
      description: This control ensures that privileged access rights are granted, managed, and monitored carefully
        to prevent misuse and enhance security. Measures include role-based access controls, periodic reviews, and
        strict account management.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.2
      translations:
        fr:
          name: Droits d'accès privilégiés
          description: Cette mesure de sécurité garantit que les droits d'accès privilégiés sont accordés, gérés
            et surveillés avec soin pour prévenir les abus et renforcer la sécurité. Les mesures comprennent des
            contrôles d'accès basés sur les rôles, des revues périodiques et une gestion stricte des comptes.
        cs:
          name: Privilegovaná přístupová práva
          description: Tato kontrola zajišťuje, že privilegovaná přístupová práva jsou pečlivě udělována, spravována
            a monitorována, aby se zabránilo zneužití a zvýšila se bezpečnost. Mezi opatření patří řízení přístupu
            na základě rolí, pravidelné kontroly a přísná správa účtů.
        sv:
          name: Privilegierade åtkomsträttigheter
          description: Den här kontrollen säkerställer att privilegierade åtkomsträttigheter beviljas, hanteras
            och övervakas noggrant för att förhindra missbruk och förbättra säkerheten. Åtgärderna omfattar rollbaserade
            åtkomstkontroller, periodiska granskningar och strikt kontohantering.
        es:
          name: Derechos de acceso privilegiados
          description: Este control garantiza que los derechos de acceso privilegiado se concedan, administren y
            supervisen cuidadosamente para evitar el uso indebido y mejorar la seguridad. Las medidas incluyen controles
            de acceso basados en roles, revisiones periódicas y una estricta gestión de cuentas.
        de:
          name: Privilegierte Zugangsrechte
          description: Diese Steuerungsmaßnahme stellt sicher, dass privilegierte Zugänge nur autorisierten Personen
            gewährt werden und deren Nutzung überwacht, dokumentiert und regelmäßig überprüft wird. Dies umfasst
            starke Authentisierung, Protokollierung und strenge Verwaltung privilegierter Konten.
        zh:
          name: 特权访问权
          description: 这种控制确保特权访问权得到授权、管理和严格监控，以防止滥用并增强安全性。措施包括基于角色的访问控制、定期审查和严格的账户管理。
        pl:
          name: Uprzywilejowane prawa dostępu
          description: Zabezpieczenie zapewnia staranne nadawanie, zarządzanie i monitorowanie uprzywilejowanych
            praw dostępu w celu zapobiegania nadużyciom i wzmocnienia bezpieczeństwa. Obejmuje m.in. kontrolę dostępu
            opartą na rolach, okresowe przeglądy oraz rygorystyczne zarządzanie kontami.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.3, 11.4

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.3
      name: Information access restriction
      description: This control restricts access to sensitive information based on need-to-know principles. Measures
        include user authentication, role-based permissions, and regular access reviews.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.3
      translations:
        fr:
          name: Restriction d'accès aux informations
          description: Cette mesure de sécurité limite l'accès aux informations sensibles selon le principe du besoin
            d'en connaître. Les mesures incluent l'authentification des utilisateurs, les permissions basées sur
            les rôles et des revues régulières des accès.
        cs:
          name: Omezení přístupu k informacím
          description: Tato kontrola omezuje přístup k citlivým informacím na základě principu „vědět jen to, co
            potřebujete“. Mezi opatření patří ověřování uživatelů, oprávnění založená na rolích a pravidelné kontroly
            přístupu.
        sv:
          name: Begränsning av åtkomst till information
          description: Den här kontrollen begränsar åtkomsten till känslig information baserat på principer som
            du behöver veta. Åtgärderna omfattar användarautentisering, rollbaserade behörigheter och regelbundna
            åtkomstgranskningar.
        es:
          name: Restricción de acceso a la información
          description: Este control restringe el acceso a la información confidencial en función de los principios
            de necesidad de conocer. Las medidas incluyen la autenticación de usuarios, los permisos basados en
            roles y las revisiones periódicas del acceso.
        de:
          name: Informationszugangsbeschränkung
          description: Diese Steuerungsmaßnahme stellt sicher, dass der Zugriff auf Informationen nach dem Need-to-know-Prinzip
            beschränkt wird, um unbefugten Zugriff zu verhindern. Dazu gehören Zugriffskontrollen, Rollenrechte,
            Authentisierung und regelmäßige Überprüfungen.
        zh:
          name: 信息访问限制
          description: 这种控制基于知情需求原则限制了对敏感信息的访问。措施包括用户认证、基于角色的权限以及定期的访问审查。
        pl:
          name: Ograniczenie dostępu do informacji
          description: Zabezpieczenie ogranicza dostęp do informacji wrażliwych zgodnie z zasadą wiedzy koniecznej
            (need-to-know). Obejmuje m.in. uwierzytelnianie użytkowników, uprawnienia oparte na rolach oraz regularne
            przeglądy dostępu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.1

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.4
      name: Access to source code
      description: This control secures access to source code by preventing unauthorized viewing, modification,
        or exposure. Measures include version control, secure repositories, and restricted developer access.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.4
      translations:
        fr:
          name: Accès aux codes source
          description: Cette mesure de sécurité sécurise l'accès au code source en empêchant la visualisation, la
            modification ou l'exposition non autorisées. Les mesures incluent le contrôle de version, les dépôts
            sécurisés et l'accès restreint aux développeurs.
        cs:
          name: Přístup ke zdrojovému kódu
          description: Tato kontrola zajišťuje přístup ke zdrojovému kódu tím, že brání neoprávněnému prohlížení,
            úpravám nebo odhalení. Mezi opatření patří správa verzí, zabezpečené repozitáře a omezený přístup vývojářů.
        sv:
          name: Tillgång till källkod
          description: Den här kontrollen skyddar åtkomsten till källkoden genom att förhindra obehörig visning,
            ändring eller exponering. Åtgärderna omfattar versionskontroll, säkra lagringsplatser och begränsad
            åtkomst för utvecklare.
        es:
          name: Acceso al código fuente
          description: Este control protege el acceso al código fuente al evitar la visualización, modificación
            o exposición no autorizadas. Las medidas incluyen control de versiones, repositorios seguros y acceso
            restringido para desarrolladores.
        de:
          name: Zugriff auf den Quellcode
          description: Diese Steuerungsmaßnahme stellt sicher, dass Zugriff auf Quellcode kontrolliert, überwacht
            und geschützt erfolgt, um Manipulation, Offenlegung oder unbefugte Änderung zu verhindern. Dazu gehören
            Rechtemanagement, Versionskontrolle, Code-Reviews und abgesicherte Repositorys.
        zh:
          name: 源代码访问
          description: 这种控制通过防止未经授权的查看、修改或曝光，保障了对源代码的访问。措施包括版本控制、安全仓库和限制开发者访问。
        pl:
          name: Dostęp do kodu źródłowego
          description: Zabezpieczenie chroni dostęp do kodu źródłowego, zapobiegając jego nieuprawnionemu przeglądaniu,
            modyfikacji lub ujawnieniu. Obejmuje m.in. kontrolę wersji, bezpieczne repozytoria oraz ograniczony
            dostęp dla programistów.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.2 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.5
      name: Secure authentication
      description: This control implements strong authentication mechanisms, such as multi-factor authentication,
        to verify user identities and prevent unauthorized access.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.5
      translations:
        fr:
          name: Authentification sécurisée
          description: Cette mesure de sécurité met en œuvre des mécanismes d'authentification solides, tels que
            l'authentification multifacteur, pour vérifier l'identité des utilisateurs et empêcher les accès non
            autorisés.
        cs:
          name: Bezpečná autentizace
          description: Tato kontrola implementuje silné mechanismy ověřování, jako je vícefaktorové ověřování, k
            ověření identity uživatelů a zabránění neoprávněnému přístupu.
        sv:
          name: Säker autentisering
          description: Den här kontrollen implementerar starka autentiseringsmekanismer, till exempel multifaktorautentisering,
            för att verifiera användaridentiteter och förhindra obehörig åtkomst.
        es:
          name: Autenticación segura
          description: Este control implementa mecanismos de autenticación seguros, como la autenticación multifactor,
            para verificar las identidades de los usuarios y evitar el acceso no autorizado.
        de:
          name: Sichere Authentisierung
          description: Diese Steuerungsmaßnahme stellt sicher, dass starke Authentisierungsmechanismen eingesetzt
            werden – wie Multi-Faktor-Authentisierung, sichere Passwortrichtlinien, Token oder biometrische Verfahren
            – um unbefugten Zugriff zu verhindern.
        zh:
          name: 安全认证
          description: 该控制实现强认证机制，如多因素认证，以验证用户身份并防止未经授权的访问。
        pl:
          name: Bezpieczne uwierzytelnianie
          description: Zabezpieczenie wdraża silne mechanizmy uwierzytelniania, takie jak uwierzytelnianie wieloskładnikowe
            (MFA), w celu weryfikacji tożsamości użytkowników i zapobiegania nieuprawnionemu dostępowi.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.7

            Ustawa o KSC: KSC-16 (art. 8 ust. 1 pkt 2 lit. l)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.6
      name: Capacity management
      description: This control ensures system capacity is managed to provide adequate performance and prevent disruptions.
        Measures include monitoring resource usage and planning for future needs.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.6
      translations:
        fr:
          name: Dimensionnement
          description: Cette mesure de sécurité garantit que la capacité des systèmes est gérée pour assurer des
            performances adéquates et éviter les perturbations. Les mesures incluent la surveillance de l'utilisation
            des ressources et la planification des besoins futurs.
        cs:
          name: Řízení kapacity
          description: Tato kontrola zajišťuje, že kapacita systému je spravována tak, aby poskytovala odpovídající
            výkon a předcházela narušení. Mezi opatření patří monitorování využití zdrojů a plánování budoucích
            potřeb.
        sv:
          name: Hantering av kapacitet
          description: Denna kontroll säkerställer att systemkapaciteten hanteras för att ge tillräcklig prestanda
            och förhindra störningar. Åtgärderna omfattar bland annat övervakning av resursanvändning och planering
            för framtida behov.
        es:
          name: Gestión de la capacidad
          description: Este control garantiza que la capacidad del sistema se gestione para proporcionar un rendimiento
            adecuado y evitar interrupciones. Las medidas incluyen el seguimiento del uso de los recursos y la planificación
            de las necesidades futuras.
        de:
          name: Kapazitätssteuerung
          description: Diese Steuerungsmaßnahme stellt sicher, dass Systemkapazitäten kontinuierlich überwacht,
            geplant und gesteuert werden, um Leistungseinbußen, Engpässe oder Ausfälle zu vermeiden. Dazu gehören
            Kapazitätsplanung, Monitoring und Prognosen.
        zh:
          name: 容量管理
          description: 这种控制确保系统容量得到管理，以提供足够的性能并防止中断。措施包括监控资源使用和规划未来需求。
        pl:
          name: Zarządzanie pojemnością
          description: Zabezpieczenie zapewnia zarządzanie pojemnością systemów w celu utrzymania odpowiedniej wydajności
            i zapobiegania zakłóceniom. Obejmuje m.in. monitorowanie wykorzystania zasobów oraz planowanie przyszłych
            potrzeb.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.7
      name: Protection against malware
      description: This control deploys measures like antivirus software, threat detection tools, and regular updates
        to protect systems from malware and malicious attacks.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.7
      translations:
        fr:
          name: Protection contre les programmes malveillants (malware)
          description: Cette mesure de sécurité déploie des mesures comme des logiciels antivirus, des outils de
            détection des menaces et des mises à jour régulières pour protéger les systèmes contre les logiciels
            malveillants et les attaques.
        cs:
          name: Ochrana před malwarem
          description: Tato kontrola využívá opatření, jako je antivirový software, nástroje pro detekci hrozeb
            a pravidelné aktualizace, k ochraně systémů před malwarem a škodlivými útoky.
        sv:
          name: Skydd mot skadlig kod
          description: Den här kontrollen distribuerar åtgärder som antivirusprogram, verktyg för hotidentifiering
            och regelbundna uppdateringar för att skydda system från skadlig kod och skadliga attacker.
        es:
          name: Protección contra malware
          description: Este control implementa medidas como software antivirus, herramientas de detección de amenazas
            y actualizaciones periódicas para proteger los sistemas contra malware y ataques maliciosos.
        de:
          name: Schutz gegen Schadsoftware
          description: Diese Steuerungsmaßnahme stellt sicher, dass Systeme durch geeignete technische und organisatorische
            Maßnahmen vor Malware, Schadsoftware und Angriffen geschützt werden. Dazu gehören Antivirensoftware,
            EDR/XDR, regelmäßige Updates und Sensibilisierung.
        zh:
          name: 防范恶意软件
          description: 该控制部署了杀毒软件、威胁检测工具和定期更新等措施，以保护系统免受恶意软件和恶意攻击。
        pl:
          name: Ochrona przed złośliwym oprogramowaniem
          description: Zabezpieczenie wprowadza środki takie jak oprogramowanie antywirusowe, narzędzia do wykrywania
            zagrożeń i regularne aktualizacje, chroniące systemy przed złośliwym oprogramowaniem i atakami.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.9, 8.1

            Ustawa o KSC: KSC-14 (art. 8 ust. 1 pkt 2 lit. j); KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.8
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.8
      name: Management of technical vulnerabilities
      description: This control identifies, evaluates, and remediates technical vulnerabilities promptly to minimize
        security risks. Measures include vulnerability scanning and patch management.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.8
      translations:
        fr:
          name: Gestion des vulnérabilités techniques
          description: Cette mesure de sécurité identifie, évalue et remédie rapidement aux vulnérabilités techniques
            pour minimiser les risques de sécurité. Les mesures incluent les analyses de vulnérabilités et la gestion
            des correctifs.
        cs:
          name: Řízení technických zranitelností
          description: Tato kontrola identifikuje, vyhodnocuje a neprodleně odstraňuje technické zranitelnosti,
            aby se minimalizovala bezpečnostní rizika. Mezi opatření patří skenování zranitelností a správa oprav.
        sv:
          name: Hantering av tekniska sårbarheter
          description: Den här kontrollen identifierar, utvärderar och åtgärdar tekniska sårbarheter snabbt för
            att minimera säkerhetsriskerna. Åtgärderna inkluderar sårbarhetsskanning och patchhantering.
        es:
          name: Gestión de vulnerabilidades técnicas
          description: Este control identifica, evalúa y corrige las vulnerabilidades técnicas con prontitud para
            minimizar los riesgos de seguridad. Las medidas incluyen el análisis de vulnerabilidades y la gestión
            de parches.
        de:
          name: Handhabung von technischen Schwachstellen
          description: Diese Steuerungsmaßnahme stellt sicher, dass technische Schwachstellen zeitnah identifiziert,
            bewertet, priorisiert und behoben werden. Dazu gehören Schwachstellenscans, Patch-Management, Risikobewertungen
            und Nachweisführung.
        zh:
          name: 技术漏洞管理
          description: 该控制能够及时识别、评估并修复技术漏洞，以最大限度地降低安全风险。措施包括漏洞扫描和补丁管理。
        pl:
          name: Zarządzanie podatnościami technicznymi
          description: Zabezpieczenie zapewnia niezwłoczne identyfikowanie, ocenę i usuwanie podatności technicznych
            w celu ograniczenia ryzyk bezpieczeństwa. Obejmuje m.in. skanowanie podatności oraz zarządzanie poprawkami
            (patch management).
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.1, 6.10

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b); KSC-19 (art. 8 ust. 1 pkt 3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.9
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.9
      name: Configuration management
      description: This control ensures consistent management of system configurations to maintain security settings
        and prevent unauthorized changes.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.9
      translations:
        fr:
          name: Gestion des configurations
          description: Cette mesure de sécurité garantit une gestion cohérente des configurations des systèmes pour
            maintenir des paramètres sécurisés et prévenir les changements non autorisés.
        cs:
          name: Řízení konfigurací
          description: Tato kontrola zajišťuje konzistentní správu konfigurací systému, aby se zachovala bezpečnostní
            nastavení a zabránilo se neoprávněným změnám.
        sv:
          name: Hantering av konfiguration
          description: Den här kontrollen säkerställer konsekvent hantering av systemkonfigurationer för att upprätthålla
            säkerhetsinställningar och förhindra obehöriga ändringar.
        es:
          name: Gestión de la configuración
          description: Este control garantiza una gestión coherente de las configuraciones del sistema para mantener
            la configuración de seguridad y evitar cambios no autorizados.
        de:
          name: Konfigurationsmanagement
          description: Diese Steuerungsmaßnahme stellt sicher, dass Systemkonfigurationen definiert, dokumentiert,
            geschützt und kontrolliert geändert werden, um Sicherheitseinstellungen zu gewährleisten und unbeabsichtigte
            Änderungen zu verhindern.
        zh:
          name: 配置管理
          description: 这种控制确保系统配置的一致管理，以维护安全设置并防止未经授权的更改。
        pl:
          name: Zarządzanie konfiguracją
          description: Zabezpieczenie zapewnia spójne zarządzanie konfiguracją systemów w celu utrzymania ustawień
            bezpieczeństwa i zapobiegania nieuprawnionym zmianom.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.3

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.10
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.10
      name: Information deletion
      description: This control ensures sensitive information is securely deleted when no longer required to prevent
        unauthorized recovery or exposure.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.10
      translations:
        fr:
          name: Suppression des informations
          description: Cette mesure de sécurité garantit que les informations sensibles sont supprimées de manière
            sécurisée lorsqu'elles ne sont plus nécessaires pour éviter toute récupération ou exposition non autorisée.
        cs:
          name: Vymazání informací
          description: Tato kontrola zajišťuje, že citlivé informace jsou bezpečně smazány, jakmile již nejsou potřeba,
            aby se zabránilo jejich neoprávněnému obnovení nebo odhalení.
        sv:
          name: Radering av uppgifter
          description: Den här kontrollen säkerställer att känslig information tas bort på ett säkert sätt när den
            inte längre behövs för att förhindra obehörig återställning eller exponering.
        es:
          name: Eliminación de información
          description: Este control garantiza que la información confidencial se elimine de forma segura cuando
            ya no sea necesaria para evitar la recuperación o exposición no autorizada.
        de:
          name: Löschung von Informationen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Informationen, die nicht mehr benötigt werden
            oder gesetzlichen Vorgaben zufolge gelöscht werden müssen, sicher und nachvollziehbar entfernt werden.
            Dazu gehören dokumentierte Löschverfahren, sichere Methoden und Nachweise.
        zh:
          name: 信息删除
          description: 这种控制确保敏感信息在不再需要防止未经授权的恢复或曝光时被安全删除。
        pl:
          name: Usuwanie informacji
          description: Zabezpieczenie zapewnia bezpieczne usuwanie informacji wrażliwych, gdy nie są już potrzebne,
            aby zapobiec ich nieuprawnionemu odtworzeniu lub ujawnieniu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 12.2 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-17 (art. 8 ust. 1 pkt 2 lit. m)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.11
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.11
      name: Data masking
      description: This control protects sensitive information during processing or display by using data masking
        techniques to obscure data from unauthorized users.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.11
      translations:
        fr:
          name: Masquage des données
          description: Cette mesure de sécurité protège les informations sensibles lors de leur traitement ou affichage
            en utilisant des techniques de masquage des données pour les rendre inaccessibles aux utilisateurs non
            autorisés.
        cs:
          name: Maskování dat
          description: Tato kontrola chrání citlivé informace během zpracování nebo zobrazení pomocí technik maskování
            dat, které je chrání před neoprávněnými uživateli.
        sv:
          name: Maskering av data
          description: Den här kontrollen skyddar känslig information under bearbetning eller visning med hjälp
            av datamaskeringstekniker för att dölja data från obehöriga användare.
        es:
          name: Enmascaramiento de datos
          description: Este control protege la información confidencial durante el procesamiento o la visualización
            mediante el uso de técnicas de enmascaramiento de datos para ocultar los datos de usuarios no autorizados.
        de:
          name: Datenmaskierung
          description: Diese Steuerungsmaßnahme stellt sicher, dass sensible Informationen während Verarbeitung,
            Anzeige oder Test durch geeignete Maskierungsverfahren geschützt werden. Dies verhindert, dass unbefugte
            Personen Inhalte erkennen oder missbrauchen können.
        zh:
          name: 数据掩蔽
          description: 该控制通过使用数据掩蔽技术保护敏感信息，防止未授权用户发现。
        pl:
          name: Maskowanie danych
          description: Zabezpieczenie chroni informacje wrażliwe podczas przetwarzania lub wyświetlania, stosując
            techniki maskowania danych, które ukrywają je przed nieuprawnionymi użytkownikami.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.12
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.12
      name: Data leakage prevention
      description: This control implements mechanisms to prevent the accidental exposure of sensitive data through
        email, removable media, or other channels.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.12
      translations:
        fr:
          name: Prévention de la fuite de données
          description: Cette mesure de sécurité met en œuvre des mécanismes pour empêcher l'exposition accidentelle
            des données sensibles via des e-mails, des supports amovibles ou d'autres canaux.
        cs:
          name: Prevence úniku dat
          description: Tato kontrola implementuje mechanismy, které zabraňují náhodnému vystavení citlivých dat
            prostřednictvím e-mailu, vyměnitelných médií nebo jiných kanálů.
        sv:
          name: Förebyggande av dataläckage
          description: Den här kontrollen implementerar mekanismer för att förhindra oavsiktlig exponering av känsliga
            data via e-post, flyttbara medier eller andra kanaler.
        es:
          name: Prevención de fuga de datos
          description: Este control implementa mecanismos para evitar la exposición accidental de datos confidenciales
            a través de correo electrónico, medios extraíbles u otros canales.
        de:
          name: Verhinderung von Datenlecks
          description: Diese Steuerungsmaßnahme stellt sicher, dass unbeabsichtigter oder unbefugter Abfluss sensibler
            Daten durch technische und organisatorische Maßnahmen verhindert wird. Dazu gehören DLP-Systeme, Richtlinien,
            Überwachung und Zugriffsbeschränkungen.
        zh:
          name: 数据泄露预防
          description: 该控制机制实现了防止敏感数据通过电子邮件、可移动媒体或其他渠道意外泄露的机制。
        pl:
          name: Zapobieganie wyciekom danych
          description: Zabezpieczenie wprowadza mechanizmy zapobiegające przypadkowemu ujawnieniu danych wrażliwych
            za pośrednictwem poczty elektronicznej, nośników wymiennych lub innych kanałów.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.13
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.13
      name: Information backup
      description: This control ensures critical information is backed up regularly and securely to ensure its availability
        in case of incidents or disasters.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.13
      translations:
        fr:
          name: Sauvegarde des informations
          description: Cette mesure de sécurité garantit que les informations critiques sont sauvegardées régulièrement
            et en toute sécurité pour assurer leur disponibilité en cas d'incidents ou de catastrophes.
        cs:
          name: Zálohování informací
          description: Tato kontrola zajišťuje pravidelné a bezpečné zálohování důležitých informací, aby byla zajištěna
            jejich dostupnost v případě incidentů nebo katastrof.
        sv:
          name: Säkerhetskopiering av information
          description: Denna kontroll säkerställer att kritisk information säkerhetskopieras regelbundet och säkert
            för att säkerställa dess tillgänglighet i händelse av incidenter eller katastrofer.
        es:
          name: Copia de seguridad de la información
          description: Este control garantiza que la información crítica se respalde de forma regular y segura para
            garantizar su disponibilidad en caso de incidentes o desastres.
        de:
          name: Sicherung von Informationen
          description: Diese Steuerungsmaßnahme stellt sicher, dass kritische Informationen regelmäßig, vollständig,
            geschützt und wiederherstellbar gesichert werden. Dies umfasst Backup-Strategien, Speicherorte, Tests
            und Dokumentation.
        zh:
          name: 信息备份
          description: 这种控制确保关键信息能够定期且安全地备份，确保在事故或灾难发生时其可用性。
        pl:
          name: Kopie zapasowe informacji
          description: Zabezpieczenie zapewnia regularne i bezpieczne wykonywanie kopii zapasowych krytycznych informacji,
            aby zagwarantować ich dostępność w razie incydentów lub katastrof.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 4.2

            Ustawa o KSC: KSC-10 (art. 8 ust. 1 pkt 2 lit. f)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.14
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.14
      name: Redundancy of information processing facilities
      description: This control ensures redundancy is built into processing facilities to maintain availability
        and operations during system failures or emergencies.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.14
      translations:
        fr:
          name: Redondance des moyens de traitement de l'information
          description: Cette mesure de sécurité garantit que la redondance est intégrée dans les installations de
            traitement pour maintenir la disponibilité et les opérations en cas de défaillances ou d'urgences.
        cs:
          name: Redundancevybavení pro zpracování informací
          description: Tato kontrola zajišťuje, že do procesních zařízení je zabudována redundance, aby se zachovala
            dostupnost a provoz během systémových selhání nebo nouzových situací.
        sv:
          name: Redundans för informationsbehandlingsanläggningar
          description: Den här kontrollen säkerställer att redundans är inbyggd i bearbetningsanläggningar för att
            upprätthålla tillgänglighet och drift under systemfel eller nödsituationer.
        es:
          name: Redundancia de las instalaciones de procesamiento de la información
          description: Este control garantiza que la redundancia esté integrada en las instalaciones de procesamiento
            para mantener la disponibilidad y las operaciones durante fallas o emergencias del sistema.
        de:
          name: Redundanz von informationsverarbeitenden Einrichtungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass kritische Systeme und Dienste durch Redundanzen,
            Ausweichmechanismen und Notbetriebskonzepte abgesichert sind, um Ausfallzeiten zu minimieren und Betriebsfähigkeit
            zu erhalten.
        zh:
          name: 信息处理设施的冗余
          description: 这种控制确保处理设施内置冗余，以在系统故障或紧急情况下保持可用性和运行。
        pl:
          name: Redundancja środków przetwarzania informacji
          description: Zabezpieczenie zapewnia redundancję środków przetwarzania informacji, aby utrzymać dostępność
            i ciągłość działania w razie awarii systemów lub sytuacji kryzysowych.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 4.2

            Ustawa o KSC: KSC-10 (art. 8 ust. 1 pkt 2 lit. f)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.15
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.15
      name: Logging
      description: This control enables logging of activities within systems to support monitoring, incident detection,
        and forensic investigations.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.15
      translations:
        fr:
          name: Journalisation
          description: Cette mesure de sécurité permet la journalisation des activités au sein des systèmes pour
            soutenir la surveillance, la détection des incidents et les analyses forensiques.
        cs:
          name: Zaznamenávání logů
          description: Tato kontrola umožňuje protokolování aktivit v systémech pro podporu monitorování, detekce
            incidentů a forenzního vyšetřování.
        sv:
          name: Skogsavverkning
          description: Den här kontrollen möjliggör loggning av aktiviteter i system för att stödja övervakning,
            incidentidentifiering och kriminaltekniska undersökningar.
        es:
          name: Registro
          description: Este control permite el registro de actividades dentro de los sistemas para respaldar el
            monitoreo, la detección de incidentes y las investigaciones forenses.
        de:
          name: Protokollierung
          description: Diese Steuerungsmaßnahme stellt sicher, dass sicherheitsrelevante Ereignisse und Aktivitäten
            protokolliert, geschützt, überprüft und für Analysen sowie Ermittlungen genutzt werden können. Dies
            umfasst Log-Quellen, Integrität der Logs, Aufbewahrung und Überwachung.
        zh:
          name: 伐木
          description: 这种控制使系统内活动能够记录，以支持监控、事件检测和取证调查。
        pl:
          name: Rejestrowanie zdarzeń
          description: Zabezpieczenie umożliwia rejestrowanie zdarzeń i aktywności w systemach na potrzeby monitorowania,
            wykrywania incydentów oraz analiz z zakresu informatyki śledczej.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.2

            Ustawa o KSC: KSC-11 (art. 8 ust. 1 pkt 2 lit. g); KSC-34 (art. 10 ust. 2, 4)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.16
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.16
      name: Monitoring activities
      description: This control ensures the ongoing monitoring of system activities to detect, respond to, and mitigate
        security threats.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.16
      translations:
        fr:
          name: Activités de surveillance
          description: Cette mesure de sécurité garantit la surveillance continue des activités du système pour
            détecter, répondre et atténuer les menaces à la sécurité.
        cs:
          name: Monitorovací činnosti
          description: Tato kontrola zajišťuje průběžné monitorování aktivit systému za účelem detekce, reakce na
            a zmírnění bezpečnostních hrozeb.
        sv:
          name: Övervakning av aktiviteter
          description: Den här kontrollen säkerställer kontinuerlig övervakning av systemaktiviteter för att identifiera,
            svara på och minimera säkerhetshot.
        es:
          name: Seguimiento de las actividades
          description: Este control garantiza la supervisión continua de las actividades del sistema para detectar,
            responder y mitigar las amenazas de seguridad.
        de:
          name: Überwachung von Aktivitäten
          description: Diese Steuerungsmaßnahme stellt sicher, dass Systeme, Dienste und Netzwerke kontinuierlich
            überwacht werden, um Anomalien, Angriffe oder sicherheitsrelevante Ereignisse frühzeitig zu erkennen
            und geeignete Gegenmaßnahmen einzuleiten.
        zh:
          name: 监测活动
          description: 这种控制确保系统活动持续监控，以检测、响应并缓解安全威胁。
        pl:
          name: Monitorowanie działań
          description: Zabezpieczenie zapewnia ciągłe monitorowanie aktywności w systemach w celu wykrywania zagrożeń
            bezpieczeństwa, reagowania na nie i ograniczania ich skutków.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.2, 6.7

            Ustawa o KSC: KSC-11 (art. 8 ust. 1 pkt 2 lit. g); KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.17
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.17
      name: Clock synchronization
      description: This control ensures system clocks are synchronized to maintain accurate and consistent timestamps
        for logs and other critical processes.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.17
      translations:
        fr:
          name: Synchronisation des horloges
          description: Cette mesure de sécurité garantit que les horloges des systèmes sont synchronisées pour maintenir
            des horodatages précis et cohérents pour les journaux et d'autres processus critiques.
        cs:
          name: Synchronizace hodin
          description: Tato kontrola zajišťuje synchronizaci systémových hodin, aby se zachovala přesná a konzistentní
            časová razítka pro protokoly a další kritické procesy.
        sv:
          name: Synkronisering av klockan
          description: Den här kontrollen säkerställer att systemklockorna är synkroniserade för att upprätthålla
            korrekta och konsekventa tidsstämplar för loggar och andra kritiska processer.
        es:
          name: Sincronización de reloj
          description: Este control garantiza que los relojes del sistema estén sincronizados para mantener marcas
            de tiempo precisas y coherentes para los registros y otros procesos críticos.
        de:
          name: Uhrensynchronisation
          description: Diese Steuerungsmaßnahme stellt sicher, dass System- und Netzwerkuhren synchronisiert sind,
            um korrekte Zeitstempel für Protokolle, Analysen und sicherheitsrelevante Prozesse zu gewährleisten.
        zh:
          name: 时钟同步
          description: 这种控制确保系统时钟同步，以保持日志及其他关键进程的时间戳准确一致。
        pl:
          name: Synchronizacja zegarów
          description: Zabezpieczenie zapewnia synchronizację zegarów systemowych w celu utrzymania dokładnych i
            spójnych znaczników czasu w dziennikach zdarzeń i innych krytycznych procesach.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.2

            Ustawa o KSC: KSC-11 (art. 8 ust. 1 pkt 2 lit. g)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.18
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.18
      name: Use of privileged utility programs
      description: This control restricts and monitors the use of privileged utility programs to prevent misuse
        and unauthorized actions.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.18
      translations:
        fr:
          name: Utilisation de programmes utilitaires à privilèges
          description: Cette mesure de sécurité restreint et surveille l'utilisation des programmes utilitaires
            privilégiés pour prévenir les abus et les actions non autorisées.
        cs:
          name: Používání privilegovaných utilitních programů
          description: Tato kontrola omezuje a monitoruje používání privilegovaných obslužných programů, aby se
            zabránilo zneužití a neoprávněným akcím.
        sv:
          name: Användning av privilegierade verktygsprogram
          description: Den här kontrollen begränsar och övervakar användningen av privilegierade verktygsprogram
            för att förhindra missbruk och obehöriga åtgärder.
        es:
          name: Uso de programas de utilidad privilegiados
          description: Este control restringe y supervisa el uso de programas de utilidad con privilegios para evitar
            el uso indebido y las acciones no autorizadas.
        de:
          name: Gebrauch von Hilfsprogrammen mit privilegierten Rechten
          description: Diese Steuerungsmaßnahme stellt sicher, dass der Einsatz privilegierter Dienstprogramme kontrolliert,
            überwacht und auf berechtigte Personen beschränkt wird. Dies verhindert Missbrauch, Manipulation und
            unbefugte Aktivitäten.
        zh:
          name: 特权实用程序的使用
          description: 这种控制限制并监控特权工具程序的使用，以防止滥用和未经授权的行为。
        pl:
          name: Używanie uprzywilejowanych programów narzędziowych
          description: Zabezpieczenie ogranicza i monitoruje używanie uprzywilejowanych programów narzędziowych
            w celu zapobiegania nadużyciom i nieuprawnionym działaniom.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.3, 11.4

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.19
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.19
      name: Installation of software on operational systems
      description: This control ensures software installation on operational systems is managed securely to prevent
        vulnerabilities or unauthorized changes.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.19
      translations:
        fr:
          name: Installation de logiciels sur des systèmes opérationnels
          description: Cette mesure de sécurité garantit que l'installation de logiciels sur les systèmes opérationnels
            est gérée de manière sécurisée pour éviter les vulnérabilités ou les modifications non autorisées.
        cs:
          name: Instalace softwaru na provozní systémy
          description: Tato kontrola zajišťuje bezpečnou správu instalace softwaru v provozních systémech, aby se
            zabránilo zranitelnostem nebo neoprávněným změnám.
        sv:
          name: Installation av programvara på operativsystem
          description: Den här kontrollen säkerställer att programvaruinstallation på operativsystem hanteras på
            ett säkert sätt för att förhindra sårbarheter eller obehöriga ändringar.
        es:
          name: Instalación de software en sistemas operativos
          description: Este control garantiza que la instalación de software en los sistemas operativos se gestione
            de forma segura para evitar vulnerabilidades o cambios no autorizados.
        de:
          name: Installation von Software auf Systemen im Betrieb
          description: Diese Steuerungsmaßnahme stellt sicher, dass Softwareinstallationen in produktiven Umgebungen
            kontrolliert, dokumentiert und autorisiert erfolgen, um Risiken durch Schadsoftware, Fehlkonfigurationen
            oder unbefugte Änderungen zu vermeiden.
        zh:
          name: 作系统上的软件安装
          description: 这种控制确保在运营系统上的软件安装得到安全管理，以防止漏洞或未经授权的更改。
        pl:
          name: Instalowanie oprogramowania w systemach produkcyjnych
          description: Zabezpieczenie zapewnia bezpieczne zarządzanie instalowaniem oprogramowania w systemach produkcyjnych,
            aby zapobiec powstawaniu podatności lub nieuprawnionym zmianom.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.9 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.20
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.20
      name: Networks security
      description: This control ensures network security through firewalls, intrusion detection systems, and access
        controls to protect against unauthorized access and attacks.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.20
      translations:
        fr:
          name: Sécurité des réseaux
          description: Cette mesure de sécurité garantit la sécurité du réseau grâce à des pare-feu, des systèmes
            de détection d'intrusion et des contrôles d'accès pour protéger contre les accès non autorisés et les
            attaques.
        cs:
          name: Zabezpečení sítí
          description: Tato kontrola zajišťuje zabezpečení sítě pomocí firewallů, systémů detekce narušení a řízení
            přístupu, které chrání před neoprávněným přístupem a útoky.
        sv:
          name: Nätverks säkerhet
          description: Den här kontrollen säkerställer nätverkssäkerhet genom brandväggar, intrångsidentifieringssystem
            och åtkomstkontroller för att skydda mot obehörig åtkomst och attacker.
        es:
          name: Seguridad de las redes
          description: Este control garantiza la seguridad de la red a través de firewalls, sistemas de detección
            de intrusos y controles de acceso para proteger contra accesos y ataques no autorizados.
        de:
          name: Netzwerksicherheit
          description: Diese Steuerungsmaßnahme stellt sicher, dass Netzwerke durch geeignete Sicherheitsmaßnahmen
            wie Firewalls, IDS/IPS, Segmentierung, Überwachung und Zugriffskontrollen geschützt werden.
        zh:
          name: 网络安全
          description: 这种控制通过防火墙、入侵检测系统和访问控制确保网络安全，防止未经授权的访问和攻击。
        pl:
          name: Bezpieczeństwo sieci
          description: Zabezpieczenie zapewnia bezpieczeństwo sieci za pomocą zapór sieciowych, systemów wykrywania
            włamań (IDS) i kontroli dostępu w celu ochrony przed nieuprawnionym dostępem i atakami.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.7

            Ustawa o KSC: KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.21
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.21
      name: Security of network services
      description: This control ensures network services are protected to maintain confidentiality, integrity, and
        availability during use.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.21
      translations:
        fr:
          name: Sécurité des services réseau
          description: Cette mesure de sécurité garantit que les services réseau sont protégés pour maintenir la
            confidentialité, l'intégrité et la disponibilité pendant leur utilisation.
        cs:
          name: Zabezpečení síťových služeb
          description: Tato kontrola zajišťuje ochranu síťových služeb, aby byla zachována důvěrnost, integrita
            a dostupnost během používání.
        sv:
          name: Säkerhet för nättjänster
          description: Den här kontrollen säkerställer att nätverkstjänster skyddas för att upprätthålla konfidentialitet,
            integritet och tillgänglighet under användning.
        es:
          name: Seguridad de los servicios de red
          description: Este control garantiza que los servicios de red estén protegidos para mantener la confidencialidad,
            la integridad y la disponibilidad durante el uso.
        de:
          name: Sicherheit von Netzwerkdiensten
          description: Diese Steuerungsmaßnahme stellt sicher, dass genutzte Netzwerkdienste – intern und extern
            – sicher bereitgestellt, überwacht und geschützt werden. Dazu gehören Sicherheitsvereinbarungen, Monitoring,
            Tests und Absicherung gegen Angriffe.
        zh:
          name: 网络服务的安全性
          description: 这种控制确保网络服务在使用过程中保持机密性、完整性和可用性。
        pl:
          name: Bezpieczeństwo usług sieciowych
          description: Zabezpieczenie zapewnia ochronę usług sieciowych w celu utrzymania poufności, integralności
            i dostępności podczas ich użytkowania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 11.1

            Ustawa o KSC: KSC-18 (art. 8 ust. 1 pkt 2 lit. n)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.22
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.22
      name: Segregation of networks
      description: This control implements network segregation to limit the spread of threats and minimize the impact
        of potential breaches.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.22
      translations:
        fr:
          name: Cloisonnement des réseaux
          description: Cette mesure de sécurité met en œuvre la segmentation des réseaux pour limiter la propagation
            des menaces et minimiser l'impact des violations potentielles.
        cs:
          name: Segmentace sítí
          description: Tato kontrola implementuje segmentaci sítě, aby se omezilo šíření hrozeb a minimalizoval
            dopad potenciálních narušení.
        sv:
          name: Segregation av nätverk
          description: Den här kontrollen implementerar nätverkssegregering för att begränsa spridningen av hot
            och minimera effekten av potentiella intrång.
        es:
          name: Segregación de redes
          description: Este control implementa la segregación de la red para limitar la propagación de amenazas
            y minimizar el impacto de posibles infracciones.
        de:
          name: Trennung von Netzwerken
          description: Diese Steuerungsmaßnahme stellt sicher, dass Netzwerke nach Schutzbedarf segmentiert werden,
            um Risiken, Angriffsflächen und Auswirkungen potenzieller Vorfälle zu reduzieren.
        zh:
          name: 网络隔离
          description: 这种控制实施了网络隔离，以限制威胁的扩散，并最大限度地减少潜在入侵的影响。
        pl:
          name: Rozdzielenie sieci
          description: Zabezpieczenie wprowadza rozdzielenie (segmentację) sieci w celu ograniczenia rozprzestrzeniania
            się zagrożeń i zminimalizowania skutków ewentualnych naruszeń.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.8

            Ustawa o KSC: KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.23
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.23
      name: Web filtering
      description: This control uses web filtering tools to block unauthorized or harmful content from being accessed
        over the internet.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.23
      translations:
        fr:
          name: Filtrage web
          description: Cette mesure de sécurité utilise des outils de filtrage Web pour bloquer le contenu non autorisé
            ou nuisible accessible sur Internet.
        cs:
          name: Filtrování webových stránek
          description: Tato kontrola používá nástroje pro filtrování webu k blokování přístupu k neoprávněnému nebo
            škodlivému obsahu přes internet.
        sv:
          name: Webbfiltrering
          description: Den här kontrollen använder webbfiltreringsverktyg för att blockera obehörigt eller skadligt
            innehåll från att nås via Internet.
        es:
          name: Filtrado web
          description: Este control usa herramientas de filtrado web para bloquear el acceso a contenido no autorizado
            o dañino a través de Internet.
        de:
          name: Webfilterung
          description: Diese Steuerungsmaßnahme stellt sicher, dass Zugriffe auf schädliche, unangemessene oder
            unerlaubte Webseiten durch Filtermechanismen eingeschränkt oder verhindert werden.
        zh:
          name: 网页过滤
          description: 该控制利用网络过滤工具阻止未经授权或有害内容通过互联网访问。
        pl:
          name: Filtrowanie stron internetowych
          description: Zabezpieczenie wykorzystuje narzędzia filtrowania stron internetowych do blokowania dostępu
            do niedozwolonych lub szkodliwych treści w internecie.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.9 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.24
