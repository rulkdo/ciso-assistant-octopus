    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7
      ref_id: '7.1'
      name: Resources
      description: Provide the necessary resources to build, run, and continually improve the ISMS, ensuring its
        effective operation and alignment with organizational goals.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.raci
      - urn:intuitem:risk:function:doc-pol:doc.competency
      - urn:intuitem:risk:function:doc-pol:doc.controls
      translations:
        fr:
          name: Ressources
          description: Fournir les ressources nécessaires pour construire, exploiter et améliorer en continu le
            SMSI, en garantissant son fonctionnement efficace et son alignement avec les objectifs organisationnels.
        cs:
          name: Zdroje
          description: Zajistit nezbytné zdroje pro budování, provoz a neustálé zlepšování systému ISMS a zajistit
            jeho efektivní fungování a soulad s cíli organizace.
        sv:
          name: Resurser
          description: Tillhandahålla de nödvändiga resurserna för att bygga, driva och kontinuerligt förbättra
            ISMS, vilket säkerställer att det fungerar effektivt och är i linje med organisationens mål.
        es:
          name: Recursos
          description: Proporcionar los recursos necesarios para construir, ejecutar y mejorar continuamente el
            SGSI, asegurando su funcionamiento eficaz y su alineación con los objetivos de la organización.
        de:
          name: Ressourcen
          description: Personelle, technische, finanzielle und organisatorische Ressourcen werden bereitgestellt,
            um Aufbau, Betrieb und Weiterentwicklung des ISMS sicherzustellen.
        zh:
          name: 资源
          description: 提供必要资源以建设、运行并持续改进ISMS，确保其有效运行并与组织目标保持一致。
        pl:
          name: Zasoby
          description: Zapewnienie zasobów potrzebnych do ustanowienia, wdrożenia, utrzymywania i ciągłego doskonalenia
            SZBI.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.1

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7
      ref_id: '7.2'
      name: Competence
      description: Ensure personnel involved in the ISMS possess the necessary competence through appropriate education,
        training, or experience to fulfill their responsibilities effectively.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.educ
      - urn:intuitem:risk:function:doc-pol:doc.educ_register
      translations:
        fr:
          name: Compétences
          description: Garantir que le personnel impliqué dans le SMSI dispose des compétences nécessaires grâce
            à une formation, une éducation ou une expérience appropriées pour remplir efficacement leurs responsabilités.
        cs:
          name: Kompetence
          description: Zajistit, aby personál zapojený do ISMS měl potřebné kompetence prostřednictvím odpovídajícího
            vzdělání, školení nebo zkušeností k efektivnímu plnění svých povinností.
        sv:
          name: Kompetens
          description: Se till att personal som är involverad i ISMS har den nödvändiga kompetensen genom lämplig
            utbildning, träning eller erfarenhet för att kunna fullgöra sina uppgifter på ett effektivt sätt.
        es:
          name: Competencia
          description: Asegurar que el personal involucrado en el SGSI posea la competencia necesaria a través de
            la educación, capacitación o experiencia apropiada para cumplir con sus responsabilidades de manera
            efectiva.
        de:
          name: Kompetenz
          description: Personen, die Aufgaben im ISMS übernehmen, verfügen über die erforderlichen Kenntnisse, Fähigkeiten,
            Erfahrungen und Qualifikationen
        zh:
          name: 职权
          description: 确保参与ISMS的人员通过适当的教育、培训或经验具备必要的能力，以有效履行职责。
        pl:
          name: Kompetencje
          description: Zapewnienie, że osoby wykonujące zadania w SZBI mają potrzebne kompetencje dzięki wykształceniu,
            szkoleniom lub doświadczeniu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 8.2, 10.1

            Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d); KSC-13 (art. 8 ust. 1 pkt 2 lit. i); KSC-26 (art.
            8e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7
      ref_id: '7.3'
      name: Awareness
      description: Promote awareness among relevant personnel about the ISMS, their role in information security,
        and the importance of compliance with security policies and requirements.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.educ
      - urn:intuitem:risk:function:doc-pol:doc.educ_register
      translations:
        fr:
          name: Sensibilisation
          description: Promouvoir la sensibilisation du personnel concerné au SMSI, à leur rôle dans la sécurité
            de l’information et à l’importance de se conformer aux politiques et exigences de sécurité.
        cs:
          name: Povědomí
          description: Zvyšovat povědomí příslušných pracovníků o systému ISMS, jejich roli v informační bezpečnosti
            a důležitosti dodržování bezpečnostních politik a požadavků.
        sv:
          name: Medvetenhet
          description: Främja medvetenhet bland relevant personal om ISMS, deras roll i informationssäkerhet och
            vikten av att följa säkerhetspolicyer och krav.
        es:
          name: Conciencia
          description: Promover la concienciación entre el personal pertinente sobre el SGSI, su papel en la seguridad
            de la información y la importancia del cumplimiento de las políticas y requisitos de seguridad.
        de:
          name: Bewusstsein
          description: Mitarbeitende werden über ihre sicherheitsrelevanten Verantwortlichkeiten, Risiken, Rollen
            und Verhaltensanforderungen informiert, um ein ausgeprägtes Sicherheitsbewusstsein sicherzustellen.
        zh:
          name: 意识
          description: 提高相关人员对ISMS、其在信息安全中作用以及遵守安全政策和要求重要性的认识。
        pl:
          name: Świadomość
          description: Budowanie świadomości osób na temat SZBI, ich roli w bezpieczeństwie informacji i znaczenia
            przestrzegania polityk i wymagań bezpieczeństwa.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 8.1

            Ustawa o KSC: KSC-14 (art. 8 ust. 1 pkt 2 lit. j)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7
      ref_id: '7.4'
      name: Communication
      description: Establish effective internal and external communication processes, ensuring the timely and appropriate
        exchange of information relevant to the ISMS and its objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.com
      translations:
        fr:
          name: Communication
          description: Établir des processus de communication internes et externes efficaces, assurant un échange
            d’informations opportun et approprié en lien avec le SMSI et ses objectifs.
        cs:
          name: Komunikace
          description: Zavést efektivní interní a externí komunikační procesy, které zajistí včasnou a vhodnou výměnu
            informací relevantních pro ISMS a jeho cíle.
        sv:
          name: Kommunikation
          description: Etablera effektiva interna och externa kommunikationsprocesser för att säkerställa ett snabbt
            och lämpligt utbyte av information som är relevant för ISMS och dess mål.
        es:
          name: Comunicación
          description: Establecer procesos efectivos de comunicación interna y externa, asegurando el intercambio
            oportuno y adecuado de información relevante para el SGSI y sus objetivos.
        de:
          name: Kommunikation
          description: Kommunikationsprozesse zu informationssicherheitsrelevanten Themen werden definiert, einschließlich
            Inhalten, Empfängern, Zuständigkeiten und geeigneten Zeitpunkten.
        zh:
          name: 交通
          description: 建立有效的内外沟通流程，确保及时且适当地交换与ISMS（国际安全管理系统及其目标）相关的信息。
        pl:
          name: Komunikacja
          description: Ustanowienie komunikacji wewnętrznej i zewnętrznej zapewniającej terminową wymianę informacji
            istotnych dla SZBI i jego celów.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.5
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7
      ref_id: '7.5'
      name: Documented Information
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Informations documentées
        cs:
          name: Dokumentované informace
        sv:
          name: Dokumenterad information
        es:
          name: Información documentada
        de:
          name: Dokumentierte Information
        zh:
          name: 文献信息
        pl:
          name: Udokumentowane informacje
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.5.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7.5
      ref_id: 7.5.1
      name: General
      description: Document the ISMS as needed to ensure effective planning, operation, control of processes, and
        alignment with organizational requirements.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.doc_register
      translations:
        fr:
          name: Généralités
          description: Documenter le SMSI selon les besoins pour garantir une planification efficace, le fonctionnement,
            le contrôle des processus et l’alignement avec les exigences organisationnelles.
        cs:
          name: Obecné
          description: Dokumentujte ISMS dle potřeby pro zajištění efektivního plánování, provozu, řízení procesů
            a souladu s požadavky organizace.
        sv:
          name: Allmänt
          description: Dokumentera ISMS efter behov för att säkerställa effektiv planering, drift, kontroll av processer
            och anpassning till organisationens krav.
        es:
          name: General
          description: Documente el SGSI según sea necesario para garantizar una planificación, operación y control
            efectivos de los procesos y la alineación con los requisitos de la organización.
        de:
          name: Allgemeines
          description: Dokumentierte Informationen werden erstellt, aktualisiert und verwaltet, soweit dies für
            Planung, Betrieb, Steuerung und Überwachung des ISMS erforderlich ist.
        zh:
          name: 常规
          description: 根据需要记录ISMS文件，以确保有效的规划、运营、流程控制并与组织需求保持一致。
        pl:
          name: Postanowienia ogólne
          description: Dokumentowanie SZBI w zakresie potrzebnym do skutecznego planowania, działania i nadzoru
            nad procesami.
          annotation: 'Ustawa o KSC: KSC-32 (art. 10 ust. 1-3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.5.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7.5
      ref_id: 7.5.2
      name: Creating and Updating documented information
      description: Ensure ISMS documentation is appropriately created, updated, and controlled, including proper
        approval and version management.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.doc_register
      translations:
        fr:
          name: Création et mise à jour
          description: S’assurer que la documentation du SMSI est correctement créée, mise à jour et contrôlée,
            y compris avec une approbation et une gestion des versions appropriées.
        cs:
          name: Vytváření a aktualizace dokumentovaných informací
          description: Zajistit, aby byla dokumentace ISMS řádně vytvořena, aktualizována a kontrolována, včetně
            řádného schvalování a správy verzí.
        sv:
          name: Skapa och uppdatera dokumenterad information
          description: Se till att ISMS-dokumentationen skapas, uppdateras och kontrolleras på lämpligt sätt, inklusive
            korrekt godkännande och versionshantering.
        es:
          name: Creación y actualización de información documentada
          description: Asegúrese de que la documentación del SGSI se cree, actualice y controle adecuadamente, incluida
            la aprobación adecuada y la gestión de versiones.
        de:
          name: Erstellen und Aktualisieren
          description: Dokumente werden geprüft, genehmigt, versioniert und gepflegt, sodass deren Genauigkeit,
            Aktualität und Eignung gewährleistet ist.
        zh:
          name: 创建和更新文档信息
          description: 确保ISMS文档得到适当创建、更新和控制，包括适当的审批和版本管理。
        pl:
          name: Tworzenie i aktualizowanie
          description: Właściwe tworzenie, aktualizowanie i zatwierdzanie dokumentacji SZBI wraz z nadzorem nad
            wersjami.
          annotation: 'Ustawa o KSC: KSC-32 (art. 10 ust. 1-3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7.5.3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:7.5
      ref_id: 7.5.3
      name: Control of documented information
      description: Make ISMS documentation accessible and usable for those who need it, while protecting it from
        unauthorized access or loss.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.doc_register
      translations:
        fr:
          name: Contrôle des informations documentées
          description: Rendre la documentation du SMSI accessible et utilisable pour ceux qui en ont besoin, tout
            en la protégeant contre tout accès non autorisé ou perte.
        cs:
          name: Řízení dokumentovaných informací
          description: Zpřístupněte dokumentaci ISMS a zpřístupněte ji těm, kteří ji potřebují, a zároveň ji chraňte
            před neoprávněným přístupem nebo ztrátou.
        sv:
          name: Kontroll av dokumenterad information
          description: Gör ISMS-dokumentationen tillgänglig och användbar för dem som behöver den, samtidigt som
            den skyddas från obehörig åtkomst eller förlust.
        es:
          name: Control de la información documentada
          description: Haga que la documentación del SGSI sea accesible y utilizable para quienes la necesiten,
            al tiempo que la protege contra el acceso no autorizado o la pérdida.
        de:
          name: Steuerung dokumentierter Information
          description: Dokumentierte Informationen werden geschützt, zugriffskontrolliert, wiederauffindbar und
            vor Verlust, Missbrauch oder Beschädigung gesichert
        zh:
          name: 对文档信息的控制
          description: 让ISMS文档对有需要的人可访问和使用，同时保护其免受未经授权访问或丢失。
        pl:
          name: Nadzór nad udokumentowanymi informacjami
          description: Zapewnienie dostępności dokumentacji SZBI dla osób, które jej potrzebują, oraz jej ochrona
            przed nieuprawnionym dostępem lub utratą.
          annotation: 'Ustawa o KSC: KSC-32 (art. 10 ust. 1-3)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:8
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '8'
      name: Operations
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Fonctionnement
        cs:
          name: Provoz
        sv:
          name: Verksamhet
        es:
          name: Operaciones
        de:
          name: Betrieb
        zh:
          name: 运营
        pl:
          name: Działania operacyjne
    - urn: urn:intuitem:risk:req_node:iso27001-2022:8.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:8
      ref_id: '8.1'
      name: Operational planning and control
      description: Plan and control ISMS processes, ensuring consistency with requirements and making necessary
        adjustments to address risks and opportunities.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.raci
      - urn:intuitem:risk:function:doc-pol:doc.proc_register
      translations:
        fr:
          name: Planification et contrôle opérationnels
          description: Planifier et contrôler les processus du SMSI, en garantissant leur cohérence avec les exigences
            et en apportant les ajustements nécessaires pour traiter les risques et opportunités.
        cs:
          name: Operativní plánování a řízení
          description: Plánovat a řídit procesy ISMS, zajišťovat soulad s požadavky a provádět nezbytné úpravy pro
            řešení rizik a příležitostí.
        sv:
          name: Operativ planering och kontroll
          description: Planera och kontrollera ISMS-processer, säkerställa överensstämmelse med krav och göra nödvändiga
            justeringar för att hantera risker och möjligheter.
        es:
          name: Planificación y control operativo
          description: Planificar y controlar los procesos del SGSI, asegurando la coherencia con los requisitos
            y realizando los ajustes necesarios para hacer frente a los riesgos y oportunidades.
        de:
          name: Betriebliche Planung und Steuerung
          description: ISMS-relevante Prozesse werden geplant, gesteuert und überwacht
        zh:
          name: 作战规划与控制
          description: 规划和控制ISMS流程，确保与需求一致，并做出必要调整以应对风险和机遇。
        pl:
          name: Planowanie i nadzór nad działaniami operacyjnymi
          description: Planowanie i nadzorowanie procesów SZBI zgodnie z wymaganiami oraz wprowadzanie korekt w
            odpowiedzi na ryzyka i szanse.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.4

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:8.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:8
      ref_id: '8.2'
      name: Information security risk assessment
      description: Implement the risk assessment process to identify, evaluate, and prioritize information security
        risks as defined in the ISMS framework.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.proc_register
      - urn:intuitem:risk:function:doc-pol:doc.risk_register
      translations:
        fr:
          name: Appréciation des risques de sécurité de l'information
          description: Mettre en œuvre le processus d’évaluation des risques pour identifier, évaluer et prioriser
            les risques liés à la sécurité de l’information, tel que défini dans le cadre du SMSI.
        cs:
          name: Posouzení rizik informační bezpečnosti
          description: Implementujte proces hodnocení rizik za účelem identifikace, vyhodnocení a stanovení priorit
            rizik informační bezpečnosti, jak je definováno v rámci ISMS.
        sv:
          name: Riskbedömning av informationssäkerhet
          description: Implementera riskbedömningsprocessen för att identifiera, utvärdera och prioritera informationssäkerhetsrisker
            enligt definitionen i ISMS-ramverket.
        es:
          name: Evaluación de riesgos de seguridad de la información
          description: Implementar el proceso de evaluación de riesgos para identificar, evaluar y priorizar los
            riesgos de seguridad de la información tal como se definen en el marco del SGSI.
        de:
          name: Informationssicherheitsrisikobeurteilung
          description: Risikobeurteilungen werden anhand der definierten Methoden durchgeführt, dokumentiert und
            aktualisiert, um relevante Risiken systematisch zu erfassen und zu bewerten.
        zh:
          name: 信息安全风险评估
          description: 实施风险评估流程，识别、评估并优先排序ISMS框架中定义的信息安全风险。
        pl:
          name: Szacowanie ryzyka w bezpieczeństwie informacji
          description: 'Przeprowadzanie szacowania ryzyka zgodnie z przyjętym procesem: identyfikacja, ocena i ustalenie
            priorytetów ryzyk bezpieczeństwa informacji.'
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:8.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:8
      ref_id: '8.3'
      name: Information security risk treatment
      description: Apply the risk treatment process by selecting and implementing appropriate controls to address
        identified risks, ensuring alignment with the organization’s risk acceptance criteria.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.proc_register
      - urn:intuitem:risk:function:doc-pol:doc.risk_register
      translations:
        fr:
          name: Traitement des risques de sécurité de l'information
          description: Appliquer le processus de traitement des risques en sélectionnant et en mettant en œuvre
            des contrôles appropriés pour traiter les risques identifiés, en assurant leur alignement avec les critères
            d’acceptation des risques de l’organisation.
        cs:
          name: Ošetření rizik informační bezpečnosti
          description: Aplikujte proces ošetření rizik výběrem a implementací vhodných kontrolních mechanismů k
            řešení identifikovaných rizik a zajistěte soulad s kritérii akceptace rizik organizace.
        sv:
          name: Hantering av informationssäkerhetsrisker
          description: Tillämpa riskhanteringsprocessen genom att välja och implementera lämpliga kontroller för
            att hantera identifierade risker, vilket säkerställer anpassning till organisationens kriterier för
            riskacceptans.
        es:
          name: Tratamiento de riesgos de seguridad de la información
          description: Aplicar el proceso de tratamiento de riesgos seleccionando e implementando controles adecuados
            para abordar los riesgos identificados, asegurando la alineación con los criterios de aceptación de
            riesgos de la organización.
        de:
          name: Informationssicherheitsrisikobehandlung
          description: Maßnahmen aus Risikobehandlungsplänen werden umgesetzt, deren Fortschritt überwacht und ihre
            Wirksamkeit bewertet
        zh:
          name: 信息安全风险处理
          description: 通过选择和实施适当的控制措施来应对已识别的风险，应用风险处理流程，确保与组织的风险接受标准保持一致。
        pl:
          name: Postępowanie z ryzykiem w bezpieczeństwie informacji
          description: Realizacja planu postępowania z ryzykiem przez wdrożenie dobranych zabezpieczeń zgodnie z
            kryteriami akceptacji ryzyka.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9
