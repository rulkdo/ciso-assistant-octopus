            zu gewährleisten.
        zh:
          name: 密码学的应用
          description: 这种控制确保采用密码学技术来保护数据的机密性、完整性和真实性。
        pl:
          name: Stosowanie kryptografii
          description: Zabezpieczenie zapewnia stosowanie technik kryptograficznych w celu ochrony poufności, integralności
