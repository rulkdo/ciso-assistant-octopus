      description: This control integrates security into all stages of the development life cycle to ensure systems
        and applications are built securely.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.25
      translations:
        fr:
          name: Cycle de vie de développement sécurisé
          description: Cette mesure de sécurité intègre la sécurité à toutes les étapes du cycle de vie du développement
            pour garantir que les systèmes et applications sont construits de manière sécurisée.
        cs:
          name: Bezpečný životní cyklus vývoje
          description: Tato kontrola integruje zabezpečení do všech fází životního cyklu vývoje, aby se zajistilo
            bezpečné vytváření systémů a aplikací.
        sv:
          name: Säker utvecklingslivscykel
          description: Den här kontrollen integrerar säkerhet i alla steg i utvecklingslivscykeln för att säkerställa
            att system och program skapas på ett säkert sätt.
        es:
          name: Ciclo de vida de desarrollo seguro
          description: Este control integra la seguridad en todas las etapas del ciclo de vida del desarrollo para
            garantizar que los sistemas y las aplicaciones se construyan de forma segura.
        de:
          name: Lebenszyklus einer sicheren Entwicklung
          description: Diese Steuerungsmaßnahme stellt sicher, dass Sicherheitsanforderungen, Tests, Reviews und
            Kontrollen in allen Phasen des Entwicklungslebenszyklus verankert sind – von der Planung über Design,
            Implementierung, Test bis zur Übergabe.
        zh:
          name: 安全开发生命周期
          description: 该控制将安全整合到开发生命周期的所有阶段，确保系统和应用的安全构建。
        pl:
          name: Bezpieczny cykl życia wytwarzania oprogramowania
          description: Zabezpieczenie włącza bezpieczeństwo do wszystkich etapów cyklu życia wytwarzania oprogramowania,
            aby systemy i aplikacje były tworzone w sposób bezpieczny.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.2

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.26
      assessable: true
