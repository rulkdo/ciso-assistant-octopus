    - urn: urn:intuitem:risk:req_node:iso27001-2022:4
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '4'
      name: Context of the organization
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Contexte de l'organisation
        cs:
          name: Kontext organizace
        sv:
          name: Organisationens sammanhang
        es:
          name: Contexto de la organización
        de:
          name: Kontext der Organisation
        zh:
          name: 组织背景
        pl:
          name: Kontekst organizacji
    - urn: urn:intuitem:risk:req_node:iso27001-2022:4.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:4
      ref_id: '4.1'
      name: Understanding the organization and its context
      description: Identify internal and external factors that influence the organization’s ability to achieve information
        security objectives, ensuring the ISMS is aligned with its context.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.context
      translations:
        fr:
          name: Compréhension de l'organisation et de son contexte
          description: Identifier les facteurs internes et externes qui influencent la capacité de l’organisation
            à atteindre ses objectifs de sécurité de l’information, en veillant à ce que le SMSI soit aligné sur
            son contexte.
        cs:
          name: Porozumění organizaci a jejímu kontextu
          description: Identifikujte interní a externí faktory, které ovlivňují schopnost organizace dosáhnout cílů
            v oblasti informační bezpečnosti, a zajistěte, aby systém ISMS byl v souladu s jeho kontextem.
        sv:
          name: Förstå organisationen och dess sammanhang
          description: Identifiera interna och externa faktorer som påverkar organisationens förmåga att uppnå informationssäkerhetsmål,
            vilket säkerställer att ISMS är anpassat till sitt sammanhang.
        es:
          name: Comprender la organización y su contexto
          description: Identificar los factores internos y externos que influyen en la capacidad de la organización
            para alcanzar los objetivos de seguridad de la información, asegurando que el SGSI esté alineado con
            su contexto.
        de:
          name: Verstehen der Organisation und ihres Kontextes
          description: Interne und externe Faktoren werden identifiziert, die beeinflussen, ob und in welchem Ausmaß
            Informationssicherheitsziele erreicht werden können
        zh:
          name: 理解组织及其背景
          description: 识别影响组织实现信息安全目标能力的内部和外部因素，确保ISMS与其背景保持一致。
        pl:
          name: Zrozumienie organizacji i jej kontekstu
          description: Określenie czynników wewnętrznych i zewnętrznych, które wpływają na zdolność organizacji
            do osiągnięcia celów bezpieczeństwa informacji, tak aby SZBI był dopasowany do jej kontekstu.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:4.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:4
      ref_id: '4.2'
      name: Understanding the needs and expectations of interested parties
      description: Analyze the needs and expectations of interested parties to incorporate them into the ISMS and
        address relevant information security requirements.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.context
      translations:
        fr:
          name: Compréhension des besoins et attentes des parties intéressées
          description: Analyser les besoins et attentes des parties intéressées pour les intégrer dans le SMSI et
            répondre aux exigences pertinentes en matière de sécurité de l’information.
        cs:
          name: Porozumění potřebám a očekáváním zainteresovaných stran
          description: Analyzovat potřeby a očekávání zainteresovaných stran s cílem začlenit je do systému ISMS
            a řešit relevantní požadavky na informační bezpečnost.
        sv:
          name: Förstå intressenternas behov och förväntningar
          description: Analysera behoven och förväntningarna hos intresserade parter för att införliva dem i ISMS
            och ta itu med relevanta informationssäkerhetskrav.
        es:
          name: Comprender las necesidades y expectativas de las partes interesadas
          description: Analizar las necesidades y expectativas de las partes interesadas para incorporarlas al SGSI
            y abordar los requisitos de seguridad de la información pertinentes.
        de:
          name: Verstehen der Erfordernisse und Erwartungen interessierter Parteien
          description: Die Bedürfnisse und Erwartungen relevanter interessierter Parteien werden analysiert, um
            daraus resultierende Anforderungen an die Informationssicherheit vollständig zu erfassen und im ISMS
            zu berücksichtigen
        zh:
          name: 了解相关方的需求和期望
          description: 分析相关方的需求和期望，将其纳入ISMS，并满足相关的信息安全需求。
        pl:
          name: Zrozumienie potrzeb i oczekiwań stron zainteresowanych
          description: Analiza potrzeb i oczekiwań stron zainteresowanych w celu uwzględnienia ich w SZBI i odniesienia
            się do istotnych wymagań bezpieczeństwa informacji.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:4.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:4
      ref_id: '4.3'
      name: Determining the scope of the information security management system
      description: Define the scope of the ISMS by considering internal and external factors, stakeholder needs,
        and dependencies within the operational environment.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.scope
      translations:
        fr:
          name: Détermination du domaine d'application du système de management de la sécurité de l'information
          description: Définir le périmètre du SMSI en prenant en compte les facteurs internes et externes, les
            besoins des parties prenantes et les dépendances dans l’environnement opérationnel.
        cs:
          name: Stanovení rozsahu systému managementu informační bezpečnosti
          description: Definujte rozsah ISMS s ohledem na interní a externí faktory, potřeby zainteresovaných stran
            a závislosti v rámci provozního prostředí.
        sv:
          name: Fastställande av omfattningen av ledningssystemet för informationssäkerhet
          description: Definiera omfattningen av ISMS genom att ta hänsyn till interna och externa faktorer, intressenternas
            behov och beroenden inom den operativa miljön.
        es:
          name: Determinación del alcance del sistema de gestión de la seguridad de la información
          description: Defina el alcance del SGSI teniendo en cuenta los factores internos y externos, las necesidades
            de las partes interesadas y las dependencias dentro del entorno operativo.
        de:
          name: Festlegen des Anwendungsbereichs des Informationssicherheitsmanagementsystems
          description: Der Anwendungsbereich des ISMS wird festgelegt, indem interne und externe Faktoren, die Anforderungen
            interessierter Parteien sowie Prozesse, Systeme, Standorte, Dienstleistungen und Abhängigkeiten vollständig
            berücksichtigt werden
        zh:
          name: 确定信息安全管理系统的范围
          description: 通过考虑内部和外部因素、利益相关者需求以及运营环境中的依赖关系，定义ISMS的范围。
        pl:
          name: Określenie zakresu systemu zarządzania bezpieczeństwem informacji
          description: Określenie zakresu SZBI z uwzględnieniem czynników wewnętrznych i zewnętrznych, potrzeb stron
            zainteresowanych i zależności w środowisku działania.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:4.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:4
      ref_id: '4.4'
      name: Information security management system
      description: Build, run, and continually improve an ISMS to effectively manage information security risks
        and meet organizational goals.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.overview
      translations:
        fr:
          name: Système de management de la sécurité de l'information
          description: Concevoir, exploiter et améliorer en continu un SMSI pour gérer efficacement les risques
            de sécurité de l’information et atteindre les objectifs organisationnels.
        cs:
          name: Systém managementu informační bezpečnosti
          description: Vytvářejte, provozujte a neustále vylepšujte systém ISMS pro efektivní řízení rizik informační
            bezpečnosti a plnění cílů organizace.
        sv:
          name: Ledningssystem för informationssäkerhet
          description: Bygg, kör och förbättra kontinuerligt ett ISMS för att effektivt hantera informationssäkerhetsrisker
            och uppfylla organisatoriska mål.
        es:
          name: Sistema de gestión de seguridad de la información
          description: Cree, ejecute y mejore continuamente un SGSI para gestionar eficazmente los riesgos de seguridad
            de la información y cumplir los objetivos de la organización.
        de:
          name: Informationssicherheitsmanagementsystem
          description: Ein Informationssicherheitsmanagementsystem wird aufgebaut, betrieben und kontinuierlich
            verbessert, um Informationssicherheitsrisiken wirksam zu steuern und die festgelegten Sicherheitsziele
            zu erreichen
        zh:
          name: 信息安全管理系统
          description: 构建、运行并持续改进ISM，以有效管理信息安全风险并实现组织目标。
        pl:
          name: System zarządzania bezpieczeństwem informacji
          description: Ustanowienie, wdrożenie, utrzymywanie i ciągłe doskonalenie SZBI w celu skutecznego zarządzania
            ryzykiem bezpieczeństwa informacji i realizacji celów organizacji.
    - urn: urn:intuitem:risk:req_node:iso27001-2022:5
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '5'
      name: Leadership
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Leadership
        cs:
          name: Vůdčí role
        sv:
          name: Ledarskap
        es:
          name: Liderazgo
        de:
          name: Führung
        zh:
          name: 领导层
        pl:
          name: Przywództwo
    - urn: urn:intuitem:risk:req_node:iso27001-2022:5.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:5
      ref_id: '5.1'
      name: Leadership and commitment
      description: Demonstrate leadership and commitment by supporting the ISMS, aligning it with organizational
        objectives, allocating resources, promoting a security culture, and driving continual improvement.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.overview
      - urn:intuitem:risk:function:doc-pol:doc.controls
      - urn:intuitem:risk:function:doc-pol:doc.com
      - urn:intuitem:risk:function:doc-pol:doc.audit_plan
      - urn:intuitem:risk:function:doc-pol:doc.competency
      - urn:intuitem:risk:function:doc-pol:pol.main
      translations:
        fr:
          name: Leadership et engagement
          description: Démontrer un leadership et un engagement en soutenant le SMSI, en l'alignant sur les objectifs
            organisationnels, en allouant des ressources, en promouvant une culture de sécurité et en favorisant
            l'amélioration continue.
        cs:
          name: Vůdčí role a závazek
          description: Prokazovat vůdčí schopnosti a odhodlání podporou ISMS, jeho sladěním s cíli organizace, alokací
            zdrojů, prosazováním bezpečnostní kultury a prosazováním neustálého zlepšování.
        sv:
          name: Ledarskap och engagemang
          description: Visa ledarskap och engagemang genom att stödja ISMS, anpassa det till organisatoriska mål,
            fördela resurser, främja en säkerhetskultur och driva ständiga förbättringar.
        es:
          name: Liderazgo y compromiso
          description: Demostrar liderazgo y compromiso apoyando el SGSI, alineándolo con los objetivos de la organización,
            asignando recursos, promoviendo una cultura de seguridad e impulsando la mejora continua.
        de:
          name: Führung und Verpflichtung
          description: Führung und Engagement werden gezeigt, indem das ISMS aktiv unterstützt, mit den Unternehmenszielen
            abgestimmt, mit erforderlichen Ressourcen ausgestattet und durch die Förderung einer Sicherheitskultur
            sowie kontinuierliche Verbesserungsmaßnahmen vorangetrieben wird.
        zh:
          name: 领导力与承诺
          description: 通过支持ISMS、使其与组织目标对齐、分配资源、促进安全文化并推动持续改进来展示领导力和承诺。
        pl:
          name: Przywództwo i zaangażowanie
          description: Wykazanie przywództwa i zaangażowania przez wspieranie SZBI, zgodność z celami organizacji,
            zapewnienie zasobów, budowanie kultury bezpieczeństwa i ciągłe doskonalenie.
          annotation: 'Ustawa o KSC: KSC-24 (art. 8c); KSC-25 (art. 8d)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:5.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:5
      ref_id: '5.2'
      name: Policy
      description: Establish an information security policy aligned with the organization's objectives and strategic
        direction, outlining commitments to compliance, continual improvement, and the promotion of information
        security.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      translations:
        fr:
          name: Politique
          description: Établir une politique de sécurité de l’information alignée sur les objectifs et la direction
            stratégique de l'organisation, précisant les engagements en matière de conformité, d'amélioration continue
            et de promotion de la sécurité de l’information.
        cs:
          name: Politika
          description: Zavést politiku informační bezpečnosti v souladu s cíli a strategickým směrem organizace,
            která nastíní závazky k dodržování předpisů, neustálému zlepšování a podpoře informační bezpečnosti.
        sv:
          name: Politik
          description: Upprätta en informationssäkerhetspolicy i linje med organisationens mål och strategiska inriktning,
            som beskriver åtaganden om efterlevnad, ständiga förbättringar och främjande av informationssäkerhet.
        es:
          name: Política
          description: Establecer una política de seguridad de la información alineada con los objetivos y la dirección
            estratégica de la organización, delineando los compromisos de cumplimiento, mejora continua y promoción
            de la seguridad de la información.
        de:
          name: Politik
          description: Eine Informationssicherheitspolitik wird erstellt, dokumentiert und kommuniziert, die Ziele,
            Grundsätze und Verpflichtungen beschreibt und im Einklang mit der strategischen Ausrichtung steht.
        zh:
          name: 政策
          description: 制定与组织目标和战略方向一致的信息安全政策，明确合规、持续改进和信息安全促进的承诺。
        pl:
          name: Polityka
          description: Ustanowienie polityki bezpieczeństwa informacji zgodnej z celami i kierunkiem strategicznym
            organizacji, zawierającej zobowiązanie do spełniania wymagań, ciągłego doskonalenia i promowania bezpieczeństwa
            informacji.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.1

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:5.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:5
      ref_id: '5.3'
      name: Organizational roles, responsibilities and authorities
      description: Define, assign, and communicate roles, responsibilities, and authorities to ensure the effective
        implementation and operation of the ISMS, with accountability aligned to organizational objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.raci
      translations:
        fr:
          name: Rôles, responsabilités et autorités au sein de l'organisation
          description: Définir, attribuer et communiquer les rôles, responsabilités et autorités pour assurer la
            mise en œuvre et le fonctionnement efficaces du SMSI, avec une responsabilité alignée sur les objectifs
            organisationnels.
        cs:
          name: Role, odpovědnosti a pravomoci v rámci organizace
          description: Definovat, přiřadit a sdělit role, odpovědnosti a oprávnění k zajištění efektivní implementace
            a provozu ISMS s odpovědností v souladu s cíli organizace.
        sv:
          name: Organisatoriska roller, ansvar och befogenheter
          description: Definiera, tilldela och kommunicera roller, ansvar och befogenheter för att säkerställa en
            effektiv implementering och drift av ISMS, med ansvarsskyldighet anpassad till organisatoriska mål.
        es:
          name: Funciones, responsabilidades y autoridades de la organización
          description: Definir, asignar y comunicar roles, responsabilidades y autoridades para garantizar la implementación
            y operación efectivas del SGSI, con una rendición de cuentas alineada con los objetivos organizacionales.
        de:
          name: Rollen, Verantwortlichkeiten und Befugnisse in der Organisation
          description: Rollen, Verantwortlichkeiten und Befugnisse werden definiert, zugewiesen und kommuniziert,
            damit Aufgaben, Zuständigkeiten und Entscheidungswege klar geregelt und nachvollziehbar sind.
        zh:
          name: 组织角色、职责与权限
          description: 定义、分配并传达角色、责任和权限，以确保ISMS的有效实施和运营，并与组织目标保持一致的问责制。
        pl:
          name: Role, odpowiedzialności i uprawnienia w organizacji
          description: Określenie, przypisanie i zakomunikowanie ról, odpowiedzialności i uprawnień, tak aby SZBI
            był skutecznie wdrożony i funkcjonował, z rozliczalnością zgodną z celami organizacji.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 1.2

            Ustawa o KSC: KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
      ref_id: '6'
      name: Planning
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Planification
        cs:
          name: Plánování
        sv:
          name: Planering
        es:
          name: Planificación
        de:
          name: Planung
        zh:
          name: 规划
        pl:
          name: Planowanie
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:6
      ref_id: '6.1'
      name: Actions to address risks and opportunities
      implementation_groups:
      - Clauses
      translations:
        fr:
          name: Actions à mettre en oeuvre face aux risques et opportunités
        cs:
          name: Činnosti zaměřené na rizika a píležitosti
        sv:
          name: Åtgärder för att hantera risker och möjligheter
        es:
          name: Acciones para abordar los riesgos y las oportunidades
        de:
          name: Maßnahmen zum Umgang mit Risiken und Chancen
        zh:
          name: 应对风险与机遇的行动
        pl:
          name: Działania dotyczące ryzyk i szans
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6.1.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:6.1
      ref_id: 6.1.1
      name: General
      description: Establish a process to identify information security risks and opportunities, considering internal
        and external factors, stakeholder needs, and applicable requirements to ensure the ISMS achieves its objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.risk
      - urn:intuitem:risk:function:doc-pol:doc.risk_register
      translations:
        fr:
          name: Généralités
          description: Établir un processus pour identifier les risques et opportunités en matière de sécurité de
            l’information, en prenant en compte les facteurs internes et externes, les besoins des parties prenantes
            et les exigences applicables, afin d’assurer que le SMSI atteigne ses objectifs.
        cs:
          name: Obecné
          description: Zavést proces pro identifikaci rizik a příležitostí v oblasti informační bezpečnosti s ohledem
            na interní a externí faktory, potřeby zúčastněných stran a příslušné požadavky, aby bylo zajištěno,
            že systém ISMS dosáhne svých cílů.
        sv:
          name: Allmänt
          description: Etablera en process för att identifiera informationssäkerhetsrisker och möjligheter, med
            hänsyn till interna och externa faktorer, intressenternas behov och tillämpliga krav för att säkerställa
            att ISMS uppnår sina mål.
        es:
          name: General
          description: Establecer un proceso para identificar los riesgos y oportunidades de seguridad de la información,
            teniendo en cuenta los factores internos y externos, las necesidades de las partes interesadas y los
            requisitos aplicables para garantizar que el SGSI logre sus objetivos.
        de:
          name: Allgemeines
          description: Risiken und Chancen werden identifiziert und bewertet, um Maßnahmen abzuleiten, die die Erreichung
            der Informationssicherheitsziele unterstützen und unerwünschte Auswirkungen verhindern sollen.
        zh:
          name: 常规
          description: 建立识别信息安全风险和机会的流程，考虑内部和外部因素、利益相关者需求及适用要求，确保ISMS实现其目标。
        pl:
          name: Postanowienia ogólne
          description: Ustanowienie procesu identyfikowania ryzyk i szans w obszarze bezpieczeństwa informacji z
            uwzględnieniem czynników wewnętrznych i zewnętrznych, potrzeb stron zainteresowanych i mających zastosowanie
            wymagań.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6.1.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:6.1
      ref_id: 6.1.2
      name: Information security risk assessment requirement
      description: Establish a process to assess information security risks at planned intervals, using defined
        criteria to evaluate threats to confidentiality, integrity, and availability, ensuring consistent and reliable
        results.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.risk
      - urn:intuitem:risk:function:doc-pol:doc.risk_register
      translations:
        fr:
          name: Appréciation des risques de sécurité de l'information
          description: Établir un processus pour évaluer les risques liés à la sécurité de l’information à des intervalles
            planifiés, en utilisant des critères définis pour évaluer les menaces sur la confidentialité, l’intégrité
            et la disponibilité, garantissant des résultats cohérents et fiables.
        cs:
          name: Posuzování rizik informační bezpečnosti
          description: Zavést proces pro hodnocení rizik informační bezpečnosti v plánovaných intervalech s využitím
            definovaných kritérií pro vyhodnocení hrozeb pro důvěrnost, integritu a dostupnost a zajištění konzistentních
            a spolehlivých výsledků.
        sv:
          name: Krav på riskbedömning av informationssäkerhet
          description: Upprätta en process för att bedöma informationssäkerhetsrisker med planerade intervall, med
            hjälp av definierade kriterier för att utvärdera hot mot konfidentialitet, integritet och tillgänglighet,
            vilket säkerställer konsekventa och tillförlitliga resultat.
        es:
          name: Requisito de evaluación de riesgos de seguridad de la información
          description: Establecer un proceso para evaluar los riesgos de seguridad de la información a intervalos
            planificados, utilizando criterios definidos para evaluar las amenazas a la confidencialidad, integridad
            y disponibilidad, garantizando resultados consistentes y confiables.
        de:
          name: Informationssicherheitsrisikobeurteilung
          description: Ein dokumentierter und einheitlich angewendeter Prozess zur Beurteilung von Informationssicherheitsrisiken
            wird definiert, in dem Kriterien, Methoden, Eintrittswahrscheinlichkeiten und Auswirkungen beschrieben
            werden, um Risiken nachvollziehbar zu bewerten.
        zh:
          name: 信息安全风险评估要求
          description: 建立一个流程，按计划间隔评估信息安全风险，使用定义标准评估机密性、完整性和可用性的威胁，确保结果一致且可靠。
        pl:
          name: Szacowanie ryzyka w bezpieczeństwie informacji
          description: Ustanowienie procesu szacowania ryzyka w zaplanowanych odstępach czasu, z określonymi kryteriami
            oceny zagrożeń dla poufności, integralności i dostępności, dającego spójne i porównywalne wyniki.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6.1.3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:6.1
      ref_id: 6.1.3
      name: Information security risk treatment
      description: Define a process to address identified information security risks by selecting appropriate controls,
        ensuring alignment with risk acceptance criteria, and documenting them in a risk treatment plan.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.risk
      - urn:intuitem:risk:function:doc-pol:doc.risk_register
      - urn:intuitem:risk:function:doc-pol:doc.soa
      translations:
        fr:
          name: Traitement des risques de sécurité de l'information
          description: Définir un processus pour traiter les risques identifiés en matière de sécurité de l’information
            en sélectionnant des contrôles appropriés, en assurant leur alignement avec les critères d’acceptation
            des risques et en les documentant dans un plan de traitement des risques.
        cs:
          name: Ošetření rizik informační bezpečnosti
          description: Definujte proces pro řešení identifikovaných rizik informační bezpečnosti výběrem vhodných
            kontrol, zajištěním souladu s kritérii akceptace rizik a jejich dokumentováním v plánu pro řešení rizik.
        sv:
          name: Hantering av informationssäkerhetsrisker
          description: Definiera en process för att hantera identifierade informationssäkerhetsrisker genom att
            välja lämpliga kontroller, säkerställa anpassning till kriterier för riskacceptans och dokumentera dem
            i en riskhanteringsplan.
        es:
          name: Tratamiento de riesgos de seguridad de la información
          description: Defina un proceso para abordar los riesgos de seguridad de la información identificados mediante
            la selección de controles adecuados, asegurando la alineación con los criterios de aceptación de riesgos
            y documentándolos en un plan de tratamiento de riesgos.
        de:
          name: Informationssicherheitsrisikobehandlung
          description: Identifizierte Informationssicherheitsrisiken werden behandelt, indem Optionen zur Risikovermeidung,
            -minderung, -übertragung oder -akzeptanz bewertet, ausgewählt, priorisiert und umgesetzt werden
        zh:
          name: 信息安全风险处理
          description: 定义一个流程，通过选择适当的控制措施、确保与风险接受标准一致，并在风险处理计划中记录这些风险，来应对已识别的信息安全风险。
        pl:
          name: Postępowanie z ryzykiem w bezpieczeństwie informacji
          description: Określenie procesu postępowania z ryzykiem przez dobór odpowiednich zabezpieczeń, zgodnie
            z kryteriami akceptacji ryzyka, i udokumentowanie go w planie postępowania z ryzykiem.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:6
      ref_id: '6.2'
      name: Information security objectives and planning to achieve them
      description: Set measurable information security objectives aligned with the ISMS and strategic goals, and
        plan actions detailing responsibilities, resources, timelines, and evaluation methods to achieve them.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.main
      - urn:intuitem:risk:function:doc-pol:doc.so_register
      - urn:intuitem:risk:function:doc-pol:doc.risk_register
      - urn:intuitem:risk:function:doc-pol:doc.mgmt_review
      translations:
        fr:
          name: Objectifs de sécurité de l'information et plans pour les atteindre
          description: Définir des objectifs mesurables en matière de sécurité de l’information alignés sur le SMSI
            et les objectifs stratégiques, et planifier des actions détaillant les responsabilités, les ressources,
            les échéances et les méthodes d’évaluation pour les atteindre.
        cs:
          name: Cíle informační bezpečnosti a plánování jejich dosažení
          description: Stanovte si měřitelné cíle v oblasti informační bezpečnosti v souladu s cíli ISMS a strategickými
            cíli a naplánujte si kroky s podrobným popisem odpovědností, zdrojů, časových harmonogramů a metod hodnocení
            k jejich dosažení.
        sv:
          name: Informationssäkerhetsmål och planering för att uppnå dem
          description: Sätt upp mätbara informationssäkerhetsmål i linje med ISMS och strategiska mål, och planera
            åtgärder som beskriver ansvar, resurser, tidslinjer och utvärderingsmetoder för att uppnå dem.
        es:
          name: Objetivos de seguridad de la información y planificación para alcanzarlos
          description: Establezca objetivos medibles de seguridad de la información alineados con el SGSI y las
            metas estratégicas, y planifique acciones que detallen las responsabilidades, los recursos, los plazos
            y los métodos de evaluación para alcanzarlos.
        de:
          name: Informationssicherheitsziele und Planung zu deren Erreichung
          description: Informationssicherheitsziele werden messbar formuliert, Verantwortlichkeiten und Ressourcen
            werden festgelegt, Zeitrahmen definiert und geeignete Methoden zur Bewertung des Zielerreichungsgrades
            bestimmt
        zh:
          name: 信息安全目标及其实现规划
          description: 设定与ISM和战略目标相一致的可衡量信息安全目标，并规划具体的责任、资源、时间表及评估方法以实现这些目标。
        pl:
          name: Cele bezpieczeństwa informacji i planowanie ich osiągnięcia
          description: Ustalenie mierzalnych celów bezpieczeństwa informacji zgodnych z SZBI i celami strategicznymi
            oraz zaplanowanie działań z określeniem odpowiedzialności, zasobów, terminów i sposobu oceny wyników.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.1, 7.1

            Ustawa o KSC: KSC-04 (art. 8 ust. 1 pkt 1); KSC-05 (art. 8 ust. 1 pkt 2 lit. a); KSC-12 (art. 8 ust.
            1 pkt 2 lit. h)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:6.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:6
      ref_id: '6.3'
      name: Planning for changes
      description: Plan changes to the ISMS systematically to ensure alignment with information security requirements,
        seamless integration into existing processes, and effective risk management.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.maintenance
      translations:
        fr:
          name: Planification des modifications
          description: Planifier les changements au SMSI de manière systématique pour garantir leur alignement avec
            les exigences de sécurité de l’information, leur intégration transparente dans les processus existants
            et une gestion efficace des risques.
        cs:
          name: Plánování změn
          description: Systematicky plánujte změny v systému ISMS, abyste zajistili soulad s požadavky na informační
            bezpečnost, bezproblémovou integraci do stávajících procesů a efektivní řízení rizik.
        sv:
          name: Planera för ändringar
          description: Planera ändringar i ISMS systematiskt för att säkerställa anpassning till informationssäkerhetskrav,
            sömlös integration i befintliga processer och effektiv riskhantering.
        es:
          name: Planificación de cambios
          description: Planifique los cambios en el SGSI de forma sistemática para garantizar la alineación con
            los requisitos de seguridad de la información, la integración perfecta en los procesos existentes y
            la gestión eficaz de los riesgos.
        de:
          name: Planung von Änderungen
          description: Änderungen am ISMS werden systematisch geplant, indem Auswirkungen auf Prozesse, Ressourcen
            und Sicherheitsanforderungen bewertet werden
        zh:
          name: 变革规划
          description: 系统性规划ISMS的变更，确保与信息安全要求保持一致，无缝整合于现有流程，并有效管理风险。
        pl:
          name: Planowanie zmian
          description: Planowe wprowadzanie zmian w SZBI, tak aby były zgodne z wymaganiami bezpieczeństwa informacji,
            wpisywały się w istniejące procesy i uwzględniały ryzyko.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.4

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:7
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:core
