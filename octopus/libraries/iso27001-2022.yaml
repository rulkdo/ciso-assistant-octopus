      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.24
      translations:
        fr:
          name: Utilisation de la cryptographie
          description: Cette mesure de sécurité garantit que des techniques cryptographiques sont appliquées pour
            protéger la confidentialité, l'intégrité et l'authenticité des données.
        cs:
          name: Použití kryptografie
          description: Tato kontrola zajišťuje, že kryptografické techniky jsou používány k ochraně důvěrnosti,
            integrity a autenticity dat.
        sv:
          name: Användning av kryptografi
          description: Den här kontrollen säkerställer att kryptografiska tekniker tillämpas för att skydda datakonfidentialitet,
            integritet och äkthet.
        es:
          name: Uso de la criptografía
          description: Este control garantiza que se apliquen técnicas criptográficas para proteger la confidencialidad,
