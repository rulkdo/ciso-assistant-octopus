      translations:
        fr:
          name: Audit interne
        cs:
          name: Interní audit
        sv:
          name: Internrevision
        es:
          name: Auditoría interna
        de:
          name: Internes Audit
        zh:
          name: 内部审计
        pl:
          name: Audyt wewnętrzny
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.2.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.2
      ref_id: 9.2.1
      name: General
      description: Conduct internal audits at planned intervals to ensure the ISMS complies with ISO/IEC 27001 requirements
        and is effectively implemented and maintained.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.audit
      translations:
        fr:
          name: Généralités
          description: Effectuer des audits internes à des intervalles planifiés pour garantir que le SMSI est conforme
            aux exigences de l’ISO/CEI 27001 et qu’il est efficacement mis en œuvre et maintenu.
        cs:
          name: Obecné
          description: Provádět interní audity v plánovaných intervalech, aby se zajistilo, že systém ISMS splňuje
            požadavky normy ISO/IEC 27001 a je efektivně implementován a udržován.
        sv:
          name: Allmänt
          description: Genomför interna revisioner med planerade intervall för att säkerställa att ISMS uppfyller
            kraven i ISO/IEC 27001 och implementeras och underhålls effektivt.
        es:
          name: General
          description: Llevar a cabo auditorías internas a intervalos planificados para garantizar que el SGSI cumple
            con los requisitos de la norma ISO/IEC 27001 y se implementa y mantiene de manera efectiva.
        de:
          name: Allgemeines
          description: Interne Audits werden in geplanten Abständen durchgeführt, um Umsetzung, Wirksamkeit und
            Konformität des ISMS systematisch zu überprüfen
        zh:
          name: 常规
          description: 按计划间隔进行内部审计，确保ISMS符合ISO/IEC 27001要求并有效实施和维护。
        pl:
          name: Postanowienia ogólne
          description: Przeprowadzanie audytów wewnętrznych w zaplanowanych odstępach czasu w celu sprawdzenia,
            czy SZBI spełnia wymagania ISO/IEC 27001 i jest skutecznie wdrożony i utrzymywany.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.2, 2.3

            Ustawa o KSC: KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-48 (art. 15)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.2.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9.2
      ref_id: 9.2.2
      name: Internal audit programme
      description: Plan and perform internal audits, including defining criteria, scope, methods, and responsibilities,
        and report the results to relevant management.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:doc.audit_plan
      translations:
        fr:
          name: Programme d'audit interne
          description: Planifier et réaliser des audits internes, y compris la définition des critères, du périmètre,
            des méthodes et des responsabilités, et rapporter les résultats à la direction concernée.
        cs:
          name: Program interního auditu
          description: Plánovat a provádět interní audity, včetně definování kritérií, rozsahu, metod a odpovědností,
            a informovat o výsledcích příslušné vedení.
        sv:
          name: Program för internrevision
          description: Planera och genomföra interna revisioner, inklusive att definiera kriterier, omfattning,
            metoder och ansvar, och rapportera resultaten till relevant ledning.
        es:
          name: Programa de auditoría interna
          description: Planificar y realizar auditorías internas, incluida la definición de criterios, alcance,
            métodos y responsabilidades, e informar de los resultados a la dirección pertinente.
        de:
          name: Internes Auditprogramm
          description: Interne Audits werden geplant und durchgeführt, wobei Kriterien, Umfang, Methoden und Verantwortlichkeiten
            festgelegt werden
        zh:
          name: 内部审计项目
          description: 规划并执行内部审计，包括定义标准、范围、方法和职责，并将结果报告给相关管理层。
        pl:
          name: Program audytów wewnętrznych
          description: Planowanie i prowadzenie audytów wewnętrznych z określeniem kryteriów, zakresu, metod i odpowiedzialności
            oraz przekazywanie wyników właściwemu kierownictwu.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.2, 2.3

            Ustawa o KSC: KSC-12 (art. 8 ust. 1 pkt 2 lit. h); KSC-48 (art. 15)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.3
