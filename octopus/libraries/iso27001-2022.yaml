      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.31
      name: Separation of development, test and production environments
      description: This control ensures development, test, and production environments are segregated to prevent
        unintended interactions and unauthorized access.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.31
      translations:
        fr:
          name: Séparation des environnements de développement, de test et opérationnels
          description: Cette mesure de sécurité garantit que les environnements de développement, de test et de
            production sont séparés pour éviter les interactions involontaires et les accès non autorisés.
        cs:
          name: Oddělení vývojového, testovacího a produkčního prostředí
          description: Tato kontrola zajišťuje oddělení vývojového, testovacího a produkčního prostředí, aby se
            zabránilo nechtěným interakcím a neoprávněnému přístupu.
        sv:
          name: Separering av utvecklings-, test- och produktionsmiljöer
          description: Den här kontrollen säkerställer att utvecklings-, test- och produktionsmiljöer är åtskilda
            för att förhindra oavsiktliga interaktioner och obehörig åtkomst.
        es:
          name: Separación de los entornos de desarrollo, prueba y producción
          description: Este control garantiza que los entornos de desarrollo, prueba y producción estén segregados
            para evitar interacciones no deseadas y accesos no autorizados.
        de:
          name: Trennung von Entwicklungs-, Test- und Produktionsumgebungen
          description: Diese Steuerungsmaßnahme stellt sicher, dass Entwicklungs-, Test- und Produktionsumgebungen
            klar voneinander getrennt sind, um unbeabsichtigte Änderungen, Sicherheitsrisiken oder Datenverlust
            zu verhindern.
        zh:
          name: 开发、测试和生产环境的分离
          description: 这种控制确保开发、测试和生产环境被隔离，以防止意外交互和未经授权的访问。
        pl:
          name: Rozdzielenie środowisk rozwojowych, testowych i produkcyjnych
          description: Zabezpieczenie zapewnia rozdzielenie środowisk rozwojowych, testowych i produkcyjnych w celu
            zapobiegania niezamierzonym interakcjom i nieuprawnionemu dostępowi.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.2, 6.6

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b); KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.32
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.32
      name: Change management
      description: This control ensures changes to systems are managed securely to minimize risks and maintain operational
        stability.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.32
      translations:
        fr:
          name: Gestion des changements
          description: Cette mesure de sécurité garantit que les modifications des systèmes sont gérées de manière
            sécurisée pour minimiser les risques et maintenir la stabilité opérationnelle.
        cs:
          name: Řízení změn
          description: Tato kontrola zajišťuje bezpečné řízení změn v systémech, aby se minimalizovala rizika a
            udržela provozní stabilita.
        sv:
          name: Hantering av förändringar
          description: Den här kontrollen säkerställer att ändringar i systemen hanteras på ett säkert sätt för
            att minimera risker och upprätthålla driftstabiliteten.
        es:
          name: Gestión del cambio
          description: Este control garantiza que los cambios en los sistemas se gestionen de forma segura para
            minimizar los riesgos y mantener la estabilidad operativa.
        de:
          name: Änderungssteuerung
          description: Diese Steuerungsmaßnahme stellt sicher, dass Änderungen an Systemen kontrolliert, dokumentiert
            und risikobewertet durchgeführt werden, um Stabilität, Sicherheit und Nachvollziehbarkeit sicherzustellen.
            Dies umfasst Genehmigungsprozesse, Tests, Dokumentation und Überwachung.
        zh:
          name: 变更管理
          description: 这种控制确保系统变更得到安全管理，以降低风险并保持运营稳定性。
        pl:
          name: Zarządzanie zmianą
          description: Zabezpieczenie zapewnia bezpieczne zarządzanie zmianami w systemach w celu ograniczenia ryzyk
            i utrzymania stabilności działania.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.4, 6.6

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b); KSC-21 (art. 8 ust. 1 pkt 5)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.33
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.33
      name: Test information
      description: This control protects test data to prevent the exposure of sensitive or confidential information
        during testing processes.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.33
      translations:
        fr:
          name: Informations de test
          description: Cette mesure de sécurité protège les données de test pour éviter l'exposition d'informations
            sensibles ou confidentielles lors des processus de test.
        cs:
          name: Informace pro testování
          description: Tato kontrola chrání testovací data, aby se zabránilo úniku citlivých nebo důvěrných informací
            během testovacích procesů.
        sv:
          name: Information om provningen
          description: Denna kontroll skyddar testdata för att förhindra exponering av känslig eller konfidentiell
            information under testprocesser.
        es:
          name: Información de la prueba
          description: Este control protege los datos de prueba para evitar la exposición de información sensible
            o confidencial durante los procesos de prueba.
        de:
          name: Testdaten
          description: Diese Steuerungsmaßnahme stellt sicher, dass Testdaten – insbesondere wenn sie produktive
            oder vertrauliche Inhalte enthalten – geschützt, anonymisiert oder maskiert werden, um unbefugte Einsicht
            oder Missbrauch zu verhindern.
        zh:
          name: 测试信息
          description: 该控制保护测试数据，防止敏感或机密信息在测试过程中泄露。
        pl:
          name: Informacje testowe
          description: Zabezpieczenie chroni dane testowe, aby zapobiec ujawnieniu informacji wrażliwych lub poufnych
            podczas testów.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.5

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.34
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:a.8
      ref_id: A.8.34
      name: Protection of information systems during audit testing
      description: This control ensures that systems and data are safeguarded during audits by preventing unauthorized
        access, data leakage, or disruptions. Measures include using non-production environments, access restrictions,
        and confidentiality agreements to maintain system security and integrity.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.34
      translations:
        fr:
          name: Protection des systèmes d'information pendant les tests d'audit
          description: Cette mesure de sécurité garantit que les systèmes et les données sont protégés pendant les
            audits en empêchant les accès non autorisés, les fuites de données ou les perturbations. Les mesures
            incluent l'utilisation d'environnements non productifs, des restrictions d'accès et des accords de confidentialité
            pour préserver la sécurité et l'intégrité des systèmes.
        cs:
          name: Ochrana informačních systémů během auditního testování
          description: Tato kontrola zajišťuje, že systémy a data jsou během auditů chráněny tím, že zabraňuje neoprávněnému
            přístupu, úniku dat nebo narušení. Mezi opatření patří používání neprodukčních prostředí, omezení přístupu
            a dohody o mlčenlivosti k zachování bezpečnosti a integrity systému.
        sv:
          name: Skydd av informationssystem under revisionstestning
          description: Denna kontroll säkerställer att system och data skyddas under revisioner genom att förhindra
            obehörig åtkomst, dataläckage eller störningar. Åtgärderna omfattar användning av icke-produktionsmiljöer,
            åtkomstbegränsningar och konfidentialitetsavtal för att upprätthålla systemets säkerhet och integritet.
        es:
          name: Protección de los sistemas de información durante las pruebas de auditoría
          description: Este control garantiza que los sistemas y los datos estén protegidos durante las auditorías
            al evitar el acceso no autorizado, la fuga de datos o las interrupciones. Las medidas incluyen el uso
            de entornos que no son de producción, restricciones de acceso y acuerdos de confidencialidad para mantener
            la seguridad y la integridad del sistema.
        de:
          name: Schutz der Informationssysteme während Tests im Audit
          description: Diese Steuerungsmaßnahme stellt sicher, dass Systeme, Dienste und Daten während Prüfungen
            geschützt werden, indem unbefugter Zugriff, Datenabfluss oder Betriebsstörungen verhindert werden. Dazu
            gehören die Nutzung von Nicht-Produktivumgebungen, Zugriffsbeschränkungen, sichere Verfahren und Vertraulichkeitsvereinbarungen.
        zh:
          name: 审计测试期间信息系统的保护
          description: 这种控制确保系统和数据在审计过程中得到保护，防止未经授权的访问、数据泄露或中断。措施包括使用非生产环境、访问限制和保密协议，以维护系统安全和完整性。
        pl:
          name: Ochrona systemów informacyjnych podczas testów audytowych
          description: Zabezpieczenie zapewnia ochronę systemów i danych podczas audytów poprzez zapobieganie nieuprawnionemu
            dostępowi, wyciekom danych lub zakłóceniom. Obejmuje m.in. korzystanie ze środowisk nieprodukcyjnych,
            ograniczenia dostępu oraz umowy o zachowaniu poufności, co pozwala utrzymać bezpieczeństwo i integralność
            systemów.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 2.3, 6.5

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b); KSC-12 (art. 8 ust. 1 pkt 2 lit. h)'
