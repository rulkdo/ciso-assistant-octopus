        pl:
          name: Ocena efektów działania
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27001-2022:9
      ref_id: '9.1'
      name: Monitoring, measurement, analysis and evaluation
      description: Monitor, measure, analyze, and evaluate the ISMS’s performance and effectiveness using appropriate
        methods aligned with the organization’s objectives.
      implementation_groups:
      - Clauses
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:pol.monitor
      - urn:intuitem:risk:function:doc-pol:doc.audit_plan
      translations:
        fr:
          name: Surveillance, mesurages, analyse et évaluation
          description: Surveiller, mesurer, analyser et évaluer la performance et l’efficacité du SMSI en utilisant
            des méthodes appropriées alignées sur les objectifs de l’organisation.
        cs:
          name: Monitorování, měření, analýza, hodnocení
          description: Monitorovat, měřit, analyzovat a vyhodnocovat výkonnost a efektivitu ISMS pomocí vhodných
            metod v souladu s cíli organizace.
        sv:
          name: Övervakning, mätning, analys, utvärdering
          description: Övervaka, mäta, analysera och utvärdera ISMS:s prestanda och effektivitet med hjälp av lämpliga
            metoder i linje med organisationens mål.
        es:
          name: Seguimiento, medición, análisis, evaluación
          description: Monitorear, medir, analizar y evaluar el desempeño y la efectividad del SGSI utilizando métodos
            apropiados alineados con los objetivos de la organización.
        de:
          name: Überwachung, Messung, Analyse und Bewertung
          description: Leistungskennzahlen, Überwachungsergebnisse und Analyseverfahren werden angewendet, um Wirksamkeit,
            Angemessenheit und Effizienz des ISMS zu bewerten
        zh:
          name: 监测、测量、分析、评估
          description: 使用符合组织目标的适当方法，监控、测量、分析和评估ISMS的绩效和有效性。
        pl:
          name: Monitorowanie, pomiary, analiza i ocena
          description: Monitorowanie, mierzenie, analizowanie i ocena działania i skuteczności SZBI odpowiednimi
            metodami.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 7.1

            Ustawa o KSC: KSC-12 (art. 8 ust. 1 pkt 2 lit. h)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:9.2
      assessable: false
