          description: Cette mesure de sécurité définit et applique des exigences de sécurité pour les applications
            afin de protéger contre les vulnérabilités.
        cs:
          name: Požadavky na zabezpečení aplikací
          description: Tato kontrola definuje a vynucuje bezpečnostní požadavky pro aplikace, aby byla chráněna
            před zranitelnostmi.
        sv:
          name: Säkerhetskrav för program
          description: Den här kontrollen definierar och tillämpar säkerhetskrav för program för att skydda mot
            säkerhetsrisker.
        es:
          name: Requisitos de seguridad de las aplicaciones
          description: Este control define y aplica los requisitos de seguridad de las aplicaciones para protegerse
            contra vulnerabilidades.
        de:
          name: Anforderungen an die Anwendungssicherheit
          description: Diese Steuerungsmaßnahme stellt sicher, dass für Anwendungen klare Sicherheitsanforderungen
            definiert, dokumentiert und umgesetzt werden, um Schwachstellen und Sicherheitsrisiken zu vermeiden.
        zh:
          name: 应用安全要求
          description: 这种控制定义并执行应用程序的安全要求，以防范漏洞。
        pl:
          name: Wymagania bezpieczeństwa aplikacji
          description: Zabezpieczenie określa i egzekwuje wymagania bezpieczeństwa dla aplikacji w celu ochrony
            przed podatnościami.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.2 (mapowanie uzupełniające
            Octopus Lab)

            Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.27
