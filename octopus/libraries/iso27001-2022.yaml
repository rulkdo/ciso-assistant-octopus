      ref_id: A.8.30
      name: Outsourced development
      description: This control ensures security risks are managed effectively when development is outsourced to
        third-party vendors.
      implementation_groups:
      - SoA
      reference_controls:
      - urn:intuitem:risk:function:doc-pol:a.8.30
      translations:
        fr:
          name: Développement externalisé
          description: Cette mesure de sécurité garantit que les risques de sécurité sont gérés efficacement lorsque
            le développement est externalisé à des fournisseurs tiers.
        cs:
          name: Outsourcovaný vývoj (Externí zdroje)
          description: Tato kontrola zajišťuje efektivní řízení bezpečnostních rizik, když je vývoj zadáván externím
            dodavatelům.
        sv:
          name: Outsourcad utveckling
          description: Den här kontrollen säkerställer att säkerhetsrisker hanteras effektivt när utvecklingen läggs
            ut på entreprenad till tredjepartsleverantörer.
        es:
          name: Desarrollo externalizado
          description: Este control garantiza que los riesgos de seguridad se gestionen de forma eficaz cuando el
            desarrollo se externaliza a proveedores externos.
        de:
          name: Ausgegliederte Entwicklung
          description: Diese Steuerungsmaßnahme stellt sicher, dass bei ausgelagerter Entwicklung Sicherheitsanforderungen
            vertraglich und organisatorisch geregelt, überwacht und durchgesetzt werden.
        zh:
          name: 外包开发
          description: 这种控制确保在开发外包给第三方供应商时安全风险得到有效管理。
        pl:
          name: Wytwarzanie oprogramowania zlecone na zewnątrz
          description: Zabezpieczenie zapewnia skuteczne zarządzanie ryzykami bezpieczeństwa, gdy wytwarzanie oprogramowania
            jest zlecane zewnętrznym dostawcom.
          annotation: 'NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 5.1

            Ustawa o KSC: KSC-09 (art. 8 ust. 1 pkt 2 lit. e)'
    - urn: urn:intuitem:risk:req_node:iso27001-2022:a.8.31
