          de management de la sécurité — Exigences
      cs:
        name: Mezinárodní norma ISO/IEC 27001:2022
        description: Informační bezpečnost, kyberentická bezpečnost a ochrana soukromí - Systémy managementu informační
          bezpečnosti - Požadavky
      sv:
