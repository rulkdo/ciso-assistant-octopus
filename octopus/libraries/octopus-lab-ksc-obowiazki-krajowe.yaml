  threats:
  - urn: urn:octopuslab:risk:threat:ol-001
    ref_id: OL-001
    name: Długotrwała niedostępność kluczowej osoby
    description: Choroba, wypadek, śmierć albo odejście osoby, która jako jedyna ma wiedzę i dostęp do systemów;
      brak obsługi, odnowień i reakcji na incydenty.
  - urn: urn:octopuslab:risk:threat:ol-002
    ref_id: OL-002
    name: Błąd ludzki przy zmianie konfiguracji
    description: Pomyłka przy zmianie strefy DNS, konfiguracji serwera lub aktualizacji, powodująca niedostępność
      albo osłabienie zabezpieczeń.
  - urn: urn:octopuslab:risk:threat:ol-003
    ref_id: OL-003
    name: Nieodnowienie domeny lub certyfikatu w terminie
    description: Wygaśnięcie nazwy domeny albo certyfikatu z powodu przeoczenia, problemu z płatnością lub awarii
      automatu odnowień.
  - urn: urn:octopuslab:risk:threat:ol-004
    ref_id: OL-004
    name: Awaria, upadłość lub zmiana warunków dostawcy
    description: Długotrwała niedostępność usługi dostawcy, jego upadłość, wypowiedzenie umowy albo istotna zmiana
      warunków świadczenia usługi.
  - urn: urn:octopuslab:risk:threat:ol-005
    ref_id: OL-005
    name: Zdarzenie fizyczne lub środowiskowe w miejscu pracy
    description: Pożar, zalanie, brak zasilania lub łącza internetowego w miejscu, z którego administruje się systemami.
