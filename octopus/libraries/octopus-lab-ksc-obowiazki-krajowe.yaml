locale: pl
ref_id: ksc-obowiazki-krajowe
name: Ustawa o KSC - obowiązki krajowe (Octopus Lab)
description: 'Obowiązki podmiotów kluczowych i ważnych z ustawy z dnia 5 lipca 2018 r. o krajowym systemie cyberbezpieczeństwa
  po nowelizacji (Dz.U. z 2026 r. poz. 252), w tym obowiązki, których nie obejmuje załącznik do rozporządzenia wykonawczego
  Komisji (UE) 2024/2690: wpis do wykazu, kierownik podmiotu, osoby do kontaktów i S46, dokumentacja, zgłaszanie
  incydentów, audyt, dane rejestracyjne domen. Uzupełnienie audytu 2024/2690. Stan prawny na 26.10.2026 r. Zawiera
  też pięć zagrożeń OL-001..OL-005 uzupełniających katalog intuitem.'
copyright: Octopus Lab. Treść wymagań streszcza przepisy i nie jest tekstem urzędowym.
version: 1
publication_date: 2026-10-26
provider: Octopus Lab
packager: octopuslab
