    ref_id: ksc-obowiazki-krajowe
    name: Ustawa o KSC - obowiązki krajowe
    description: '54 obowiązki z ustawy o KSC w ośmiu grupach A-H. Grupy wdrożeniowe: PK - podmiot kluczowy, PW
      - podmiot ważny, DOM - podmiot świadczący usługi rejestracji nazw domen (art. 16b-16c). Dla rejestratora domen
      wybierz PK i DOM.'
    implementation_groups_definition:
    - ref_id: PK
      name: Podmiot kluczowy
      description: Wszystkie obowiązki z art. 8-11 oraz audyt z art. 15.
    - ref_id: PW
      name: Podmiot ważny
      description: Obowiązki z art. 8-11, bez obowiązkowego audytu z art. 15.
    - ref_id: DOM
      name: Rejestracja nazw domen
      description: Obowiązki dotyczące danych rejestracyjnych nazw domen (art. 16b-16c).
