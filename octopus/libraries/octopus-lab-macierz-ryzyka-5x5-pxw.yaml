description: Macierz 5x5 prawdopodobieństwo x wpływ zgodna z metodyką ISO/IEC 27005 (metodyka szacowania ryzyka
  Octopus Lab). Do szacowania ryzyka w SZBI podmiotów NIS2/KSC i ISO 27001.
