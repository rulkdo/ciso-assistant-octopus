urn: urn:octopuslab:risk:preset:nis2-ksc-octopus-4x4
locale: pl
ref_id: preset-octopus-nis2-ksc-octopus-4x4
name: NIS2 i KSC - Octopus Lab (macierz 4x4 S x P)
description: Konfiguracja Octopus Lab dla podmiotów kluczowych i ważnych według ustawy o KSC (NIS2) z odniesieniem
  do ISO/IEC 27001:2022. Ładuje załącznik do rozporządzenia 2024/2690, obowiązki krajowe z ustawy o KSC, ISO 27001
  z mapowaniem i macierz 4x4 skutek x prawdopodobieństwo, skutek z klasyfikacji CIA aktywa. Tworzy audyty, szacowanie
  ryzyka ze scenariuszami startowymi, zbiory ustaleń, harmonogram czynności Z-01..Z-20 i ścieżkę wdrożenia.
version: 2
provider: Octopus Lab
packager: octopuslab
dependencies:
- urn:intuitem:risk:library:annex-technical-and-methodological-requirements-nis2
- urn:octopuslab:risk:library:ksc-obowiazki-krajowe
- urn:intuitem:risk:library:iso27001-2022
- urn:intuitem:risk:library:mapping-annex-technical-and-methodological-requirements-nis2-and-iso27001-2022
- urn:intuitem:risk:library:intuitem-common-catalog
- urn:octopuslab:risk:library:ocena-dostawcy-ict
- urn:octopuslab:risk:library:macierz-ryzyka-4x4-sxp
objects:
  preset:
    profile:
      company_size:
      - micro
      - sme
      - large
      industry:
      - general
      - critical-infrastructure
      region:
      - eu
      goal: nis2-compliance
    feature_flags:
      enable:
      - compliance
      - risk_management
      - risk_acceptances
      - exceptions
      - incidents
      - tasks
      - control_plan
      - follow_up
      - findings_from_requirements
      - tprm
      - contracts
      - reports
      - notification_center
      - terminologies
      - comments
    scaffolded_objects:
    - type: risk_assessment
      name: Szacowanie ryzyka SZBI
      risk_matrix: urn:octopuslab:risk:library:macierz-ryzyka-4x4-sxp
      ref: main_ra
    - type: compliance_assessment
      name: 'Audyt NIS2: rozporządzenie 2024/2690'
      framework: urn:intuitem:risk:library:annex-technical-and-methodological-requirements-nis2
      create_suggested_controls: false
      ref: nis2_audit
    - type: compliance_assessment
      name: 'Audyt KSC: obowiązki krajowe'
      framework: urn:octopuslab:risk:library:ksc-obowiazki-krajowe
      ref: ksc_audit
    - type: findings_assessment
      name: Analiza luk (audyt zerowy)
      category: audit
      ref: gap_findings
    - type: findings_assessment
      name: Skany podatności
      category: self_identified
      ref: vuln_findings
    - type: task_template
      name: Z-01 Przegląd alertów monitoringu i dzienników zdarzeń
      description: Przegląd alertów z monitoringu dostępności, SIEM/EDR i dzienników zdarzeń. Zdarzenia wymagające
        oceny rejestrujesz jako incydenty. Czynność może być wykonywana częściej (codziennie, co tydzień); w CISO
        Assistant oznaczasz ją raz w miesiącu jako potwierdzenie, że w tym miesiącu była robiona. Ślad (zrzut, notatka,
        raport) w folderze miesiąca w archiwum dokumentów.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
    - type: task_template
      name: Z-02 Przegląd i instalacja aktualizacji bezpieczeństwa
      description: Sprawdzenie oczekujących aktualizacji systemów, aplikacji i urządzeń sieciowych oraz ich instalacja
        w terminach z procesu zarządzania podatnościami (2024/2690 pkt 6.6). Czynność może być wykonywana częściej
        (codziennie, co tydzień); w CISO Assistant oznaczasz ją raz w miesiącu jako potwierdzenie, że w tym miesiącu
        była robiona. Ślad (zrzut, notatka, raport) w folderze miesiąca w archiwum dokumentów.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
    - type: task_template
      name: Z-03 Skan podatności systemów z rejestru aktywów
      description: Skan podatności wszystkich systemów wspierających usługi. Wynik jako dowód, istotne pozycje jako
        ustalenia w zbiorze ustaleń Skany podatności (2024/2690 pkt 6.10).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
    - type: task_template
      name: Z-04 Kontrola wykonania kopii zapasowych
      description: Sprawdzenie, czy wszystkie zadania kopii zakończyły się poprawnie i czy kopia odporna na usunięcie
        jest aktualna (2024/2690 pkt 4.2).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
    - type: task_template
      name: Z-05 Kontrola terminów certyfikatów, domen, licencji i umów wsparcia
      description: Przegląd dat wygaśnięcia certyfikatów, domen, licencji i umów serwisowych na najbliższe 60 dni.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
    - type: task_template
      name: Z-06 Comiesięczny przegląd SZBI
      description: Przegląd ryzyk, incydentów, ustaleń i środków z terminami. Zaległości zgłaszasz kierownikowi
        podmiotu.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: MONTHLY
    - type: task_template
      name: Z-07 Test odtworzenia kopii (wybrany system)
      description: Odtworzenie wybranego systemu lub zbioru danych z kopii i pomiar czasu względem RTO. Protokół
        jako dowód (2024/2690 pkt 4.2).
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
    - type: task_template
      name: Z-08 Przegląd kont, uprawnień i MFA
      description: Przegląd kont użytkowników, kont uprzywilejowanych i serwisowych, MFA, kluczy i tokenów API.
        Usunięcie zbędnych dostępów (2024/2690 pkt 11).
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
    - type: task_template
      name: Z-09 Przegląd rejestru aktywów
      description: 'Aktualizacja rejestru aktywów: nowe i wycofane systemy, właściciele, klasyfikacja CIA, zależności
        (2024/2690 pkt 12.4).'
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
    - type: task_template
      name: Z-10 Ocena incydentów powtarzających się
      description: Przegląd incydentów z kwartału pod kątem powtarzalności, która może czynić je poważnymi (2024/2690
        art. 4).
      is_recurrent: true
      schedule:
        interval: 3
        frequency: MONTHLY
    - type: task_template
      name: Z-11 Pełny test odtworzenia i ćwiczenie planu ciągłości działania
      description: Ćwiczenie scenariusza z planu ciągłości działania z pełnym odtworzeniem kluczowej usługi. Protokół
        i wnioski jako dowód (2024/2690 pkt 4.1).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-12 Ćwiczenie obsługi i zgłoszenia incydentu (S46)
      description: Ćwiczenie procedury obsługi incydentu z przygotowaniem wczesnego ostrzeżenia i zgłoszenia w terminach
        24 h / 72 h. Rejestruj jako incydent z etykietą cwiczenie.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-13 Szkolenie kierownika podmiotu
      description: Szkolenie z cyberbezpieczeństwa kierownika podmiotu i osoby, której powierzono obowiązki, raz
        w roku kalendarzowym (ustawa o KSC, art. 8e). Zaświadczenie jako dowód.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-14 Szkolenie pracowników z cyberbezpieczeństwa
      description: Szkolenie świadomościowe pracowników i współpracowników z listą obecności (2024/2690 pkt 8).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-15 Przegląd szacowania ryzyka i planu postępowania z ryzykiem
      description: Ponowne szacowanie ryzyka i aktualizacja planu postępowania; także po istotnej zmianie lub incydencie
        poważnym (2024/2690 pkt 2.1).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-16 Ocena dostawców krytycznych
      description: Ocena bezpieczeństwa dostawców usług ICT i ich umów, plan wyjścia dla dostawców krytycznych (2024/2690
        pkt 5).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-17 Przegląd polityk i procedur SZBI
      description: Przegląd dokumentacji SZBI pod kątem aktualności i zgodności ze stanem faktycznym, nowe wersje
        do zatwierdzenia przez kierownika (ustawa o KSC, art. 10).
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-18 Przegląd SZBI przez kierownictwo
      description: 'Roczny przegląd skuteczności SZBI: wyniki audytów, incydenty, ryzyka, cele, decyzje kierownika
        (2024/2690 pkt 2.2, ISO/IEC 27001 rozdz. 9.3).'
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-19 Weryfikacja danych w wykazie podmiotów i S46
      description: Sprawdzenie aktualności danych podmiotu, usług i osób do kontaktów w wykazie i systemie S46.
      is_recurrent: true
      schedule:
        interval: 1
        frequency: YEARLY
    - type: task_template
      name: Z-20 Audyt bezpieczeństwa systemu informacyjnego (podmiot kluczowy)
      description: Audyt z art. 15 ustawy o KSC co najmniej raz na 3 lata, przez audytora niezaangażowanego w SZBI
        w roku przed audytem. Podmiot ważny może zadanie wyłączyć.
      is_recurrent: true
      schedule:
        interval: 3
        frequency: YEARLY
    - type: risk_scenario
      name: Ransomware szyfrujący systemy i kopie zapasowe
      description: Złośliwe oprogramowanie szyfruje systemy wspierające usługę oraz dostępne z sieci kopie. Usługa
        staje, powstaje obowiązek zgłoszenia incydentu poważnego. Przypisz aktywa, których dotyczy scenariusz, i
        oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-001
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-009
      ref: rs_01
    - type: risk_scenario
      name: Przejęcie konta przez phishing lub wyciek hasła
      description: Atakujący zdobywa dane logowania pracownika lub administratora i loguje się do poczty, paneli
        administracyjnych lub VPN; brak MFA ułatwia atak. Przypisz aktywa, których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-002
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-012
      ref: rs_02
    - type: risk_scenario
      name: Atak przez dostawcę albo jego awaria
      description: Kompromitacja, awaria lub upadłość dostawcy usług ICT (chmura, hosting, MSP, oprogramowanie)
        przenosi się na usługi podmiotu. Przypisz aktywa, których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-003
      - urn:octopuslab:risk:threat:ol-004
      ref: rs_03
    - type: risk_scenario
      name: Wykorzystanie niezałatanej podatności
      description: Podatność w systemie dostępnym z internetu zostaje wykorzystana przed instalacją poprawki. Przypisz
        aktywa, których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-004
      ref: rs_04
    - type: risk_scenario
      name: Atak DDoS i niedostępność usługi
      description: Przeciążenie łącza lub usługi powoduje niedostępność dla odbiorców. Przypisz aktywa, których
        dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-007
      ref: rs_05
    - type: risk_scenario
      name: Wyciek danych
      description: Nieuprawnione ujawnienie danych klientów, kontrahentów lub pracowników, także przez nieautoryzowane
        usługi (shadow IT). Przypisz aktywa, których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-019
      ref: rs_06
    - type: risk_scenario
      name: Awaria systemu lub błąd przy zmianie konfiguracji
      description: Awaria sprzętu lub oprogramowania albo pomyłka administratora powoduje przerwę w usłudze lub
        osłabienie zabezpieczeń. Przypisz aktywa, których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-022
      - urn:octopuslab:risk:threat:ol-002
      ref: rs_07
    - type: risk_scenario
      name: Niedostępność kluczowej osoby
      description: Jedyna osoba z wiedzą i dostępem do systemów jest długotrwale niedostępna. Przypisz aktywa, których
        dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:octopuslab:risk:threat:ol-001
      ref: rs_08
    - type: risk_scenario
      name: Zdarzenie fizyczne lub środowiskowe
      description: Pożar, zalanie, brak zasilania lub kradzież sprzętu w biurze albo serwerowni. Przypisz aktywa,
        których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-020
      - urn:octopuslab:risk:threat:ol-005
      ref: rs_09
    - type: risk_scenario
      name: Niedotrzymanie obowiązków z ustawy o KSC
      description: Spóźnione zgłoszenie incydentu, brak audytu lub dokumentacji; ryzyko kar i nakazów organu nadzoru.
        Przypisz aktywa, których dotyczy scenariusz, i oceń ryzyko.
      risk_assessment_ref: main_ra
      threat_urns:
      - urn:intuitem:risk:threat:intuitem-common-catalog:ict-023
      ref: rs_10
    journey:
      steps:
      - key: scope
        title: Kwalifikacja i zakres
        description: Ustal, czy podmiot jest kluczowy czy ważny, i wybierz grupy PK albo PW (oraz DOM dla rejestracji
          domen) w audycie KSC.
        target_model: compliance-assessments
        target_ref: ksc_audit
      - key: assets
        title: Rejestr aktywów
        description: Wpisz usługi objęte ustawą jako aktywa główne i systemy, które je wspierają, jako aktywa wspierające.
          Nadaj klasyfikację CIA i właściciela.
        target_model: assets
      - key: suppliers
        title: Dostawcy
        description: 'Dodaj dostawców usług ICT i oceń krytycznych (łańcuch dostaw, 2024/2690 pkt 5): ocena podmiotu
          z ramami Ocena dostawcy ICT, grupa PEL dla krytycznych i wysokich, POD dla pozostałych.'
        target_model: entities
      - key: gap
        title: Analiza luk 2024/2690
        description: Przejdź wymagania rozporządzenia i oceń stan każdego z nich. Luki zapisz jako ustalenia.
        target_model: compliance-assessments
        target_ref: nis2_audit
      - key: risk
        title: Szacowanie ryzyka
        description: 'Oceń scenariusze startowe i dodaj własne. Metoda: macierz 4x4 skutek x prawdopodobieństwo,
          skutek z klasyfikacji CIA aktywa.'
        target_model: risk-assessments
        target_ref: main_ra
      - key: controls
        title: Plan postępowania z ryzykiem
        description: Dla każdej luki i ryzyka wpisz środek bezpieczeństwa z właścicielem i terminem.
        target_model: applied-controls
      - key: tasks
        title: Harmonogram czynności
        description: Ustaw osoby odpowiedzialne w zadaniach Z-01..Z-20. Czynności częste oznaczasz raz w miesiącu.
        target_model: task-templates
      - key: incidents
        title: Rejestr incydentów
        description: 'Incydenty rejestruj w CISO Assistant; poważne zgłaszasz przez S46: 24 h, 72 h, sprawozdanie
          po miesiącu.'
        target_model: incidents
      - key: acceptance
        title: Akceptacja ryzyka szczątkowego
        description: Kierownik podmiotu akceptuje ryzyko szczątkowe (ustawa o KSC, art. 8d).
        target_model: risk-acceptances
