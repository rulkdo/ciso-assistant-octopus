    description: 'Skutek S = najwyższa ocena C, I lub A aktywa naruszona w scenariuszu (skala 1-4), prawdopodobieństwo
      P 1-4, poziom R = S x P: niskie 1-3, średnie 4-6, wysokie 8-9, krytyczne 12-16.'
