      name: 2 - możliwe
      description: Raz na 1-5 lat.
    - id: 2
      abbreviation: '3'
      name: 3 - prawdopodobne
      description: Raz w roku.
    - id: 3
      abbreviation: '4'
      name: 4 - częste
      description: Kilka razy w roku albo znane aktywne wykorzystanie podatności.
    impact:
    - id: 0
      abbreviation: '1'
      name: 1 - niski
      description: 'Narusza aktywo z oceną 1: dane publiczne, błąd łatwy do wykrycia i poprawienia, brak wpływu
        na klientów, odtworzenie ponad 7 dni dopuszczalne.'
    - id: 1
      abbreviation: '2'
      name: 2 - średni
      description: 'Narusza aktywo z oceną 2: dane wewnętrzne, zakłócenie pracy podmiotu bez wpływu na usługi klientów,
        odtworzenie do 72 h.'
    - id: 2
      abbreviation: '3'
      name: 3 - wysoki
      description: 'Narusza aktywo z oceną 3: dane klientów i abonentów, zmiana dotykająca usług pojedynczych klientów,
        naruszenie RODO, odtworzenie do 24 h.'
    - id: 3
      abbreviation: '4'
      name: 4 - krytyczny
      description: 'Narusza aktywo z oceną 4: ujawnienie sekretów, zmiana masowa (przekierowanie lub transfer domen,
        podmiana stref albo kopii), niedostępność ponad 4 h, incydent poważny.'
    risk:
    - id: 0
      abbreviation: N
