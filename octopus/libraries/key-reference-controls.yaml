  - urn: urn:intuitem:risk:function:doc-pol:tech.mfa
    ref_id: TECH.MFA
    name: Multi-Factor Authentication (MFA)
    category: technical
    csf_function: protect
    description: 'Multi-Factor Authentication (MFA) enhances security by requiring two verification factors from
      different categories: something you know (e.g., a password), something you have (e.g., a token or smartphone),
      and something you are (e.g., a fingerprint or facial recognition).'
    annotation: 'A.8.5

      cis-v8: 6.3, 6.4, 6.5'
    translations:
      fr:
        name: Authentification Multi-Facteur (MFA)
        description: 'L''authentification multifacteur (MFA) améliore la sécurité en exigeant deux facteurs de vérification
          issus de catégories différentes : ce que vous savez (ex. : un mot de passe), ce que vous possédez (ex.
          : un jeton ou un smartphone) et ce que vous êtes (ex. : une empreinte digitale ou une reconnaissance faciale)'
      de:
        name: Multi-Faktor-Authentifizierung (MFA)
        description: 'Die Multi-Faktor-Authentifizierung erhöht die Sicherheit, indem zwei oder mehr Verifizierungsfaktoren
          aus verschiedenen Kategorien verlangt werden: Wissen (z. B. Passwort), Besitz (z. B. Token oder Smartphone)
          und Biometrie (z. B. Fingerabdruck oder Gesichtserkennung).'
      es:
        name: Autenticación multifactor (MFA)
        description: 'La autenticación multifactor (MFA) refuerza la seguridad al requerir dos factores de verificación
          de categorías diferentes: algo que sabes (por ejemplo, una contraseña), algo que tienes (por ejemplo,
          un token o un teléfono móvil) y algo que eres (por ejemplo, una huella dactilar o reconocimiento facial).'
      pl:
        name: Uwierzytelnianie wieloskładnikowe (MFA)
        description: 'Uwierzytelnianie wieloskładnikowe (MFA) zwiększa bezpieczeństwo, wymagając dwóch składników
          weryfikacji z różnych kategorii: coś, co wiesz (np. hasło), coś, co masz (np. token lub smartfon), oraz
          coś, czym jesteś (np. odcisk palca lub rozpoznawanie twarzy).


          Źródło: katalog intuitem, powiązany z: ISO/IEC 27001:2022, CIS Controls v8.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

