  - urn: urn:intuitem:risk:function:doc-pol:train.hardening
    ref_id: TRAIN.HARDENING
    name: Hardening and Secure Configuration Training
    category: process
    csf_function: govern
    description: 'Objective: Equip participants with the knowledge to implement secure configurations and harden
      systems to reduce vulnerabilities.

      Audience: IT administrators, system engineers, security professionals.

      Topics:

      - Principles of system hardening.

      - Hardening operating systems (Windows, Linux).

      - Securing databases (e.g., MySQL, PostgreSQL).

      - Network device hardening (firewalls, routers, switches).

      - Applying CIS Benchmarks and ANSSI guidelines.

      - Tools for automation (e.g., Ansible, Puppet, Chef).

      Methods:

      - Hands-on labs for OS and application hardening.

      - Case studies on hardening failures and solutions.

      Outcome: Participants will gain the ability to implement secure configurations and improve overall system
      resilience.'
    annotation: '7.2

      A.5.23

      A.5.12

      A.5.16

      A.5.35'
    translations:
      fr:
        name: Formation sur le Durcissement des Systèmes
        description: 'Objectif : Former les participants à appliquer des configurations sécurisées et à durcir les
          systèmes pour réduire les vulnérabilités.

          Public : Administrateurs IT, ingénieurs systèmes, professionnels de la sécurité.

          Sujets :

          - Principes fondamentaux du durcissement des systèmes.

          - Durcissement des systèmes d’exploitation (Windows, Linux).

          - Sécurisation des bases de données (ex. : MySQL, PostgreSQL).

          - Durcissement des équipements réseau (pare-feu, routeurs, switchs).

          - Application des benchmarks CIS et recommandations ANSSI.

          - Automatisation des configurations (ex. : Ansible, Puppet, Chef).

          Méthodes :

          - Ateliers pratiques pour le durcissement des systèmes et applications.

          - Études de cas sur les échecs de durcissement et leurs solutions.

          Résultat : Les participants maîtriseront la mise en œuvre de configurations sécurisées et l''amélioration
          de la résilience des systèmes.'
      de:
        name: Schulung zu Hardening und sicherer Konfiguration
        description: 'Zielsetzung: Vermittlung von Wissen zur Umsetzung sicherer Konfigurationen und zur Härtung
          von Systemen, um Schwachstellen zu reduzieren.

          Zielgruppe: IT-Administratoren, Systemingenieure, Sicherheitsexperten.

          Themen:

          - Grundprinzipien der Systemhärtung.

          - Härtung von Betriebssystemen (Windows, Linux).

          - Sicherung von Datenbanken (z. B. MySQL, PostgreSQL).

          - Härtung von Netzwerkgeräten (Firewalls, Router, Switches).

          - Anwendung von CIS-Benchmarks und ANSSI-Richtlinien.

          - Werkzeuge für Automatisierung (z. B. Ansible, Puppet, Chef).

          Methoden:

          - Praktische Übungen zur Härtung von Betriebssystemen und Anwendungen.

          - Fallstudien zu Härtungsfehlern und deren Lösungen.

          Ergebnis: Teilnehmende können sichere Konfigurationen implementieren und die allgemeine Systemresilienz
          verbessern.'
      es:
        name: Formación en bastionado y configuración segura
        description: 'Objetivo: Dotar a los participantes de los conocimientos necesarios para implementar configuraciones
          seguras y bastionar los sistemas con el fin de reducir vulnerabilidades.

          Destinatarios: Administradores de TI, ingenieros de sistemas y profesionales de la seguridad.

          Contenidos:

          -Principios del bastionado de sistemas.

          -Bastionado de sistemas operativos (Windows, Linux).

          -Aseguramiento de bases de datos (por ejemplo, MySQL, PostgreSQL).

          -Bastionado de dispositivos de red (cortafuegos, routers, switches).

          -Aplicación de los CIS Benchmarks y de las directrices de la ANSSI.

          -Herramientas de automatización (por ejemplo, Ansible, Puppet, Chef).

          Métodos:

          -Laboratorios prácticos para el bastionado de sistemas operativos y aplicaciones.

          -Estudios de casos sobre fallos de bastionado y soluciones.

          Resultado: Los participantes adquirirán la capacidad de implementar configuraciones seguras y mejorar
          la resiliencia global de los sistemas.'
      pl:
        name: Szkolenie z utwardzania (hardening) i bezpiecznej konfiguracji
        description: 'Cel: wyposażenie uczestników w wiedzę pozwalającą wdrażać bezpieczne konfiguracje i utwardzać
          systemy w celu ograniczenia podatności.

          Odbiorcy: administratorzy IT, inżynierowie systemów, specjaliści ds. bezpieczeństwa.

          Tematy:

          - Zasady utwardzania systemów.

          - Utwardzanie systemów operacyjnych (Windows, Linux).

          - Zabezpieczanie baz danych (np. MySQL, PostgreSQL).

          - Utwardzanie urządzeń sieciowych (zapory sieciowe, routery, przełączniki).

          - Stosowanie CIS Benchmarks i wytycznych ANSSI.

          - Narzędzia do automatyzacji (np. Ansible, Puppet, Chef).

          Metody:

          - Praktyczne laboratoria z utwardzania systemów operacyjnych i aplikacji.

          - Studia przypadków dotyczące błędów w utwardzaniu i sposobów ich usunięcia.

