  - urn: urn:intuitem:risk:function:doc-pol:tech.wifi_sec
    ref_id: TECH.WIFI_SEC
    name: Wi-Fi Security
    category: technical
    csf_function: protect
    description: Wi-Fi security ensures secure wireless communications through WPA3 Enterprise encryption, robust
      authentication, and advanced access control mechanisms. While WPA2 Enterprise remains acceptable, transitioning
      to WPA3 is strongly recommended for enhanced security.
    annotation: 'A.8.20

      A.8.24'
    translations:
      fr:
        name: Sécurité Wi-Fi
        description: La sécurité Wi-Fi garantit des communications sans fil sécurisées grâce au chiffrement WPA3
          Enterprise, à une authentification robuste et à des mécanismes de contrôle d'accès avancés. Bien que WPA2
          Enterprise soit acceptable, il est fortement recommandé de passer à WPA3 pour une sécurité renforcée.
      de:
        name: WLAN-Sicherheit
        description: WLAN-Sicherheit stellt geschützte drahtlose Kommunikation sicher, u. a. durch WPA3-Enterprise-Verschlüsselung,
          starke Authentifizierung und erweiterte Zugriffskontrollen. Obwohl WPA2-Enterprise weiterhin akzeptabel
          ist, wird der Umstieg auf WPA3 für erhöhte Sicherheit dringend empfohlen.
      es:
        name: Seguridad Wi-Fi
        description: La seguridad Wi-Fi garantiza comunicaciones inalámbricas seguras mediante cifrado WPA3 Enterprise,
          autenticación robusta y mecanismos avanzados de control de acceso. Aunque WPA2 Enterprise sigue siendo
          aceptable, se recomienda encarecidamente la transición a WPA3 para una mayor seguridad.
      pl:
        name: Bezpieczeństwo sieci Wi-Fi
        description: 'Bezpieczeństwo sieci Wi-Fi zapewnia ochronę komunikacji bezprzewodowej dzięki szyfrowaniu
          WPA3 Enterprise, silnemu uwierzytelnianiu i zaawansowanym mechanizmom kontroli dostępu. Choć WPA2 Enterprise
          pozostaje akceptowalne, zdecydowanie zaleca się przejście na WPA3 w celu podniesienia poziomu bezpieczeństwa.


          Źródło: katalog intuitem, powiązany z: ISO/IEC 27001:2022.'
