  - urn: urn:intuitem:risk:function:doc-pol:doc.educ_plan
    ref_id: DOC.EDUC_PLAN
    name: Information security awareness and training plan
    category: process
    csf_function: govern
    description: 'Objective: Raise awareness for all employees and provide targeted training for relevant staff
      to promote secure behaviors, ensure compliance, and reduce risks.

      Scope: Awareness for all employees and contractors; targeted training for specific teams (e.g., IT, security,
      access managers).

      Roles and Responsibilities: Assign responsibilities to IT, HR, and security teams.

      Training Requirements: Define mandatory topics (e.g., access management, secure configurations) and frequency
      (e.g., annual, onboarding).

      Delivery Methods: Awareness through e-learning and campaigns; training through hands-on workshops and simulations.

      Evaluation: Track participation rates, quiz scores, and phishing test results.

      Compliance: Align with regulations (e.g., GDPR, ISO 27001) and maintain audit-ready records.

      Continuous Improvement: Update based on feedback and emerging threats.'
    annotation: '7.3.c

      A.6.3

      cis-v8: 14.1, 14.2, 14.9'
    translations:
      fr:
        name: Plan de sensibilisation et de formation
        description: 'Objectif : Sensibiliser l’ensemble des employés à la sécurité de l’information et former spécifiquement
          les personnes concernées pour promouvoir des comportements sécurisés, assurer la conformité et réduire
          les risques.

          Portée : Sensibilisation pour tous les employés et prestataires, formation ciblée pour les équipes concernées
          (ex. : IT, sécurité, responsables d''accès).

          Rôles et Responsabilités : Attribution des responsabilités aux équipes IT, RH et sécurité.

          Exigences de Formation : Définir les sujets obligatoires (ex. : gestion des accès, configuration sécurisée)
          et la fréquence (ex. : annuelle, à l’intégration).

          Méthodes de Diffusion : Sensibilisation via e-learning et campagnes, formation via ateliers pratiques
          et simulations.

          Évaluation : Suivre les taux de participation, les résultats des quiz et les tests de phishing.

          Conformité : S’aligner sur les réglementations (ex. : RGPD, ISO 27001) et conserver des dossiers pour
          audits.

          Amélioration Continue : Mettre à jour en fonction des retours et des menaces émergentes.'
      de:
        name: Plan für Informationssicherheitsbewusstsein und Schulungen
        description: 'Zielsetzung: Sensibilisierung aller Mitarbeitenden sowie gezielte Schulungen für relevante
          Rollen, um sicheres Verhalten zu fördern, Compliance sicherzustellen und Risiken zu reduzieren.

          Geltungsbereich: Sensibilisierung für alle Mitarbeitenden und Auftragnehmer; zielgerichtete Schulungen
          für spezifische Teams (z. B. IT, Sicherheit, Zugriffsadministration).

          Rollen und Verantwortlichkeiten: Verantwortung wird IT-, HR- und Sicherheitsteams zugewiesen.

          Schulungsanforderungen: Festlegung verpflichtender Themen (z. B. Zugriffsmanagement, sichere Konfigurationen)
          und Häufigkeiten (z. B. jährlich, Onboarding).

          Bereitstellungsmethoden: Sensibilisierung über E-Learning und Kampagnen; Schulungen über praxisorientierte
          Workshops und Simulationen.

          Evaluation: Nachverfolgung der Teilnahmequoten, Quiz-Ergebnisse und Phishing-Testresultate.

          Compliance: Ausrichtung an relevanten Vorschriften (z. B. DSGVO, ISO 27001) und Aufrechterhaltung prüfbereiter
          Nachweise.

          Kontinuierliche Verbesserung: Aktualisierung auf Basis von Feedback und neuen Bedrohungen.'
      es:
        name: Plan de concienciación y formación en seguridad de la información
        description: 'Objetivo: Sensibilizar a todos los empleados y proporcionar formación específica al personal
          pertinente para promover comportamientos seguros, garantizar el cumplimiento y reducir los riesgos.

          Alcance: Concienciación para todos los empleados y contratistas; formación específica para determinados
          equipos (por ejemplo, TI, seguridad, gestores de accesos).

          Funciones y responsabilidades: Asignar responsabilidades a los equipos de TI, RR. HH. y seguridad.

          Requisitos de formación: Definir los contenidos obligatorios (por ejemplo, gestión de accesos, configuraciones
          seguras) y la periodicidad (por ejemplo, anual, incorporación).

          Métodos de impartición: Concienciación mediante formación en línea y campañas; formación mediante talleres
          prácticos y simulaciones.

          Evaluación: Realizar el seguimiento de las tasas de participación, los resultados de los cuestionarios
          y los resultados de las pruebas de phishing.

          Cumplimiento: Alinear con la normativa (por ejemplo, RGPD, ISO 27001) y mantener registros preparados
          para auditoría.

          Mejora continua: Actualizar en función de la retroalimentación y de las amenazas emergentes.'
      pl:
        name: Plan szkoleń i podnoszenia świadomości w zakresie bezpieczeństwa informacji
        description: 'Cel: podnoszenie świadomości wszystkich pracowników i zapewnienie ukierunkowanych szkoleń
          dla właściwego personelu w celu promowania bezpiecznych zachowań, zapewnienia zgodności i ograniczenia
          ryzyk.

          Zakres: działania uświadamiające dla wszystkich pracowników i współpracowników; ukierunkowane szkolenia
          dla wybranych zespołów (np. IT, bezpieczeństwo, osoby zarządzające dostępami).

          Role i odpowiedzialności: przypisanie odpowiedzialności zespołom IT, HR i bezpieczeństwa.

          Wymagania szkoleniowe: określenie obowiązkowych tematów (np. zarządzanie dostępem, bezpieczne konfiguracje)
          i częstotliwości (np. raz w roku, przy wdrożeniu nowego pracownika).

          Metody realizacji: podnoszenie świadomości poprzez e-learning i kampanie; szkolenia w formie praktycznych
          warsztatów i symulacji.

          Ocena: monitorowanie frekwencji, wyników quizów i testów phishingowych.

          Zgodność: dostosowanie do przepisów (np. RODO, ISO 27001) i prowadzenie dokumentacji gotowej do audytu.

          Ciągłe doskonalenie: aktualizacja na podstawie informacji zwrotnych i pojawiających się zagrożeń.


          Źródło: katalog intuitem, powiązany z: ISO/IEC 27001:2022, CIS Controls v8.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - ISO/IEC 27001:2022, rozdziały: 7.3 c)

          - ISO/IEC 27001:2022, załącznik A: A.6.3

          - CIS Controls v8: 14.1, 14.2, 14.9

