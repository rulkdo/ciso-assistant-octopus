urn: urn:intuitem:risk:library:doc-pol
locale: en
ref_id: usual-controls
name: CISO Assistant Key Reference Controls
description: 'Curated set of key reference controls maintained by intuitem: policies, procedures, documents, training,
  technical and physical capabilities. Covers governance, access, data protection, resilience, privacy, AI, cloud
  and physical domains. Frameworks across CISO Assistant reference these controls to drive applied-control suggestions.
  URN namespace preserved from the legacy `doc-pol` library.'
copyright: © intuitem - 2026
version: 9
publication_date: 2026-10-27
provider: intuitem
packager: intuitem
translations:
  fr:
    name: Mesures de référence clés CISO Assistant
    description: 'Ensemble sélectionné de mesures de référence clés maintenu par intuitem : politiques, procédures,
      documents, formations, capacités techniques et physiques. Couvre la gouvernance, les accès, la protection
      des données, la résilience, la vie privée, l''IA, le cloud et la sécurité physique. Les référentiels de CISO
      Assistant s''y rattachent pour alimenter les suggestions de mesures appliquées. L''espace de noms URN `doc-pol`
      est conservé pour compatibilité.'
  de:
    name: Übliche Referenzkontrollen
    description: Übliche Dokumente, Richtlinien, Verfahren, Schulungen und technischen Kontrollen, die von intuitem
      empfohlen werden
  es:
    name: Controles de referencia de uso común
    description: Documentación, políticas, procedimientos, formación y controles técnicos habituales recomendados
      por Intuitem
  pl:
    name: Wzorcowe środki kluczowe CISO Assistant (katalog intuitem)
    description: 'Katalog wzorcowych środków prowadzony przez intuitem: polityki, procedury, dokumenty i rejestry,
      szkolenia, zdolności techniczne i fizyczne. Obejmuje zarządzanie, dostęp, ochronę danych, odporność, prywatność,
      AI, chmurę i bezpieczeństwo fizyczne. Każdy środek ma w adnotacji powiązania z ISO/IEC 27001:2022, CIS Controls
      v8 i innymi frameworkami oraz, gdzie to możliwe, z NIS2 (rozporządzenie 2024/2690) i ustawą o KSC. Polskie
      tłumaczenie: Octopus Lab.'
