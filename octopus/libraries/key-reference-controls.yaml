  - urn: urn:intuitem:risk:function:doc-pol:tech.microsegmentation
    ref_id: TECH.MICROSEGMENTATION
    name: Microsegmentation
    category: technical
    csf_function: protect
    description: Microsegmentation is a security strategy that creates fine-grained, context-aware policies to isolate
      individual workloads or applications within a network, limiting lateral movement and containing breaches.
    annotation: 'A.8.22

      cis-v8: 13.4'
    translations:
      fr:
        name: Micro-segmentation
        description: La microsegmentation est une stratégie de sécurité qui crée des politiques granulaires et contextuelles
          pour isoler des charges de travail ou des applications spécifiques dans un réseau, limitant les mouvements
          latéraux et contenant les violations
      de:
        name: Mikrosegmentierung
        description: Eine Sicherheitsstrategie, die fein granulare, kontextbezogene Richtlinien erstellt, um einzelne
          Workloads oder Anwendungen innerhalb eines Netzwerks zu isolieren, laterale Bewegungen einzuschränken
          und Sicherheitsvorfälle einzudämmen.
      es:
        name: Microsegmentación
        description: La microsegmentación es una estrategia de seguridad que crea políticas granulares y contextuales
          para aislar cargas de trabajo o aplicaciones individuales dentro de una red, limitando el movimiento lateral
          y conteniendo las brechas de seguridad.
      pl:
        name: Mikrosegmentacja
        description: 'Mikrosegmentacja to strategia bezpieczeństwa polegająca na tworzeniu szczegółowych, uwzględniających
          kontekst polityk izolujących poszczególne obciążenia (workloads) lub aplikacje w sieci, co ogranicza ruch
          boczny (lateral movement) i powstrzymuje rozprzestrzenianie się naruszeń.


          Źródło: katalog intuitem, powiązany z: ISO/IEC 27001:2022, CIS Controls v8.'
