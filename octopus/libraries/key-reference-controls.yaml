          et à garantir la conformité.'
      de:
        name: Schulung zur Aufrechterhaltung des sicheren Betriebs (MCS)
        description: 'Zielsetzung: Aufbau von Fachwissen zur Sicherung von IT-Systemen durch Monitoring, Patch-Management,
          Compliance und Incident Response.

          Zielgruppe: IT-Sicherheitsfachkräfte, Systemadministratoren, Compliance-Beauftragte und Incident-Response-Teams.

          Themen:

          - Grundprinzipien der Aufrechterhaltung von Sicherheit und deren Bedeutung in der Cybersicherheit.

          - Werkzeuge und Techniken für Sicherheitsmonitoring (z. B. SIEM, IDS).

          - Patch-Management und sichere Systemkonfigurationen.

          - Erkennung von Sicherheitsvorfällen, Planung der Reaktion und Durchführung.

          - Einhaltung von Sicherheitsrichtlinien und regulatorischen Anforderungen.

          Methoden: Praktische Labore, simulierte Szenarien und Fallstudien zur Aufrechterhaltung sicherer Systemzustände.

          Ergebnis: Erweiterte Fähigkeit, IT-Umgebungen kontinuierlich zu sichern, Risiken zu reduzieren und Compliance
          sicherzustellen.'
      es:
        name: Formación en mantenimiento de condiciones de seguridad (SCM)
        description: 'Objetivo: Desarrollar la especialización en el mantenimiento de sistemas de TI seguros mediante
          la monitorización, la gestión de parches, el cumplimiento y la respuesta a incidentes.

          Destinatarios: Profesionales de seguridad de TI, administradores de sistemas, responsables de cumplimiento
          y equipos de respuesta a incidentes.

          Contenidos:

          -Principios del mantenimiento de la seguridad y su importancia en la ciberseguridad.

          -Herramientas y técnicas de monitorización de la seguridad (por ejemplo, SIEM, IDS).

          -Gestión de parches y configuraciones seguras de los sistemas.

          -Detección de incidentes, planificación de la respuesta y ejecución.

          -Cumplimiento de las políticas de seguridad y de los requisitos normativos.

          Métodos: Laboratorios prácticos, escenarios simulados y estudios de casos sobre el mantenimiento de las
          condiciones de seguridad.

          Resultado: Mejora de la capacidad para proteger de forma continua los entornos de TI, mitigar riesgos
          y garantizar el cumplimiento.'
      pl:
        name: Szkolenie z utrzymania stanu bezpieczeństwa (SCM)
        description: 'Cel: budowanie kompetencji w zakresie utrzymywania bezpieczeństwa systemów IT poprzez monitorowanie,
          aktualizacje, zapewnianie zgodności i reagowanie na incydenty.

          Odbiorcy: specjaliści ds. bezpieczeństwa IT, administratorzy systemów, specjaliści ds. zgodności i zespoły
