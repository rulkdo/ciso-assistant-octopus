        - Zapisy zatwierdzenia przez zarząd
  - urn: urn:intuitem:risk:function:doc-pol:proc.forensics
    ref_id: PROC.FORENSICS
    name: Digital forensics and evidence handling procedure
    category: procedure
    csf_function: respond
    description: 'Collection, preservation, analysis and reporting of digital evidence during and after security
      incidents.

      Chain of custody, evidence integrity and provenance, tooling, legal and regulatory coordination.'
    typical_evidence:
    - Forensics procedure document
    - Chain of custody forms
    - Forensic tooling inventory and acquisition logs
    annotation: 'cyfun2025: RS.AN-06, RS.AN-07

      iso-27037

      iso-27002: 5.28'
    translations:
      fr:
        name: Procédure d'investigation numérique et de traitement des preuves
        description: 'Collecte, préservation, analyse et restitution des preuves numériques pendant et après un
          incident.

          Chaîne de conservation, intégrité et provenance des preuves, outillage, coordination avec le juridique
          et le régulateur.'
      de:
        name: Verfahren zur digitalen Forensik und Beweissicherung
        description: 'Erhebung, Sicherung, Analyse und Berichterstattung digitaler Beweise während und nach Sicherheitsvorfällen.

          Beweiskette, Integrität und Herkunft der Beweise, Werkzeuge, Abstimmung mit Recht und Aufsichtsbehörden.'
      es:
        name: Procedimiento de análisis forense digital y tratamiento de evidencias
        description: 'Recopilación, preservación, análisis e informe de evidencias digitales durante y después de
          los incidentes de seguridad.

          Cadena de custodia, integridad y procedencia de las evidencias, herramientas y coordinación con asesoría
          jurídica y reguladores.'
      pl:
        name: Procedura analizy powłamaniowej (informatyki śledczej) i zabezpieczania dowodów
        description: 'Gromadzenie, zabezpieczanie, analiza i raportowanie dowodów cyfrowych w trakcie incydentów
          bezpieczeństwa i po ich zakończeniu.

          Łańcuch dowodowy (chain of custody), integralność i pochodzenie dowodów, narzędzia, koordynacja z działem
          prawnym i organami regulacyjnymi.


          Źródło: katalog intuitem, powiązany z: CyberFundamentals 2025, ISO/IEC 27037, ISO/IEC 27001:2022.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - CyberFundamentals 2025 (CyFun): RS.AN-06, RS.AN-07

          - ISO/IEC 27037

          - ISO/IEC 27002:2022: 5.28

          NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 3.2, 10.4

          Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d); KSC-11 (art. 8 ust. 1 pkt 2 lit. g)'
        typical_evidence:
        - Dokument procedury informatyki śledczej
        - Formularze łańcucha dowodowego
        - Wykaz narzędzi informatyki śledczej i logi zabezpieczania dowodów
  - urn: urn:intuitem:risk:function:doc-pol:proc.tlpt
    ref_id: PROC.TLPT
    name: Threat-Led Penetration Testing (TLPT) procedure
    category: procedure
    csf_function: detect
    description: 'Scenario-driven, threat-intelligence-informed penetration testing simulating real adversary tactics,
      techniques and procedures against live production systems, people and processes.

      Distinct from standard pentesting in scope, duration and realism. TIBER-EU-aligned where applicable.'
    typical_evidence:
    - TLPT engagement scope and rules of engagement
    - Threat intelligence dossier informing the test
    - Red team report and remediation tracker
    annotation: 'dora-rts-tlpt

      norea-dora: 20

      tiber-eu'
    translations:
      fr:
        name: Procédure de tests d'intrusion guidés par la menace (TLPT)
        description: 'Tests d''intrusion fondés sur des scénarios et informés par le renseignement sur les menaces,
          simulant les tactiques, techniques et procédures d''adversaires réels sur des systèmes, personnes et processus
          de production.

          Distincts des tests d''intrusion classiques par leur périmètre, leur durée et leur réalisme. Alignés sur
          TIBER-EU lorsque pertinent.'
      de:
        name: Verfahren für bedrohungsgeführte Penetrationstests (TLPT)
        description: Szenariengestützte, durch Threat Intelligence informierte Penetrationstests, die reale Angreifer-Taktiken,
          -Techniken und -Vorgehensweisen gegen produktive Systeme, Personen und Prozesse simulieren. Abgrenzung
          zu klassischen Penetrationstests in Umfang, Dauer und Realitätsgrad.
      es:
        name: Procedimiento de pruebas de intrusión guiadas por la amenaza (TLPT)
        description: Pruebas de intrusión basadas en escenarios e informadas por inteligencia de amenazas, que simulan
          tácticas, técnicas y procedimientos de adversarios reales sobre sistemas, personas y procesos de producción.
          Diferenciadas de las pruebas de intrusión clásicas por su alcance, duración y realismo.
      pl:
        name: Procedura testów penetracyjnych opartych na analizie zagrożeń (TLPT)
        description: 'Oparte na scenariuszach i informacjach o zagrożeniach (threat intelligence) testy penetracyjne
          symulujące rzeczywiste taktyki, techniki i procedury przeciwnika wobec produkcyjnych systemów, ludzi i
          procesów.

          Różnią się od standardowych testów penetracyjnych zakresem, czasem trwania i realizmem. Zgodne z TIBER-EU,
          jeśli ma to zastosowanie.


          Źródło: katalog intuitem, powiązany z: DORA, NOREA DORA, TIBER-EU.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - DORA, RTS w sprawie testów TLPT

          - NOREA DORA: 20

          - TIBER-EU'
        typical_evidence:
        - Zakres testów TLPT i zasady ich prowadzenia
        - Raport analizy zagrożeń (threat intelligence) stanowiący podstawę testu
        - Raport z testów red team i rejestr działań naprawczych
  - urn: urn:intuitem:risk:function:doc-pol:proc.bg_screening
    ref_id: PROC.BG_SCREENING
    name: Personnel background screening procedure
    category: procedure
    csf_function: govern
    description: 'Pre-employment and periodic screening of personnel commensurate with role sensitivity: identity
      verification, criminal record checks, reference checks, qualification verification, financial integrity where
      relevant.

      Coordination with HR, legal and data-protection constraints.'
    typical_evidence:
    - Signed background screening procedure
    - Screening records per role class
    - Third-party screening provider agreements
    annotation: 'pcidss-4_0: 12.7

      iso-27002: 6.1

      cyfun2025: GV.RR-04'
    translations:
      fr:
        name: Procédure de vérification des antécédents du personnel
        description: 'Vérification pré-embauche et périodique du personnel, adaptée à la sensibilité du poste :
          vérification d''identité, casier judiciaire, prise de références, diplômes, intégrité financière lorsque
          pertinent.

          Coordination avec les RH, le juridique et les exigences de protection des données.'
      de:
        name: Verfahren zur Sicherheitsüberprüfung des Personals
        description: 'Vor- und regelmäßige Überprüfung des Personals entsprechend der Rollensensibilität: Identitätsprüfung,
          Strafregister, Referenzen, Qualifikationen, bei Bedarf finanzielle Integrität.

          Abstimmung mit HR, Recht und Datenschutzvorgaben.'
      es:
        name: Procedimiento de verificación de antecedentes del personal
        description: 'Verificación previa al empleo y periódica del personal adaptada a la sensibilidad del puesto:
          verificación de identidad, antecedentes penales, referencias, cualificaciones e integridad financiera
          cuando proceda.

          Coordinación con RR.HH., asesoría jurídica y requisitos de protección de datos.'
      pl:
        name: Procedura weryfikacji kandydatów i pracowników
        description: 'Weryfikacja personelu przed zatrudnieniem i okresowo, adekwatnie do wrażliwości roli: potwierdzenie
          tożsamości, sprawdzenie niekaralności, referencji i kwalifikacji, a w uzasadnionych przypadkach także
          wiarygodności finansowej.

          Współpraca z HR i działem prawnym z uwzględnieniem ograniczeń wynikających z ochrony danych osobowych.


          Źródło: katalog intuitem, powiązany z: PCI DSS 4.0, ISO/IEC 27001:2022, CyberFundamentals 2025.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - PCI DSS 4.0: 12.7

          - ISO/IEC 27002:2022: 6.1

          - CyberFundamentals 2025 (CyFun): GV.RR-04

          NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 10.2

          Ustawa o KSC: KSC-08 (art. 8 ust. 1 pkt 2 lit. d); KSC-27 (art. 8f)'
        typical_evidence:
        - Podpisana procedura weryfikacji kandydatów i pracowników
        - Zapisy z weryfikacji dla każdej kategorii ról
        - Umowy z zewnętrznymi dostawcami usług weryfikacji
  - urn: urn:intuitem:risk:function:doc-pol:doc.product_techdoc
    ref_id: DOC.PRODUCT_TECHDOC
    name: Product technical documentation file
    category: process
    csf_function: govern
    description: 'Per-product technical documentation covering security features and architecture, design and development
      decisions, cybersecurity risk assessment, vulnerability handling and update procedures, and the support period.

      Kept up to date and retained for the duration of the support period.'
    typical_evidence:
    - Technical documentation file per product
    - Documentation review and update records
    - Traceability to risk assessment and design decisions
    annotation: 'cra: Article 31, Annex VII

      iso-27002: 8.25'
    translations:
      fr:
        name: Dossier de documentation technique produit
        description: 'Documentation technique par produit couvrant les fonctions et l''architecture de sécurité,
          les décisions de conception et de développement, l''analyse de risque cyber, les procédures de traitement
          des vulnérabilités et de mise à jour, et la période de support.

          Maintenue à jour et conservée pendant toute la période de support.'
      de:
        name: Technische Produktdokumentation
        description: 'Technische Dokumentation je Produkt zu Sicherheitsfunktionen und -architektur, Design- und
          Entwicklungsentscheidungen, Cyberrisikoanalyse, Schwachstellenbehandlungs- und Update-Verfahren sowie
          zum Supportzeitraum.

          Aktuell gehalten und über den gesamten Supportzeitraum aufbewahrt.'
      es:
        name: Expediente de documentación técnica del producto
        description: 'Documentación técnica por producto que cubre las funciones y la arquitectura de seguridad,
          las decisiones de diseño y desarrollo, el análisis de riesgos cibernéticos, los procedimientos de gestión
          de vulnerabilidades y de actualización, y el período de soporte.

          Mantenida al día y conservada durante todo el período de soporte.'
      pl:
        name: Dokumentacja techniczna produktu
        description: 'Dokumentacja techniczna każdego produktu obejmująca funkcje i architekturę bezpieczeństwa,
          decyzje projektowe i rozwojowe, ocenę ryzyka cyberbezpieczeństwa, procedury obsługi podatności i aktualizacji
          oraz okres wsparcia.

          Aktualizowana na bieżąco i przechowywana przez cały okres wsparcia.


          Źródło: katalog intuitem, powiązany z: Cyber Resilience Act, ISO/IEC 27001:2022.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - Cyber Resilience Act (CRA): art. 31, zał. VII

          - ISO/IEC 27002:2022: 8.25

          NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.2

          Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b)'
        typical_evidence:
        - Dokumentacja techniczna dla każdego produktu
        - Zapisy z przeglądów i aktualizacji dokumentacji
        - Identyfikowalność względem oceny ryzyka i decyzji projektowych
  - urn: urn:intuitem:risk:function:doc-pol:proc.product_conformity
    ref_id: PROC.PRODUCT_CONFORMITY
    name: Product conformity assessment procedure
    category: procedure
    csf_function: govern
    description: 'Determination and execution of the conformity assessment route applicable to each product, drawing
      up and maintenance of the EU declaration of conformity and CE marking.

      Identification of the competent market surveillance authorities and of interaction and notification duties.'
    typical_evidence:
    - Conformity assessment records per product
    - EU declaration of conformity
    - Register of applicable authorities and notification channels
    annotation: 'cra: Articles 28, 30, 32, Annex V, Annex VIII'
    translations:
      fr:
        name: Procédure d'évaluation de la conformité produit
        description: 'Détermination et exécution de la procédure d''évaluation de la conformité applicable à chaque
          produit, établissement et maintien de la déclaration UE de conformité et du marquage CE.

          Identification des autorités de surveillance du marché compétentes et des obligations d''interaction et
          de notification.'
      de:
        name: Verfahren zur Konformitätsbewertung von Produkten
        description: 'Festlegung und Durchführung des für jedes Produkt geltenden Konformitätsbewertungsverfahrens,
          Erstellung und Pflege der EU-Konformitätserklärung und der CE-Kennzeichnung.

          Identifikation der zuständigen Marktüberwachungsbehörden sowie der Interaktions- und Meldepflichten.'
      es:
        name: Procedimiento de evaluación de la conformidad del producto
        description: 'Determinación y ejecución del procedimiento de evaluación de la conformidad aplicable a cada
          producto, elaboración y mantenimiento de la declaración UE de conformidad y del marcado CE.

          Identificación de las autoridades de vigilancia del mercado competentes y de las obligaciones de interacción
          y notificación.'
      pl:
        name: Procedura oceny zgodności produktu
        description: 'Określenie i przeprowadzenie procedury oceny zgodności właściwej dla każdego produktu, sporządzenie
          i aktualizowanie deklaracji zgodności UE oraz oznakowanie CE.

          Wskazanie właściwych organów nadzoru rynku oraz obowiązków w zakresie współpracy z nimi i dokonywania
          zgłoszeń.


          Źródło: katalog intuitem, powiązany z: Cyber Resilience Act.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - Cyber Resilience Act (CRA): art. 28, 30, 32, zał. V, zał. VIII'
        typical_evidence:
        - Zapisy z oceny zgodności dla każdego produktu
        - Deklaracja zgodności UE
        - Rejestr właściwych organów i kanałów zgłoszeń
  - urn: urn:intuitem:risk:function:doc-pol:doc.product_support
    ref_id: DOC.PRODUCT_SUPPORT
    name: Product support period and end-of-life commitment
    category: process
    csf_function: govern
    description: 'Customer-facing commitment per product on the support period during which security updates are
      provided, end-of-life dates and lifecycle milestones.

      Communication of end of support and of user obligations at end-of-life.'
    typical_evidence:
    - Published support and end-of-life policy per product
    - Support period register with end dates
    - Customer end-of-support notifications
    annotation: 'cra: Article 13, Annex II

      iso-27002: 8.8'
    translations:
      fr:
        name: Engagement de support produit et de fin de vie
        description: 'Engagement par produit, communiqué aux clients, sur la période de support pendant laquelle
          les mises à jour de sécurité sont fournies, les dates de fin de vie et les jalons du cycle de vie.

          Communication de la fin du support et des obligations des utilisateurs en fin de vie.'
      de:
        name: Zusage zu Produktsupportzeitraum und End-of-Life
        description: 'Kundengerichtete Zusage je Produkt zum Supportzeitraum, in dem Sicherheitsupdates bereitgestellt
          werden, zu End-of-Life-Terminen und Lebenszyklus-Meilensteinen.

          Kommunikation des Supportendes und der Nutzerpflichten am Ende des Lebenszyklus.'
      es:
        name: Compromiso de soporte y fin de vida del producto
        description: 'Compromiso por producto, comunicado a los clientes, sobre el período de soporte durante el
          cual se proporcionan actualizaciones de seguridad, las fechas de fin de vida y los hitos del ciclo de
          vida.

          Comunicación del fin del soporte y de las obligaciones de los usuarios al final de la vida útil.'
      pl:
        name: Okres wsparcia produktu i zobowiązanie dotyczące końca cyklu życia (EOL)
        description: 'Skierowane do klientów zobowiązanie dla każdego produktu określające okres wsparcia, w którym
          dostarczane są aktualizacje zabezpieczeń, daty końca cyklu życia i kluczowe etapy cyklu życia.

          Informowanie o zakończeniu wsparcia oraz o obowiązkach użytkowników po zakończeniu cyklu życia.


          Źródło: katalog intuitem, powiązany z: Cyber Resilience Act, ISO/IEC 27001:2022.'
        annotation: 'Źródło: katalog wzorcowych środków intuitem (CISO Assistant Key Reference Controls).

          Powiązania w katalogu:

          - Cyber Resilience Act (CRA): art. 13, zał. II

          - ISO/IEC 27002:2022: 8.8

          NIS2, rozporządzenie wykonawcze (UE) 2024/2690, załącznik, pkt: 6.1, 6.10

          Ustawa o KSC: KSC-06 (art. 8 ust. 1 pkt 2 lit. b); KSC-19 (art. 8 ust. 1 pkt 3)'
        typical_evidence:
        - Opublikowana polityka wsparcia i wycofania (end-of-life) dla każdego produktu
        - Rejestr okresów wsparcia z datami zakończenia
        - Powiadomienia klientów o zakończeniu wsparcia
