# Przejscie istniejacej instancji (oryginalny docker-compose.yml intuitem) na wersje Octopus Lab.
# Baza zostaje ta sama: zmienia sie tylko obraz frontendu, a backend dostaje biblioteki i presety.
# Najprosciej skryptem: octopus/aktualizuj-istniejaca-instancje.sh (pobiera ten plik jako docker-compose.octopus.yml).
# Recznie (w katalogu z dotychczasowym docker-compose.yml, katalog octopus-libraries obok):
#   docker compose -f docker-compose.yml -f docker-compose.istniejaca-instancja.yml up -d
# Szczegoly i kopia bazy przed zmiana: README.md, rozdzial "Istniejaca instancja".

x-octopus-libraries: &octopus-libraries
  - ./octopus-libraries/octopus-lab-ksc-obowiazki-krajowe.yaml:/code/library/libraries/octopus-lab-ksc-obowiazki-krajowe.yaml:ro
  - ./octopus-libraries/octopus-lab-ocena-dostawcy-ict.yaml:/code/library/libraries/octopus-lab-ocena-dostawcy-ict.yaml:ro
  - ./octopus-libraries/octopus-lab-macierz-ryzyka-5x5-pxw.yaml:/code/library/libraries/octopus-lab-macierz-ryzyka-5x5-pxw.yaml:ro
  - ./octopus-libraries/octopus-lab-macierz-ryzyka-4x4-sxp.yaml:/code/library/libraries/octopus-lab-macierz-ryzyka-4x4-sxp.yaml:ro
  - ./octopus-libraries/preset-octopus-nis2-ksc-iso27005-5x5.yaml:/code/library/libraries/preset-octopus-nis2-ksc-iso27005-5x5.yaml:ro
  - ./octopus-libraries/preset-octopus-nis2-ksc-octopus-4x4.yaml:/code/library/libraries/preset-octopus-nis2-ksc-octopus-4x4.yaml:ro
  # polskie tlumaczenia zagrozen ICT-001..ICT-023 (w miejsce oryginalu intuitem)
  - ./octopus-libraries/intuitem-common-catalog.yaml:/code/library/libraries/intuitem-common-catalog.yaml:ro
  # polskie wzorcowe srodki: katalog intuitem i ISO/IEC 27001:2022 zal. A (w miejsce oryginalow intuitem)
  - ./octopus-libraries/key-reference-controls.yaml:/code/library/libraries/key-reference-controls.yaml:ro
  - ./octopus-libraries/iso27001-2022.yaml:/code/library/libraries/iso27001-2022.yaml:ro

services:
  backend:
    # przypiecie wersji: frontend Octopus Lab jest budowany z tej samej wersji upstream
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.1.5
    pull_policy: missing
    volumes: *octopus-libraries
  huey:
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.1.5
    pull_policy: missing
  frontend:
    image: ghcr.io/rulkdo/ciso-assistant-octopus/frontend:octopus-v4.1.5
    pull_policy: missing
    environment:
      PUBLIC_DEFAULT_LANGUAGE: pl
