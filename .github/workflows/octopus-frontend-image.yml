# CISO Assistant by Octopus Lab: obraz frontendu do GHCR.
# Uruchamia sie po zmianach frontendu na galezi octopus-nis2, po tagu octopus-* albo recznie (Actions > Run workflow).
# Wynik: ghcr.io/<wlasciciel>/<repozytorium>/frontend:octopus-v4.1.5 (linia wersji upstream), :latest i :sha-<commit>,
# dla tagow takze :<tag>.
name: Octopus Lab - obraz frontendu
permissions:
  contents: read
on:
  push:
    branches:
      - octopus-nis2
    paths:
      - "frontend/**"
      - ".github/workflows/octopus-frontend-image.yml"
    tags:
      - "octopus-*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-frontend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=ref,event=tag
            type=raw,value=octopus-v4.1.5
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=CISO Assistant by Octopus Lab - frontend
            org.opencontainers.image.description=CISO Assistant Community Edition (intuitem) z brandingiem Octopus Lab i menu pod NIS2/KSC
            org.opencontainers.image.vendor=Octopus Lab
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.url=https://octopus-lab.pl
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
